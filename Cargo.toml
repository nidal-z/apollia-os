[workspace]
resolver = "2"
members = [
    "crates/apollia-core",
    "crates/apollia-runtime",
    "crates/apollia-oria",
    "crates/apollia-tools",
    "crates/apollia-memory",
    "crates/apollia-aip",
    "crates/apollia-llm",
    "crates/apollia-cli",
    "tests",
]

# Centralize all dependency versions here.
# Individual crates use { workspace = true } — never specify versions inline.
[workspace.dependencies]

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Error handling — thiserror ONLY, anyhow FORBIDDEN in all workspace crates ---
thiserror = "2"

# --- Logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- Identifiers ---
uuid = { version = "1", features = ["v4", "serde"] }

# --- API server (apollia-runtime) ---
axum = { version = "0.7", features = ["macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }

# --- CLI (apollia-cli) ---
clap = { version = "4", features = ["derive"] }

# --- SQLite — bundled = zero external system dependency (Principe #2) ---
rusqlite = { version = "0.32", features = ["bundled"] }

# --- Cryptography ---
sha2 = "0.10"

# --- Random ---
rand = "0.8"

# --- LLM (apollia-llm) ---
futures = "0.3"
async-trait = "0.1"
# async-openai, reqwest (cloud) ajoutés en STORY-053
# mistral-rs-core, tokenizers (local) ajoutés en STORY-052

# --- Python bridge (apollia-aip) ---
pyo3 = { version = "0.22", features = ["auto-initialize"] }
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }

# --- Internal crates ---
apollia-core    = { path = "crates/apollia-core" }
apollia-runtime = { path = "crates/apollia-runtime" }
apollia-oria    = { path = "crates/apollia-oria" }
apollia-tools   = { path = "crates/apollia-tools" }
apollia-memory  = { path = "crates/apollia-memory" }
apollia-aip     = { path = "crates/apollia-aip" }
apollia-llm     = { path = "crates/apollia-llm" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
