[workspace]
resolver = "2"
members = [
    "crates/apollia-auth",
    "crates/apollia-connectors",
    "crates/apollia-core",
    "crates/apollia-runtime",
    "crates/apollia-oria",
    "crates/apollia-tools",
    "crates/apollia-memory",
    "crates/apollia-aip",
    "crates/apollia-llm",
    "crates/apollia-stt",
    "crates/apollia-mcp",
    "crates/apollia-triggers",
    "crates/apollia-notifications",
    "crates/apollia-workspace",
    "crates/apollia-permissions",
    "crates/apollia-cli",
    "crates/apollia-desktop",
    "tests",
]
# apollia-desktop excluded from default builds (heavy tauri dep — use `cargo build -p apollia-desktop`)
default-members = [
    "crates/apollia-auth",
    "crates/apollia-connectors",
    "crates/apollia-core",
    "crates/apollia-runtime",
    "crates/apollia-oria",
    "crates/apollia-tools",
    "crates/apollia-memory",
    "crates/apollia-aip",
    "crates/apollia-llm",
    "crates/apollia-stt",
    "crates/apollia-mcp",
    "crates/apollia-triggers",
    "crates/apollia-notifications",
    "crates/apollia-workspace",
    "crates/apollia-permissions",
    "crates/apollia-cli",
    "tests",
]

# Centralize all dependency versions here.
# Individual crates use { workspace = true } — never specify versions inline.
[workspace.dependencies]

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Error handling — thiserror ONLY, anyhow FORBIDDEN in all workspace crates ---
thiserror = "2"

# --- Logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- Identifiers ---
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# --- API server (apollia-runtime) ---
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio-stream = { version = "0.1", features = ["sync"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }

# --- CLI (apollia-cli) ---
clap = { version = "4", features = ["derive"] }

# --- SQLite — bundled = zero external system dependency (Principe #2) ---
rusqlite = { version = "0.32", features = ["bundled"] }

# --- Cryptography ---
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"

# --- Random ---
rand = "0.8"

# --- LLM (apollia-llm) ---
futures = "0.3"
async-trait = "0.1"
# cloud backends (OpenAI-compatible + Anthropic) — [feature = "cloud"]
async-openai = "0.28"
reqwest = { version = "0.12", features = ["json", "stream"] }
# llama-cpp-2 = bindings Rust safe pour llama.cpp — ADR-042
# Compilation statique, binaire unique, 30+ architectures GGUF.
llama-cpp-2 = "0.1.144"
# llama-cpp-sys-2 = bindings FFI bruts — requis pour `llama_model_load_from_splits`
# (naming scheme custom, non exposé par le wrapper safe).
llama-cpp-sys-2 = "0.1.145"
encoding_rs = "0.8"
# LRU cache (apollia-llm MetaLlmOrchestrator)
lru = "0.12"

# --- Audio (WAV decoding for STT API) ---
hound = "3.5"

# --- Config parsing ---
toml = "0.8"
toml_edit = "0.22"

# --- Interactive password prompt (apollia-cli credentials) ---
rpassword = "7"

# --- HuggingFace model download ---
hf-hub = "0.3"

# --- Progress bars (CLI download) ---
indicatif = "0.17"

# --- System information (RAM, OS, GPU detection — apollia-desktop onboarding) ---
sysinfo = "0.31"

# --- Clipboard + keyboard simulation (apollia-desktop STT injection) ---
arboard = "3"
enigo = "0.5"

# --- File opener (cross-platform) ---
open = "5"

# --- Regular expressions ---
regex = "1"

# --- Shell word splitting (POSIX quoting) ---
shell-words = "1"

# --- Auth / OAuth2 PKCE ---
base64      = "0.22"
# `apple-native` + `linux-native` + `windows-native` route writes through
# the real OS keychain. Without these the crate's default backend is a no-op
# that returns Ok from `set_password` while persisting nothing — silent data
# loss for every secret Apollia stores (MCP OAuth, connector tokens, tool
# credentials, …). Diagnosed 2026-05-21 when MCP OAuth login appeared to
# succeed but the daemon still read NoStoredToken.
keyring     = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
urlencoding = "2"

# --- Auto-updater ---
semver    = "1"
scopeguard = "1"

# --- mDNS service discovery (apollia-mcp) ---
mdns-sd  = "0.11"
hostname = "0.4"

# --- Triggers (apollia-triggers) ---
chrono = { version = "0.4", features = ["serde"] }
cron   = "0.12"
notify = "6"

# --- Python bridge (apollia-aip) ---
pyo3 = { version = "0.24", features = ["auto-initialize"] }
pyo3-async-runtimes = { version = "0.24", features = ["tokio-runtime"] }

# --- Agent runtime (apollia-aip) — YAML datasources + Jinja2 templates (ADR-103) ---
serde_yaml = "0.9"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }

# --- Internal crates ---
apollia-core    = { path = "crates/apollia-core" }
apollia-runtime = { path = "crates/apollia-runtime" }
apollia-oria    = { path = "crates/apollia-oria" }
apollia-tools   = { path = "crates/apollia-tools" }
apollia-memory  = { path = "crates/apollia-memory" }
apollia-aip     = { path = "crates/apollia-aip" }
apollia-llm           = { path = "crates/apollia-llm", default-features = false }
apollia-stt           = { path = "crates/apollia-stt", default-features = false }
apollia-triggers      = { path = "crates/apollia-triggers" }
apollia-notifications = { path = "crates/apollia-notifications" }
apollia-mcp           = { path = "crates/apollia-mcp" }
apollia-workspace     = { path = "crates/apollia-workspace" }
apollia-permissions   = { path = "crates/apollia-permissions" }
apollia-auth          = { path = "crates/apollia-auth" }
apollia-connectors    = { path = "crates/apollia-connectors" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
