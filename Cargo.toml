[workspace]
resolver = "2"
members = [
    "crates/apollia-auth",
    "crates/apollia-connectors",
    "crates/apollia-core",
    "crates/apollia-prompts",
    "crates/apollia-runtime",
    "crates/apollia-oria",
    "crates/apollia-tools",
    "crates/apollia-memory",
    "crates/apollia-aip",
    "crates/apollia-llm",
    "crates/apollia-runner",
    "crates/apollia-stt",
    "crates/apollia-mcp",
    "crates/apollia-triggers",
    "crates/apollia-notifications",
    "crates/apollia-workspace",
    "crates/apollia-permissions",
    "crates/apollia-eval",
    "crates/apollia-cli",
    "crates/apollia-desktop",
    "tests",
]
# apollia-desktop excluded from default builds (heavy tauri dep - use `cargo build -p apollia-desktop`)
default-members = [
    "crates/apollia-auth",
    "crates/apollia-connectors",
    "crates/apollia-core",
    "crates/apollia-prompts",
    "crates/apollia-runtime",
    "crates/apollia-oria",
    "crates/apollia-tools",
    "crates/apollia-memory",
    "crates/apollia-aip",
    "crates/apollia-llm",
    "crates/apollia-runner",
    "crates/apollia-stt",
    "crates/apollia-mcp",
    "crates/apollia-triggers",
    "crates/apollia-notifications",
    "crates/apollia-workspace",
    "crates/apollia-permissions",
    "crates/apollia-eval",
    "crates/apollia-cli",
    "tests",
]

# The fuzz crate targets nightly + libFuzzer sanitizers and is built on its own
# (`cd fuzz && cargo +nightly fuzz build`). Excluded so the stable workspace
# gates never try to compile it. Mirrors how apollia-desktop is isolated above.
#
# apollia-loom-models is built only under `RUSTFLAGS="--cfg loom"`, a global flag
# that would otherwise poison the workspace's Tokio (tokio gates `tokio::net`
# behind `cfg(not(loom))`, breaking hyper-util/axum). Excluded and built on its
# own, exactly like fuzz. See its README for the run command.
exclude = ["fuzz", "crates/apollia-loom-models"]

# Shared workspace-level package metadata. Individual crates may opt into
# these defaults via `<field>.workspace = true` in their own Cargo.toml.
[workspace.package]
# True MSRV floor: the dependency tree requires >=1.89 (notify-rust 4.18 needs
# 1.89, time / serde_with / image need 1.88). The build/gate toolchain pinned
# in rust-toolchain.toml is a more recent stable.
rust-version = "1.89"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Nidal Zoumita <admin@apollia.fr>"]
repository = "https://github.com/Apollia-OS/apollia-os"
homepage = "https://apollia.fr"

# Workspace-wide lints. Gated crates opt in via `[lints] workspace = true`.
# unsafe is denied except in the FFI / proc-macro crates (apollia-aip, apollia-desktop,
# apollia-runner, apollia-tools), which carry an explicit per-crate allow.
# Bare `unwrap()` is denied in production; test code re-allows it via
# `#![cfg_attr(test, allow(clippy::unwrap_used, clippy::expect_used))]`.
[workspace.lints.rust]
unsafe_code = "deny"
# `fuzzing` is set by cargo-fuzz to gate the `#[cfg(fuzzing)]` harness shims that
# expose private parsers to the fuzz targets. `kani` is set by the Kani model
# checker to gate the `#[cfg(kani)]` proof harnesses. Declaring both keeps
# `-D warnings` green on normal builds where neither cfg is set.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(kani)'] }

[workspace.lints.clippy]
unwrap_used = "deny"

# Centralize all dependency versions here.
# Individual crates use { workspace = true } - never specify versions inline.
[workspace.dependencies]

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Error handling - thiserror ONLY, anyhow FORBIDDEN in all workspace crates ---
thiserror = "2"

# --- Logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- Identifiers ---
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# --- API server (apollia-runtime) ---
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio-stream = { version = "0.1", features = ["sync"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
# OpenAPI spec generation (apollia-runtime only; the spec is served by a plain
# handler, so there is no axum version coupling). Build-time contract artifact.
utoipa = "5"

# --- CLI (apollia-cli) ---
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4" }

# --- SQLite - bundled = zero external system dependency (Principe #2) ---
rusqlite = { version = "0.32", features = ["bundled"] }

# --- Cryptography ---
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"

# --- Random ---
# rand 0.9 = dernier major stable largement adopte (0.10 tout juste sorti,
# ecosysteme pas encore aligne : eviter les doublons de version).
rand = "0.9"

# --- LLM (apollia-llm) ---
futures = "0.3"
async-trait = "0.1"
# cloud backends (OpenAI-compatible + Anthropic) - [feature = "cloud"]
async-openai = "0.28"
reqwest = { version = "0.12", features = ["json", "stream"] }
# llama-cpp-2 = bindings Rust safe pour llama.cpp
# Compilation statique, binaire unique, 30+ architectures GGUF.
# PIN EXACT 0.1.146 : la 0.1.151 a supprime l'API OAI-compat de tool-calling
# (apply_chat_template_with_tools_oaicompat, ChatTemplateResult,
# parse_response_oaicompat) dont depend le rendu/parsing des tool calls, en
# particulier le format Mistral [TOOL_CALLS]. Ne pas bumper sans migrer ce chemin.
llama-cpp-2 = "=0.1.146"
# llama-cpp-sys-2 = bindings FFI bruts.
# ATTENTION : aucune crate ne depend directement de ce dep workspace, donc ce pin
# est INERTE (il ne contraint pas le sys transitif que llama-cpp-2 tire via son
# propre `^`). Le wrapper 0.1.146 appelle des symboles FFI absents de sys 0.1.151
# (chat-template OAI-compat) : un `cargo update` qui remonte sys a 0.1.151 casse
# le build. Le vrai verrou est le Cargo.lock (sys epingle a 0.1.146). Ne pas
# lancer `cargo update` non contraint sans re-verifier `cargo update -p
# llama-cpp-sys-2 --precise 0.1.146`.
llama-cpp-sys-2 = "=0.1.146"
encoding_rs = "0.8"
# LRU cache (apollia-llm MetaLlmOrchestrator)
lru = "0.18"

# --- Audio (WAV decoding for STT API) ---
hound = "3.5"

# --- Config parsing ---
# toml reste en 0.8.x : le passage 1.0 declenche des conflits de resolution
# (toml_datetime/toml_edit) sans gain reel ; 0.8.23 est deja recent.
toml = "1.1"
toml_edit = "0.22"

# --- Interactive password prompt (apollia-cli credentials) ---
rpassword = "7"

# --- HuggingFace model download ---
hf-hub = "0.3"

# --- Progress bars (CLI download) ---
indicatif = "0.17"

# --- System information (RAM, OS, GPU detection - apollia-desktop onboarding) ---
sysinfo = "0.31"

# --- Clipboard + keyboard simulation (apollia-desktop STT injection) ---
arboard = "3"
enigo = "0.5"

# --- File opener (cross-platform) ---
open = "5"

# --- Regular expressions ---
regex = "1"

# --- Auth / OAuth2 PKCE ---
base64      = "0.22"
# `apple-native` + `linux-native` + `windows-native` route writes through
# the real OS keychain. Without these the crate's default backend is a no-op
# that returns Ok from `set_password` while persisting nothing - silent data
# loss for every secret Apollia stores (MCP OAuth, connector tokens, tool
# credentials, …). Diagnosed 2026-05-21 when MCP OAuth login appeared to
# succeed but the daemon still read NoStoredToken.
keyring     = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
urlencoding = "2"

# --- Auto-updater ---
semver    = "1"
scopeguard = "1"

# --- mDNS service discovery (apollia-mcp) ---
mdns-sd  = "0.20"
hostname = "0.4"

# --- Triggers (apollia-triggers) ---
chrono = { version = "0.4", features = ["serde"] }
cron   = "0.17"
notify = "8"

# --- Python bridge (apollia-aip) ---
pyo3 = { version = "0.24", features = ["auto-initialize"] }
pyo3-async-runtimes = { version = "0.24", features = ["tokio-runtime"] }

# --- Agent runtime (apollia-aip) - YAML datasources + Jinja2 templates ---
serde_yaml = "0.9"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }

# --- Internal crates ---
apollia-core    = { path = "crates/apollia-core" }
apollia-prompts = { path = "crates/apollia-prompts" }
apollia-runtime = { path = "crates/apollia-runtime" }
apollia-oria    = { path = "crates/apollia-oria" }
apollia-tools   = { path = "crates/apollia-tools" }
apollia-memory  = { path = "crates/apollia-memory" }
apollia-aip     = { path = "crates/apollia-aip" }
apollia-llm           = { path = "crates/apollia-llm", default-features = false }
apollia-stt           = { path = "crates/apollia-stt", default-features = false }
apollia-triggers      = { path = "crates/apollia-triggers" }
apollia-notifications = { path = "crates/apollia-notifications" }
apollia-mcp           = { path = "crates/apollia-mcp" }
apollia-workspace     = { path = "crates/apollia-workspace" }
apollia-permissions   = { path = "crates/apollia-permissions" }
apollia-auth          = { path = "crates/apollia-auth" }
apollia-connectors    = { path = "crates/apollia-connectors" }
apollia-eval          = { path = "crates/apollia-eval" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
