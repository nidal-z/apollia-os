# Second grid on the hybrid model: the warm continuation axis, and the two
# checkpoint flags the first grid could not see.
#
# The first grid decided every verdict on cold prefill and on a warm figure that
# resent an identical prompt. Neither is the shape an agentic loop runs. A ReAct
# iteration sends the same prefix again with a tool result appended, and 1.12
# finding 1 shows that shape is served by a context checkpoint restore whose cost
# is a function of -ub: a wide micro-batch buys cold prefill and makes every
# continuation recompute more. The first grid measured the buying and not the
# selling.
#
# `warm_continuation` therefore runs first in every run. Finding 1: one request
# of exactly 4 + n_ubatch + 1 tokens leaves a checkpoint that is never erased,
# and every continuation afterwards recomputes its whole prompt. The prefill
# curve issues such a request at its 512-token point under the default -ub. A
# continuation measured after it would be measuring whether the trap fired.
#
# `cache_reuse` returns to the grid. It was excluded while the collapse was an
# uncontrolled switch larger than any effect a sweep could find; finding 1
# established the mechanism, so the exclusion is spent rather than waived.
#
# Run:  python3 sweep.py plans/sweep-qwen3.6-35b-a3b-warm.toml --dry-run
#       python3 sweep.py plans/sweep-qwen3.6-35b-a3b-warm.toml

[plan]
name = "qwen-warm-grid"
seed = 20260730
repetitions = 5
baseline_repeats = 5
probes = ["warm_continuation", "speed"]
max_tokens = 200
prompt_tok = 2048
# The pair of 1.12 finding 1: a 4096-token prefix plus a 64-token appended
# result, 4214 tokens measured. Held at those values so every warm figure here
# sits directly beside that table.
continuation_prompt_tok = 4096
continuation_suffix_tok = 64
continuation_max_tokens = 32
lengths = [512, 1024, 2048, 4096, 8192, 16384, 32768]
page_cache_first_load = "unknown"

[model]
label = "qwen3.6-35b-a3b"
path = "~/.apollia_old/models/Qwen3.6-35B-A3B-MXFP4_MOE.gguf"

[engine]
port = 8090
health_timeout_s = 300
model_load_s = 45

[baseline]
n_ctx = 32768
n_gpu_layers = 999
n_parallel = 1
cont_batching = true
flash_attn = "on"

# Single factors first. Combinations come after, and only deliberately.

[[factor]]
name = "ctx_checkpoints"
field = "ctx_checkpoints"
levels = [0, 1, 4]
note = "engine default 32; at 0 the hybrid model serves 0 of 4214 tokens from cache and prefill goes from 461 to 2541 ms, so this is a first-order lever on the warm path and was never measured"

[[factor]]
name = "cache_reuse"
field = "cache_reuse"
levels = [64, 256, 1024]
note = "engine default 0, meaning KV shifting is off; a reuse path independent of the checkpoint restore that serves the warm continuation on this model"

[[factor]]
name = "checkpoint_min_step"
field = "checkpoint_min_step"
levels = [0]
note = "engine default 8192; at 0 a seed lays down its own checkpoint even when a poisoned one is present, at a measured cost of 36 checkpoints instead of 5"

[[factor]]
name = "n_ubatch"
field = "n_ubatch"
levels = [128, 256, 1024, 2048]
note = "re-run here because the first grid saw only its cold half; the warm continuation recomputes min(n_batch, 4 + n_ubatch) tokens, so this factor is expected to disagree with itself across the two axes"

# The interaction. Both flags act on the same mechanism: -ub sets how far behind
# the end of a prompt a checkpoint is laid down, and -ctxcp sets whether any is
# laid down at all. The prediction is that at -ctxcp 0 the warm response to -ub
# vanishes, because with no checkpoints there is nothing for the restore point to
# be near. Stated before the run so the result can contradict it.
[[interaction]]
name = "n_ubatch x ctx_checkpoints"
fields = ["n_ubatch", "ctx_checkpoints"]
cells = [[2048, 0], [256, 0], [2048, 4], [256, 4]]
probes = ["warm_continuation", "speed"]
note = "predicted before running: with checkpoints disabled the warm cost of a wide micro-batch should disappear, because the recompute it causes is the distance from the restore point and there is no restore point"
