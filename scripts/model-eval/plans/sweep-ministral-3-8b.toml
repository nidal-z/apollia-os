# Confirmation set on the dense model.
#
# ministral-3-8b sits at 79.4 percent of its memory-bandwidth decode ceiling,
# and 1.4.11 records that Apple Silicon sustains 70 to 85 percent of theoretical
# peak, so this model is effectively at the wall and a launch flag has almost
# nothing to move. A full grid here would buy wall-clock rather than knowledge.
#
# What it is for: reading the same factors on a dense, full-attention model so
# the hybrid model's numbers have something to sit beside. The n_ubatch factor
# is kept whatever the hybrid grid showed, because the micro-batch response
# differential between the two architectures is the discriminator for whether
# 1.4.11's ceiling formula needs a scatter term, and a differential needs both
# sides measured.
#
# Trim the remaining factors to the ones that moved on the hybrid model before
# running this, and record which were dropped in the report.
#
# Run:  python3 sweep.py plans/sweep-ministral-3-8b.toml --dry-run

[plan]
name = "ministral-confirmation"
seed = 20260730
repetitions = 5
baseline_repeats = 5
probes = ["speed", "prefill_curve"]
max_tokens = 200
prompt_tok = 2048
lengths = [512, 1024, 2048, 4096, 8192, 16384, 32768]
page_cache_first_load = "unknown"

[model]
label = "ministral-3-8b"
path = "~/.apollia_old/models/Ministral-3-8B-Instruct-2512-Q5_K_M.gguf"

[engine]
port = 8090
health_timeout_s = 300
model_load_s = 20

[baseline]
n_ctx = 32768
n_gpu_layers = 999
n_parallel = 1
cont_batching = true
flash_attn = "on"

[[factor]]
name = "n_ubatch"
field = "n_ubatch"
levels = [256, 1024, 2048]
note = "kept unconditionally: the micro-batch response on a dense model is the control arm of the scatter test"

[[factor]]
name = "n_parallel"
field = "n_parallel"
levels = [4]
hold_slot_ctx = true
probes = ["speed", "concurrency"]

[[factor]]
name = "kv_cache_type"
fields = ["cache_type_k", "cache_type_v"]
levels = [["q8_0", "q8_0"]]
quality_gate = "toolcall"
