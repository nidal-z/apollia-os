[package]
name = "apollia-e2e-tests"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[features]
# Gate Python-dependent tests behind this flag.
# Enable with: cargo test -p apollia-e2e-tests --features python-tests
python-tests = ["dep:apollia-aip", "dep:pyo3"]

[dependencies]
apollia-core     = { workspace = true }
apollia-runtime  = { workspace = true }
apollia-oria     = { workspace = true }
apollia-tools    = { workspace = true }
apollia-llm      = { workspace = true }
apollia-triggers = { workspace = true }
tokio            = { workspace = true }
tokio-util       = { workspace = true }
uuid             = { workspace = true }
serde_json       = { workspace = true }
async-trait      = { workspace = true }
futures          = { workspace = true }
sha2             = { workspace = true }
hmac             = "0.12"
hex              = "0.4"

# Optional: only when python-tests feature is enabled
apollia-aip           = { workspace = true, optional = true }
pyo3                  = { workspace = true, optional = true }
apollia-memory       = { workspace = true }
apollia-mcp          = { workspace = true }
apollia-notifications = { workspace = true }
rusqlite              = { workspace = true }
chrono                = { workspace = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

# --- Integration test binaries ---

[[test]]
name = "test_resilience"
path = "integration/test_resilience.rs"

[[test]]
name = "test_shutdown_e2e"
path = "integration/test_shutdown_e2e.rs"

[[test]]
name = "test_budget_e2e"
