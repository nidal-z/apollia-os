# Seed apollia.toml for the automation verification ecosystem.
# Placed by build-seed.sh at <SEED_HOME>/.apollia/apollia.toml, the only
# location any surface reads. Backends live in system.db, and the folder the
# chat's file tools reach is a folder connection granted to the Apollia agent
# (fragments/system.sql and fragments/agents.sql).

[chat]
# Tool turns are sampled greedily: the model books assert the next tool call,
# and the automaton's llama-server runs at temperature 0 on a fixed seed for
# the same reason (justfile, desktop-dev-automation-seeded-llama). The
# deterministic books never reach a model, so the key is inert for them.
tool_turn_temperature = 0.0

[desktop]
# The chat books press "New conversation" many times and assert the picker
# that follows, after leaving conversations without a message behind them.
# With one empty conversation at a time, the default, that press opens the
# empty conversation again and no picker shows.
chat_single_empty = false
