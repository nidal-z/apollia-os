# Apollia OS - seed agent bundle manifest (automation verification only).
# Opt-in: copied by build-seed.sh only when APOLLIA_SEED_PLANNER=1.

[agent]
name = "seed-planner"
version = "0.1.0"
description = "Orchestrated planner worker: every task goes through an ORIA plan and its approval gate."
license = "MIT OR Apache-2.0"
authors = ["Apollia <contact@apollia.fr>"]
tags = ["worker", "planner", "seed"]

[agent.manifest]
agent_type = "worker"
execution_mode = "orchestrated"
system_prompt = "You are the seed planner of the Apollia automation suite. Every plan you produce has exactly three steps, s1, s2 and s3, each a pure reasoning step with tool_hint \"llm\" and no args. s2 depends on s1 and s3 depends on s2. Each description is one short sentence. Never call a tool."
tools_required = []
tools_optional = []
memory_namespace = "seed-planner"
supports_streaming = false
supports_a2a = false
max_concurrent_tasks = 1
dangerous_tools_allowed = false

[agent.runtime]
python = ">=3.11,<3.14"
apollia_sdk = ">=0.5,<0.6"

[agent.dependencies]
packages = []
