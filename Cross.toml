# Cross-rs (cross-rs/cross) configuration.
#
# `cross` runs cargo inside a dedicated Docker container to cross-compile.
# The container has its own sysroot (a minimal Ubuntu 22.04 for the
# `*-unknown-linux-gnu:main` images) which does NOT carry the system libs
# `cpal` (ALSA), `whisper-rs-sys` (CMake/clang) and the rest need.
#
# `pre-build` runs on every cross-build to install those deps into the
# container, before the `cargo build/check`.
#
# Cf. https://github.com/cross-rs/cross/blob/main/docs/cross_toml.md

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update",
    "apt-get install --assume-yes --no-install-recommends libasound2-dev libpulse-dev libjack-jackd2-dev cmake clang pkg-config libssl-dev",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install --assume-yes --no-install-recommends libasound2-dev:arm64 libpulse-dev:arm64 libjack-jackd2-dev:arm64 cmake clang pkg-config libssl-dev:arm64",
]
