# Pre-commit hooks for Apollia OS.
#
# Install :
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# Run on demand :
#   pre-commit run --all-files
#
# Never bypass with --no-verify. Fix the underlying issue.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      # The one path excused, anchored at both ends so it names a file and
      # not a prefix: a directory prefix here would blind the detector to
      # the twenty-six other files of `src/api/`. The exemption sits on
      # this entry rather than at the root of the file, where it would
      # also excuse the fifteen other hooks.
      - id: detect-private-key
        exclude: '^crates/apollia-runtime/src/api/tls_test_material\.rs$'
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Keep this rev in lockstep with the `ruff==` pin of the python-quality job in
  # .github/workflows/ci.yml. When the two drift, the hook and the CI enforce
  # different rule sets and a commit that passes locally fails on push.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^(sdk|agents)/
      - id: ruff-format
        files: ^(sdk|agents)/

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace
        language: system
        types: [rust]
        pass_filenames: false

      # Porte les cinq regles de prose : tiret cadratin, PII, domaine mort,
      # slug perime et renvoi de suivi interne. Il existe en script pour etre
      # lancable hors commit : la phase qui produit la prose ne commite pas,
      # donc un hook seul ne peut pas l'attraper la ou le defaut nait. Le
      # travail Prose Guard de la chaine lance ce meme script.
      - id: check-prose
        name: prose rules (em-dash, PII, dead domain, stale slug, tracker ref)
        entry: python3 scripts/check_prose.py
        language: system
        pass_filenames: false

      # The Python rules ruff cannot express: exception hierarchy rooted at
      # AgentError, the print() carve-out with written REASON exemptions,
      # PEP 563 + TypedDict, third-party imports, the agent module contract.
      - id: check-python-rules
        name: python rules beyond ruff (sdk/ and agents/)
        entry: python3 scripts/check_python_rules.py
        language: system
        files: ^(sdk|agents)/.*\.py$
        pass_filenames: false

      # The guards below run where the defect they catch is born, which is a
      # commit. The rest of the corpus stays in `just guards` alone: some need
      # a built tree, so a pre-commit entry would refuse the first commit of
      # anyone who has not run `npm install` or `cargo build`, some cost more
      # than the 3 s budget a commit can carry, and some joined the corpus
      # without a hook entry being measured for them.
      #
      # Every filter is derived from the roots the guard declares in its own
      # source, never from an intuition, and every filter names the guard's own
      # file: without that, a change to a guard escapes the guard, which is the
      # silent form of the defect these entries exist to close. The two guards
      # whose subject is the whole repository carry no filter at all, since an
      # honest one would name nearly every path.
      #
      # A filter decides when a defect is seen first, not whether it is seen:
      # `just guards` runs the seventeen unfiltered.

      - id: check-claim-anchors
        name: claim anchors (markers against CLAIMS.toml, both locales)
        entry: python3 scripts/check_claim_anchors.py
        language: system
        pass_filenames: false

      - id: check-claims
        name: declared claims against the code that backs them
        entry: python3 scripts/check_claims.py
        language: system
        pass_filenames: false

      - id: check-crate-lints
        name: every crate inherits the workspace lints
        entry: python3 scripts/check_crate_lints.py
        language: system
        files: '^(Cargo\.toml|crates/[^/]+/Cargo\.toml|scripts/check_crate_lints\.py)$'
        pass_filenames: false

      - id: check-subprocess-window
        name: no console window on spawned subprocesses
        entry: python3 scripts/check_subprocess_window.py
        language: system
        files: '^(crates/.+\.rs|scripts/check_subprocess_window\.py)$'
        pass_filenames: false

      # Ten percent on top of a commit that already pays a workspace check, and
      # its defect, a documented capability nothing installs, is born nowhere
      # else.
      - id: check-optional-builders
        name: optional builders are called somewhere
        entry: python3 scripts/check_optional_builders.py --strict
        language: system
        files: '^(crates/.+\.rs|scripts/check_optional_builders\.py)$'
        pass_filenames: false

      - id: check-tauri-ipc-args
        name: Tauri command arguments match their callers
        entry: python3 scripts/check_tauri_ipc_args.py
        language: system
        files: '^(crates/apollia-desktop/(src|ui/src)/.+|scripts/check_tauri_ipc_args\.py)$'
        pass_filenames: false

      - id: check-tauri-ipc-callers
        name: every registered Tauri command has a caller
        entry: python3 scripts/check_tauri_ipc_callers.py
        language: system
        files: '^(crates/apollia-desktop/(src|ui/src)/.+|scripts/check_tauri_ipc_callers\.py)$'
        pass_filenames: false

      - id: check-custom-event-listeners
        name: every emitted custom event has a listener
        entry: python3 scripts/check_custom_event_listeners.py
        language: system
        files: '^(crates/apollia-desktop/ui/src/.+|scripts/check_custom_event_listeners\.py)$'
        pass_filenames: false

      - id: check-docs-routes
        name: documentation routes and category files
        entry: python3 scripts/check_docs_routes.py
        language: system
        files: '^(docs/site/.+|scripts/check_docs_routes\.py)$'
        pass_filenames: false

      - id: check-docs-mirror
        name: French mirrors match their English pages in structure
        entry: python3 scripts/check_docs_mirror.py
        language: system
        files: '^(docs/site/.+|scripts/check_docs_mirror\.py)$'
        pass_filenames: false

      - id: check-docs-lang
        name: every documentation page sits under the locale of its language
        entry: python3 scripts/check_docs_lang.py
        language: system
        files: '^(docs/site/.+|scripts/check_docs_lang\.py)$'
        pass_filenames: false

      - id: check-docs-frontmatter
        name: documentation pages declare a title and a unique rank
        entry: python3 scripts/check_docs_frontmatter.py
        language: system
        files: '^(docs/site/.+|scripts/check_docs_frontmatter\.py)$'
        pass_filenames: false

      # The two roots the validator declares: the gesture scripts and the UI
      # source their anchors resolve against. An anchor renamed in a Svelte
      # component is the defect this guard exists to catch, so the UI side of
      # the filter is not optional.
      - id: automation-validate
        name: gesture corpus resolves against the UI source
        entry: python3 scripts/automation/tools/validate.py
        language: system
        files: '^(scripts/automation/.+|crates/apollia-desktop/ui/src/.+)$'
        pass_filenames: false

      - id: check-automation-derived
        name: derived automation scripts match their generators
        entry: python3 scripts/check_automation_derived.py
        language: system
        files: '^(scripts/automation/.+|scripts/check_automation_derived\.py)$'
        pass_filenames: false

      # The three data-layout guards born with the DataFile catalogue. Measured
      # at 0.24 s, 0.17 s and 0.03 s on the full tree, well under the 3 s
      # budget, and their defect (a hand-composed path, a new unversioned
      # store, a fragile persisted struct) is born in a commit touching Rust.
      - id: check-data-layout
        name: data directory layout goes through the DataFile catalogue
        entry: python3 scripts/check_data_layout.py
        language: system
        files: '^(crates/.+\.rs|tests/cli/seed/schemas/.+|scripts/check_data_layout\.py)$'
        pass_filenames: false

      - id: check-sqlite-schema-versioning
        name: every new SQLite store opens through the versioned schema layer
        entry: python3 scripts/check_sqlite_schema_versioning.py
        language: system
        files: '^(crates/.+\.(rs|sql)|scripts/check_sqlite_schema_versioning\.py)$'
        pass_filenames: false

      - id: check-serde-persisted-defaults
        name: persisted serde structs survive the addition of a field
        entry: python3 scripts/check_serde_persisted_defaults.py
        language: system
        files: '^(crates/.+\.rs|scripts/check_serde_persisted_defaults\.py)$'
        pass_filenames: false

      # Measured at 2.45 s on the full tree against the 3 s budget above, so
      # it runs on the commit rather than in `just guards` alone. No `files:`
      # filter narrows the cost: the sweep reads its whole corpus either way.
      - id: check-panic-free
        name: no unwrap/expect/panic in production Rust
        entry: python3 scripts/check_panic_free.py
        language: system
        files: '^(crates/.+\.rs|scripts/check_panic_free\.py)$'
        pass_filenames: false

      # The strict gate of the python-types CI job, runnable on the commit:
      # a stale `type: ignore` sat red on the tree for weeks while the CI
      # that carried this command was not running.
      - id: mypy-sdk
        name: mypy (strict, apollia package)
        entry: bash -c 'cd sdk && mypy apollia'
        language: system
        files: ^sdk/
        pass_filenames: false

      # The workflows were written job by job and nothing read them as a set:
      # nine movable tags, two jobs no dispatch could trigger and a policy
      # closing Dependabot PRs all lived there at once. The defect is born in
      # a commit that touches a workflow, so the guard runs there.
      - id: check-ci-workflows
        name: workflow form (SHA pins, needs, dispatch, bot filter, threads)
        entry: python3 scripts/check_ci_workflows.py
        language: system
        files: '^(\.github/workflows/.+|scripts/check_ci_workflows\.py)$'
        pass_filenames: false

      # The artifact naming contract: producer (release.yml) and consumers
      # (update.rs, the updater endpoint, the install pages) read the same
      # packaging/artifacts.json, and this guard refuses a commit that moves
      # one side alone. 0.07 s measured, under the 3 s pre-commit budget.
      - id: check-release-artifacts
        name: artifact names bind producer and consumers
        entry: python3 scripts/check_release_artifacts.py
        language: system
        files: '^(packaging/artifacts\.json|packaging/fetch-llama-server\.sh|\.github/workflows/release\.yml|crates/apollia-cli/src/commands/update\.rs|crates/apollia-desktop/tauri\.conf\.json|docs/site/docs/how-to/install-the-desktop-app\.md|docs/site/i18n/fr/docusaurus-plugin-content-docs/current/how-to/install-the-desktop-app\.md|scripts/check_release_artifacts\.py)$'
        pass_filenames: false

      # The four roots the guard declares: the packaging scripts and their
      # sums files, the desktop bundling scripts, and the workflow run blocks.
      # A download without a pinned sum is born in a commit touching one of
      # them. The upstream-digest comparison (--github) stays in CI: it needs
      # the network and a token a commit cannot assume.
      - id: check-download-sums
        name: every download is verified against a pinned sha256 sum
        entry: python3 scripts/check_download_sums.py
        language: system
        files: '^(packaging/.+|crates/apollia-desktop/scripts/.+|\.github/workflows/.+|scripts/check_download_sums\.py)$'
        pass_filenames: false

      # Blocks a commit that breaks the documentation build. The second branch
      # of the filter is measured, not guessed: docusaurus.config.js reads
      # ../../clients/openapi.json, so a spec change can break the site without
      # touching docs/site/.
      - id: docs-site-build
        name: docs site build (onBrokenLinks throw)
        entry: bash -c 'cd docs/site && npm run build'
        language: system
        files: ^(docs/site/|clients/openapi\.json$)
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - refactor
          - test
          - docs
          - chore
          - perf
          - build
          - ci
          - revert
          - style
