# Pre-commit hooks for Apollia OS.
#
# Install :
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# Run on demand :
#   pre-commit run --all-files
#
# Never bypass with --no-verify. Fix the underlying issue.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      # The one path excused, anchored at both ends so it names a file and
      # not a prefix: a directory prefix here would blind the detector to
      # the twenty-six other files of `src/api/`. The exemption sits on
      # this entry rather than at the root of the file, where it would
      # also excuse the fifteen other hooks.
      - id: detect-private-key
        exclude: '^crates/apollia-runtime/src/api/tls_test_material\.rs$'
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Keep this rev in lockstep with the `ruff==` pin of the python-quality job in
  # .github/workflows/ci.yml. When the two drift, the hook and the CI enforce
  # different rule sets and a commit that passes locally fails on push.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^sdk/
      - id: ruff-format
        files: ^sdk/

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace
        language: system
        types: [rust]
        pass_filenames: false

      # Porte les cinq regles de prose : tiret cadratin, PII, domaine mort,
      # slug perime et renvoi de suivi interne. Il existe en script pour etre
      # lancable hors commit : la phase qui produit la prose ne commite pas,
      # donc un hook seul ne peut pas l'attraper la ou le defaut nait. Le
      # travail Prose Guard de la chaine lance ce meme script.
      - id: check-prose
        name: prose rules (em-dash, PII, dead domain, stale slug, tracker ref)
        entry: python3 scripts/check_prose.py
        language: system
        pass_filenames: false

      # The eight guards below run where the defect they catch is born, which
      # is a commit. The five others of the corpus stay in `just guards`
      # alone: two need a built tree, so a pre-commit entry would refuse the
      # first commit of anyone who has not run `npm install` or `cargo build`,
      # and three cost more than the commit they would sit on.
      #
      # Every filter is derived from the roots the guard declares in its own
      # source, never from an intuition, and every filter names the guard's own
      # file: without that, a change to a guard escapes the guard, which is the
      # silent form of the defect these entries exist to close. The two guards
      # whose subject is the whole repository carry no filter at all, since an
      # honest one would name nearly every path.
      #
      # A filter decides when a defect is seen first, not whether it is seen:
      # `just guards` runs the thirteen unfiltered.

      - id: check-claim-anchors
        name: claim anchors (markers against CLAIMS.toml, both locales)
        entry: python3 scripts/check_claim_anchors.py
        language: system
        pass_filenames: false

      - id: check-claims
        name: declared claims against the code that backs them
        entry: python3 scripts/check_claims.py
        language: system
        pass_filenames: false

      - id: check-crate-lints
        name: every crate inherits the workspace lints
        entry: python3 scripts/check_crate_lints.py
        language: system
        files: '^(Cargo\.toml|crates/[^/]+/Cargo\.toml|scripts/check_crate_lints\.py)$'
        pass_filenames: false

      - id: check-subprocess-window
        name: no console window on spawned subprocesses
        entry: python3 scripts/check_subprocess_window.py
        language: system
        files: '^(crates/.+\.rs|scripts/check_subprocess_window\.py)$'
        pass_filenames: false

      # Ten percent on top of a commit that already pays a workspace check, and
      # its defect, a documented capability nothing installs, is born nowhere
      # else.
      - id: check-optional-builders
        name: optional builders are called somewhere
        entry: python3 scripts/check_optional_builders.py --strict
        language: system
        files: '^(crates/.+\.rs|scripts/check_optional_builders\.py)$'
        pass_filenames: false

      - id: check-tauri-ipc-args
        name: Tauri command arguments match their callers
        entry: python3 scripts/check_tauri_ipc_args.py
        language: system
        files: '^(crates/apollia-desktop/(src|ui/src)/.+|scripts/check_tauri_ipc_args\.py)$'
        pass_filenames: false

      - id: check-tauri-ipc-callers
        name: every registered Tauri command has a caller
        entry: python3 scripts/check_tauri_ipc_callers.py
        language: system
        files: '^(crates/apollia-desktop/(src|ui/src)/.+|scripts/check_tauri_ipc_callers\.py)$'
        pass_filenames: false

      - id: check-docs-routes
        name: documentation routes and category files
        entry: python3 scripts/check_docs_routes.py
        language: system
        files: '^(docs/site/.+|scripts/check_docs_routes\.py)$'
        pass_filenames: false

      # Blocks a commit that breaks the documentation build. The second branch
      # of the filter is measured, not guessed: docusaurus.config.js reads
      # ../../clients/openapi.json, so a spec change can break the site without
      # touching docs/site/.
      - id: docs-site-build
        name: docs site build (onBrokenLinks throw)
        entry: bash -c 'cd docs/site && npm run build'
        language: system
        files: ^(docs/site/|clients/openapi\.json$)
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - refactor
          - test
          - docs
          - chore
          - perf
          - build
          - ci
          - revert
          - style
