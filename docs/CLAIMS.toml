# ── Platform posture ─────────────────────────────────────────────────────────

[[claim]]
id = "windows-has-no-tool-sandbox"
scope = "public"
symbol = "apply_rlimits"
status = "not-wired"
proof = "crates/apollia-tools/src/tools/rlimits.rs"
evidence = "#[cfg(not(unix))]"
note = """
On Windows there is no per-process resource cap and no namespace isolation: the
non-Unix apply_rlimits is an empty function. A user choosing a platform is
entitled to know that before running an autonomous agent, not after.
"""
