The page states that cached plans never expire on their own. That is a claim of
absence dressed as a claim of presence: the only caller of `evict_expired` is
the CLI command, driven by an operator-supplied age. If a scheduler ever calls
it, the documented behaviour flips and the page must change. Guarding the CLI
call site is what makes that visible, since a new background caller would leave
this entry passing while the sentence quietly became false. Re-read the callers,
not just this gate, when touching eviction.
"""

