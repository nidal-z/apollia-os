[[claim]]
id = "oauth-microsoft-client-embedded"
scope = "public"
symbol = "MICROSOFT_DEFAULT_CLIENT_ID"
status = "wired"
proof = "crates/apollia-auth/src/connector_providers.rs"
evidence = "c4f95bc5-8895-4550-8119-ed0e548fd941"
note = """
Every operator page for Microsoft 365 now opens by saying the connector works
with nothing to configure. That sentence rests entirely on this constant being
returned by `default_client_id`, which is what flips the desktop surface from
"setup required" to a live Connect button through `detect_source` and
`oauthReadiness`.

Declared `wired` rather than `not-wired` on purpose: the guard fails if the
constant is ever defined but no longer read, which is the shape the corpus keeps
producing. Two disguises are excluded, both found by mutating the one production
read and watching the guard stay green: a doc-comment naming the symbol, and a
re-export of it. The second cost a state machine, because `apollia-auth` writes
`pub use` as a multi-line block and the symbol lands on a continuation line that
starts with neither `use` nor `//`. `check_selftest.py` pins both forms.

The client id is public by construction. RFC 8252 section 8.5 states that a
native application cannot hold a credential confidentially, so the registration
is a public client with no secret and PKCE carries the security. Embedding it is
therefore a convenience decision, not a secrets decision. See ADR-053.

What this cannot guard, and the order matters because the first item is the one
that will actually bite. The registration's **redirect platform** is invisible
from outside: an anonymous probe of the authorize endpoint returns the login page
whatever `redirect_uri` it is handed, so no check here can tell whether the app
still declares a "Mobile and desktop applications" platform listing
`http://127.0.0.1`. If that platform is removed or was never added, every user
reaches consent and then fails on AADSTS50011, after the point where the product
looked like it worked. Verified once by hand, never again by a machine.

Second, that the registration stays multi-tenant and keeps accepting personal
Microsoft accounts. That one at least is probeable, and was probed: the id
answers on `/consumers`, `/organizations` and `/common`, with a fabricated id as
the negative control returning AADSTS700016. But it lives in the Entra portal,
so a later narrowing to a single tenant would leave the code and this entry green
while every user outside the owning directory got AADSTS50020 after consenting.
"""

[[claim]]
id = "oauth-google-client-not-embedded"
scope = "public"
symbol = "GOOGLE_DEFAULT_CLIENT_ID"
status = "absent"
proof = "crates/apollia-auth/src/connector_providers.rs"
evidence = "GOOGLE_DEFAULT_CLIENT_ID"
note = """
The mirror image of the entry above, and the reason the old single claim had to
be split. Google's operator pages, its how-to and the reference page all tell
the reader to register their own OAuth client, and they are only honest while no
build embeds one. Google requires a verified consent screen before an
application may serve accounts outside its own project, and its Installed App
type also requires a client secret at the token endpoint, which a distributed
binary cannot hold.

Guarded as `absent` so that introducing a Google counterpart to
`MICROSOFT_DEFAULT_CLIENT_ID` fails this check. That is the likely name for it,
by symmetry with the constant that now exists a few lines away.

Stated plainly, because a guard-rail that oversells itself is worse than none:
this catches the symmetric constant, not every possible way to embed a Google
client. Someone determined to bake one in under another name, or through
`APOLLIA_BUILD_GOOGLE_CLIENT_ID` in a build recipe, would pass. The
`oauth-client-resolution-order` entry above keeps the build-time hook itself in
view. If a recipe ever starts feeding it, every page saying Apollia ships
without a Google client becomes false and has to change with it.
"""

