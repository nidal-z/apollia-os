# ── Platform posture ─────────────────────────────────────────────────────────

[[claim]]
id = "windows-has-no-tool-sandbox"
scope = "public"
symbol = "apply_rlimits"
status = "not-wired"
proof = "crates/apollia-tools/src/tools/rlimits.rs"
evidence = "#[cfg(not(unix))]"
note = """
On Windows there is no per-process resource cap and no namespace isolation: the
non-Unix apply_rlimits is an empty function. A user choosing a platform is
entitled to know that before running an autonomous agent, not after.
"""

[[claim]]
id = "bash-executor-requires-posix-shell"
scope = "public"
symbol = "resolve_posix_shell"
status = "wired"
proof = "crates/apollia-tools/src/tools/shell_discovery.rs"
evidence = ""
note = """
A Windows test campaign found bash_executor failing with a bare "failed to
spawn process: program not found": the syntax validator hardcoded `bash` and
ran before the shell-discovery code, which therefore had no effective caller.
One resolved shell now both validates and executes, and a host without one is
refused pre-spawn with a message naming Git Bash, MSYS2 and WSL. If nothing
calls resolve_posix_shell, the executor has gone back to guessing shell names
and the actionable refusal this page promises no longer happens.
"""

[[claim]]
id = "python-executor-locates-windows-interpreter"
scope = "public"
symbol = "locate_system_python"
status = "wired"
proof = "crates/apollia-tools/src/tools/python_discovery.rs"
evidence = ""
note = """
The old probe ran a bare `python3 --version` and trusted the exit status. On
stock Windows, `python3` is the Microsoft Store stub, so the tool silently
vanished from the dispatcher on every Windows host. Discovery now probes
`python`, `py -3`, then `python3`, and classifies the version banner. If
nothing calls locate_system_python, the constructor is back on a single
hardcoded name and Windows loses python_executor without a word.
"""

[[claim]]
id = "unavailable-tool-surfaces-reason"
scope = "public"
symbol = "UnavailableTool"
status = "wired"
proof = "crates/apollia-tools/src/native_dispatcher.rs"
