# ── Runtime state machines ───────────────────────────────────────────────────

[[claim]]
id = "process-state-transitions-enforced"
scope = "public"
symbol = "ProcessState::can_transition_to"
status = "wired"
proof = "crates/apollia-runtime/src/registry.rs"
evidence = ""
note = """
The documented agent state machine is a gate, not a convention: the registry
consults the transition table on every change and returns InvalidTransition on a
disallowed one. Drop that call and the enum keeps compiling, the diagram keeps
rendering, and nothing enforces the shape any more. That is the exact failure
this file exists to catch.
"""

[[claim]]
id = "tool-circuit-breaker-wired"
scope = "public"
symbol = "ResilienceLayer::execute_with_observability"
status = "wired"
proof = "crates/apollia-oria/src/actor.rs"
evidence = ""
note = """
The per-tool circuit breaker is only real because the step executor routes tool
calls through it. pre_check, which performs the Open and HalfOpen decisions, has
no caller outside resilience.rs itself, so this wrapper is the whole of the
wiring: if actor.rs stops calling it, the breaker becomes a data structure that
nothing consults and the documented thresholds become fiction.
"""

