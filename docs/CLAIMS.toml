[[claim]]
id = "skill-schema-built-from-typeddict-required-keys"
scope = "public"
symbol = "__required_keys__"
status = "wired"
proof = "sdk/apollia/_internal/inference.py"
evidence = ""
note = """
The ban on `from __future__ import annotations` in a module defining a TypedDict
is not style: PEP 563 stringifies annotations, and the skill schema is derived
from `__required_keys__` at registration. The agent registers, and every payload
it receives is wrong. If the schema ever stops reading the TypedDict, the rule
loses its reason and should be revisited rather than kept as folklore.
"""

