# Nightly - checks lourds qui ne tiennent pas dans la boucle PR (<15 min).
#
# Tourne :
#   - cron : tous les lundis 06:00 UTC (1 fois/semaine, suffisant)
#   - workflow_dispatch : trigger manuel quand tu veux valider à la demande
#
# Jobs :
#   - e2e-desktop      : tests E2E Tauri (lents, parfois flaky)
#   - feature-matrix   : sanity-check des features GPU sur apollia-llm/stt
#   - coverage         : rapport coverage HTML/LCOV (heavy)
#   - deep-audit       : cargo audit avec advisory DB rechargée
#
# Si un job échoue : alerte mail GH, mais main reste vert (pas de PR bloquée).

name: Nightly

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "Job spécifique à lancer (vide = tous)"
        required: false
        type: choice
        default: "all"
        options:
          - "all"
          - "e2e-desktop"
          - "multirunner-cpu-e2e"
          - "feature-matrix"
          - "coverage"
          - "deep-audit"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── E2E Desktop ────────────────────────────────────────────────────────────
  e2e-desktop:
    name: E2E Desktop
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'e2e-desktop'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-e2e-

      - name: Build CLI
        run: cargo build -p apollia-cli

      - name: Pre-build E2E binary
        run: cargo test -p apollia-desktop --test e2e --no-run

      - name: Start runtime
        run: ./target/debug/apollia-os start &

      - name: Wait for runtime ready
        run: |
          for i in $(seq 1 30); do
            TOKEN_FILE="${HOME}/.apollia/api-token"
            if [ -f "${TOKEN_FILE}" ]; then
              TOKEN=$(cat "${TOKEN_FILE}")
              if curl -sf -H "Authorization: Bearer ${TOKEN}" \
                   http://127.0.0.1:7771/api/v1/health > /dev/null 2>&1; then
                echo "Runtime ready (${i}s)"
                exit 0
              fi
            fi
            sleep 1
          done
          echo "Runtime did not become ready within 30s" >&2
          exit 1

      - name: Run E2E tests
        run: cargo test -p apollia-desktop --test e2e -- --ignored --test-threads=1

      - name: Stop runtime
        if: always()
        run: ./target/debug/apollia-os stop || true

  # ── Multi-runner CPU E2E (ADR-113) ─────────────────────────────────────────
  # Spawn le daemon + le sidecar runner CPU sur les 3 OS, vérifie le
  # handshake HTTP loopback et l'inférence end-to-end sur un GGUF léger.
  multirunner-cpu-e2e:
    name: Multi-runner CPU E2E (${{ matrix.os }})
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'multirunner-cpu-e2e'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            python3-dev clang cmake

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@v2
        with:
          key: multirunner-cpu-${{ matrix.triple }}

      - name: Build apollia-runner (local-cpu)
        shell: bash
        env:
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        run: |
          cargo build -p apollia-runner --release \
            --no-default-features \
            --features local-cpu \
            --target ${{ matrix.triple }}

      - name: Run apollia-runner IPC integration tests
        shell: bash
        run: |
          cargo test -p apollia-runner --release \
            --no-default-features \
            --features local-cpu \
            --target ${{ matrix.triple }} \
            -- --test-threads=1

      - name: Run apollia-runtime supervisor smoke tests
        shell: bash
        run: |
          cargo test -p apollia-runtime --release \
            --target ${{ matrix.triple }} \
            runner_supervisor:: -- --test-threads=1

  # ── Feature matrix sanity (apollia-runner backends, ADR-113) ───────────────
  feature-matrix:
    name: Feature ${{ matrix.crate }} (${{ matrix.feature }})
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'feature-matrix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: apollia-runner
            feature: local-cpu
          - crate: apollia-runner
            feature: local-cuda
            install_cuda: true
          - crate: apollia-runner
            feature: local-rocm
            install_rocm: true
          - crate: apollia-runner
            feature: local-vulkan
            install_vulkan: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential cmake clang pkg-config \
            libasound2-dev libpulse-dev libjack-jackd2-dev libssl-dev

      - name: Install CUDA Toolkit
        if: matrix.install_cuda
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc","cudart","cublas","cublas_dev"]'
          use-github-cache: true

      - name: Install ROCm
        if: matrix.install_rocm
        run: |
          sudo apt-get install -y wget gnupg
          wget -O- https://repo.radeon.com/rocm/rocm.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.0/ jammy main" | \
            sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update -q
          sudo apt-get install -y rocm-hip-sdk rocblas hipblas

      - name: Install Vulkan SDK
        if: matrix.install_vulkan
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/lunarg.gpg
          echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan/1.3.290 jammy main" | \
            sudo tee /etc/apt/sources.list.d/vulkan.list
          sudo apt-get update -q
          sudo apt-get install -y vulkan-sdk

      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ matrix.crate }}-${{ matrix.feature }}

      - name: cargo check
        run: cargo check -p ${{ matrix.crate }} --no-default-features --features ${{ matrix.feature }}

  # ── Coverage HTML + LCOV ───────────────────────────────────────────────────
  coverage:
    name: Coverage
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --html
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v5
        with:
          name: coverage-html-${{ github.sha }}
          path: target/llvm-cov/html/
          retention-days: 30

  # ── Deep audit (re-télécharge la DB pour catcher les advisories récentes) ──
  deep-audit:
    name: Deep Security Audit
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'deep-audit'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny full check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
