# Nightly - checks lourds qui ne tiennent pas dans la boucle PR (<15 min).
#
# Tourne :
#   - cron : tous les lundis 06:00 UTC (1 fois/semaine, suffisant)
#   - workflow_dispatch : trigger manuel quand tu veux valider à la demande
#
# Jobs :
#   - e2e-desktop      : tests E2E Tauri (lents, parfois flaky)
#   - python-tests     : suite AIP gated PyO3 (agents Python via le pont)
#   - feature-matrix   : sanity-check des features GPU sur apollia-llm/stt
#   - coverage         : rapport coverage HTML/LCOV (heavy)
#   - deep-audit       : cargo audit avec advisory DB rechargée
#   - loom             : modeles Loom d'entrelacement des actors (advisory)
#   - miri             : detection UB sur les helpers purs proches du FFI (advisory)
#   - kani             : preuves symboliques bornees des invariants cardinaux (advisory)
#
# Si un job échoue : alerte mail GH, mais main reste vert (pas de PR bloquée).

name: Nightly

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "Job spécifique à lancer (vide = tous)"
        required: false
        type: choice
        default: "all"
        options:
          - "all"
          - "e2e-desktop"
          - "python-tests"
          - "multirunner-cpu-e2e"
          - "feature-matrix"
          - "coverage"
          - "deep-audit"
          - "loom"
          - "miri"
          - "kani"
          - "fuzz-deep"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least-privilege default. Only `deep-audit` escalates (checks: write) to post
# its annotations; every other job runs read-only.
permissions:
  contents: read

jobs:
  # ── E2E Desktop ────────────────────────────────────────────────────────────
  e2e-desktop:
    name: E2E Desktop
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'e2e-desktop'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache cargo + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-e2e-

      - name: Build CLI
        run: cargo build -p apollia-cli

      - name: Pre-build E2E binary
        run: cargo test -p apollia-desktop --test e2e --no-run

      - name: Start runtime
        run: ./target/debug/apollia-os start &

      - name: Wait for runtime ready
        run: |
          for i in $(seq 1 30); do
            TOKEN_FILE="${HOME}/.apollia/api-token"
            if [ -f "${TOKEN_FILE}" ]; then
              TOKEN=$(cat "${TOKEN_FILE}")
              if curl -sf -H "Authorization: Bearer ${TOKEN}" \
                   http://127.0.0.1:7771/api/v1/health > /dev/null 2>&1; then
                echo "Runtime ready (${i}s)"
                exit 0
              fi
            fi
            sleep 1
          done
          echo "Runtime did not become ready within 30s" >&2
          exit 1

      - name: Run E2E tests
        run: cargo test -p apollia-desktop --test e2e -- --ignored --test-threads=1

      - name: Stop runtime
        if: always()
        run: ./target/debug/apollia-os stop || true

  # ── Python bridge tests (PyO3-gated AIP suite) ─────────────────────────────
  # The `python-tests` feature of apollia-e2e-tests gates the AIP integration
  # binaries that load real decorator-built Python agents through the PyO3
  # bridge. They need the Apollia SDK importable from the interpreter pointed
  # to by PYO3_PYTHON, so we pip-install the editable SDK first. Never gates a
  # PR: the heavy PyO3 link lives in nightly.
  python-tests:
    name: Python Bridge Tests
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'python-tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            python3-dev clang cmake

      - name: Install Apollia SDK (editable)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ./sdk

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: python-tests

      - name: Run PyO3-gated AIP suite
        run: |
          cargo test -p apollia-e2e-tests \
            --features python-tests \
            --no-fail-fast

  # ── Multi-runner CPU E2E ───────────────────────────────────────────────────
  # Spawn le daemon + le sidecar runner CPU sur les 3 OS, vérifie le
  # handshake HTTP loopback et l'inférence end-to-end sur un GGUF léger.
  multirunner-cpu-e2e:
    name: Multi-runner CPU E2E (${{ matrix.os }})
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'multirunner-cpu-e2e'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}

      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            python3-dev clang cmake

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: multirunner-cpu-${{ matrix.triple }}

      - name: Build apollia-runner (local-cpu)
        shell: bash
        env:
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        run: |
          cargo build -p apollia-runner --release \
            --no-default-features \
            --features local-cpu \
            --target ${{ matrix.triple }}

      - name: Run apollia-runner IPC integration tests
        shell: bash
        run: |
          cargo test -p apollia-runner --release \
            --no-default-features \
            --features local-cpu \
            --target ${{ matrix.triple }} \
            -- --test-threads=1

      - name: Run apollia-runtime supervisor smoke tests
        shell: bash
        run: |
          cargo test -p apollia-runtime --release \
            --target ${{ matrix.triple }} \
            runner_supervisor:: -- --test-threads=1

  # ── Feature matrix sanity (apollia-runner backends) ────────────────────────
  feature-matrix:
    name: Feature ${{ matrix.crate }} (${{ matrix.feature }})
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'feature-matrix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: apollia-runner
            feature: local-cpu
          - crate: apollia-runner
            feature: local-cuda
            install_cuda: true
          - crate: apollia-runner
            feature: local-rocm
            install_rocm: true
          - crate: apollia-runner
            feature: local-vulkan
            install_vulkan: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential cmake clang pkg-config \
            libasound2-dev libpulse-dev libjack-jackd2-dev libssl-dev

      - name: Install CUDA Toolkit
        if: matrix.install_cuda
        uses: Jimver/cuda-toolkit@9b295696791d75d658d8de64c4a85097ad8abeaf # v0.2.16
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc","cudart","cublas","cublas_dev"]'
          use-github-cache: true

      - name: Install ROCm
        if: matrix.install_rocm
        run: |
          sudo apt-get install -y wget gnupg
          wget -O- https://repo.radeon.com/rocm/rocm.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.0/ jammy main" | \
            sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update -q
          sudo apt-get install -y rocm-hip-sdk rocblas hipblas

      - name: Install Vulkan SDK
        if: matrix.install_vulkan
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/lunarg.gpg
          echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan/1.3.290 jammy main" | \
            sudo tee /etc/apt/sources.list.d/vulkan.list
          sudo apt-get update -q
          sudo apt-get install -y vulkan-sdk

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: feature-${{ matrix.crate }}-${{ matrix.feature }}

      - name: cargo check
        run: cargo check -p ${{ matrix.crate }} --no-default-features --features ${{ matrix.feature }}

  # ── Coverage HTML + LCOV ───────────────────────────────────────────────────
  coverage:
    name: Coverage
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-llvm-cov
      # apollia-desktop and apollia-e2e-tests do not build under the coverage
      # harness; tests/ and benches/ are ignored so the report reflects source.
      - run: |
          cargo llvm-cov --workspace \
            --exclude apollia-e2e-tests --exclude apollia-desktop \
            --ignore-filename-regex '(/tests/|/benches/)' --html
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-html-${{ github.sha }}
          path: target/llvm-cov/html/
          retention-days: 30

  # ── Mutation testing : surfaces surviving mutants (test gaps) on core crates ─
  # Advisory report only. cargo-mutants flips operators / deletes lines and
  # checks a test fails; a surviving mutant is an untested behavior. Scoped to
  # the crates that build and test in isolation, with tests restricted to the
  # mutated package so a run finishes in nightly time.
  mutants:
    name: Mutation Testing (core)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'mutants'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants
      - name: cargo mutants (permissions + core)
        run: |
          cargo mutants --test-workspace=false -j 2 \
            --package apollia-permissions --package apollia-core \
            --output mutants.out
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mutants-report-${{ github.sha }}
          path: mutants.out/
          retention-days: 30

  # ── Deep audit (re-télécharge la DB pour catcher les advisories récentes) ──
  deep-audit:
    name: Deep Security Audit
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'deep-audit'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny full check
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check all

  # ── Unsafe surface : informative report of unsafe usage across the tree ────
  # Non-blocking. cargo-geiger builds the workspace and can be brittle, so it
  # lives in nightly and never gates a PR. The report is uploaded as a text
  # artifact to track the unsafe footprint over time.
  geiger:
    name: Unsafe Surface (advisory)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'geiger'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libssl-dev libasound2-dev libpulse-dev cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: cargo geiger (report)
        run: cargo geiger --workspace --output-format Ascii | tee geiger-report.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: geiger-report-${{ github.sha }}
          path: geiger-report.txt
          retention-days: 30

  # ── Loom concurrency models (advisory) ────────────────────────────────────
  # Exhaustive interleaving check of the runtime's actor algorithms via the
  # standalone apollia-loom-models crate (excluded from the workspace because
  # `--cfg loom` poisons Tokio). No system deps: the crate has no Tokio/pyo3 in
  # its tree. Advisory, never gates a PR.
  loom:
    name: Loom Models (advisory)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'loom'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: loom
      - name: Run Loom models
        env:
          RUSTFLAGS: "--cfg loom"
          LOOM_MAX_PREEMPTIONS: "3"
        run: cargo test --manifest-path crates/apollia-loom-models/Cargo.toml --release

  # ── Miri UB check on FFI-adjacent pure helpers (advisory) ──────────────────
  # Miri interprets MIR to catch undefined behavior. It cannot execute the PyO3
  # boundary (libpython is an unsupported foreign call), so this runs only the
  # interpreter-free `miri_pure` helper suite in apollia-aip. Advisory.
  miri:
    name: Miri (advisory)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'miri'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Miri is a nightly-only component (mirrors the fuzz-deep nightly setup).
      - name: Install nightly + miri
        run: rustup toolchain install nightly --profile minimal --component miri --no-self-update
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libssl-dev cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: miri
      - name: Run Miri on FFI-adjacent pure helpers
        run: cargo +nightly miri test -p apollia-aip --lib miri_pure

  # ── Kani bounded symbolic proofs (advisory) ────────────────────────────────
  # Bit-precise model checking of the cardinal runtime invariants: the
  # non-bypassable StepBudget (apollia-oria) and the mailbox lease/ack fence
  # (apollia-runtime). Kani links its own toolchain via rustup, so it cannot run
  # on the Homebrew dev machines; it lives here, advisory, never gating a PR. The
  # `#[cfg(kani)]` harnesses prove the pure decision helpers over their whole
  # bounded domain, which the in-tree proptest mirrors only sample.
  kani:
    name: Kani Proofs (advisory)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'kani'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: kani
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Prove StepBudget invariants
        run: cargo kani -p apollia-oria
      # Scoped to the mailbox harnesses: the crate also carries the audit-journal
      # SHA harness, which is CBMC-pathological (does not terminate in a sane
      # budget) and is tracked separately. Widen this once that seed is optimized.
      - name: Prove mailbox lease/ack invariants
        run: cargo kani -p apollia-runtime --harness 'mailbox::proofs::'

  # ── Deep fuzz ──────────────────────────────────────────────────────────────
  # Long-running libFuzzer session over the untrusted-input parsers. Any crash
  # artifact is uploaded for triage. Advisory: never blocks. The short PR smoke
  # run lives in ci.yml.
  fuzz-deep:
    name: Deep Fuzz (advisory)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'fuzz-deep'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # cargo-fuzz builds targets with -Zsanitizer=address, which needs nightly.
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "fuzz -> target"
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-fuzz
      - name: Fuzz each target (deep)
        run: |
          set -euo pipefail
          for t in parse_automation confidence_parser gbnf web_read_extract truncation; do
            echo "::group::fuzz $t"
            cargo +nightly fuzz run "$t" fuzz/corpus/"$t" fuzz/seeds/"$t" \
              -- -max_total_time=600 -rss_limit_mb=4096 || true
            echo "::endgroup::"
          done
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts/**
          if-no-files-found: ignore
          retention-days: 30
