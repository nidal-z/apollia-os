# The heavy checks that do not fit in the PR loop (under 15 min).
#
# The cadence is weekly, and the schedule below is the authority on when it
# runs.
#
# Runs:
#   - cron: every Monday at 06:00 UTC (once a week, which is enough)
#   - workflow_dispatch: manual trigger, to validate on demand
#
# Jobs (15 of them, each one launchable alone through workflow_dispatch.inputs.job):
#   - e2e-desktop         : Tauri E2E tests (slow, sometimes flaky)
#   - python-tests        : PyO3-gated AIP suite (Python agents through the bridge)
#   - cli-e2e-runtime     : CLI suite Tracks 1 and 2, daemon on a seeded throwaway HOME
#   - multirunner-cpu-e2e : daemon plus CPU sidecar runner on the 3 OSes
#   - ocr-windows         : the ocr feature built and tested on Windows MSVC, linked
#                           like the shipped desktop (+crt-static) and like the CLI
#   - ocr-languages       : every pinned language of reading downloaded and compared
#                           to its size and SHA-256 (about 5 MB)
#   - feature-matrix      : sanity check of the GPU features on apollia-llm/stt
#   - coverage            : HTML/LCOV coverage report (heavy)
#   - mutants             : cargo-mutants on permissions plus core (advisory)
#   - deep-audit          : cargo-deny check all, with the advisory DB reloaded
#   - geiger              : cargo-geiger report of the unsafe surface (advisory)
#   - loom                : Loom interleaving models of the actors (advisory)
#   - miri                : UB detection on the pure helpers close to the FFI (advisory)
#   - kani                : bounded symbolic proofs of the cardinal invariants (advisory)
#   - fuzz-deep           : long libFuzzer session on the parsers (advisory)
#
# When a job fails: a GH mail alert, but main stays green (no PR is blocked).

name: Weekly deep checks

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "One specific job to run (empty = all of them)"
        required: false
        type: choice
        default: "all"
        options:
          - "all"
          - "e2e-desktop"
          - "python-tests"
          - "cli-e2e-runtime"
          - "multirunner-cpu-e2e"
          - "ocr-windows"
          - "ocr-languages"
          - "feature-matrix"
          - "coverage"
          - "mutants"
          - "deep-audit"
          - "geiger"
          - "loom"
          - "miri"
          - "kani"
          - "fuzz-deep"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least-privilege default. Every job runs read-only.
permissions:
  contents: read

jobs:
  # ── E2E Desktop ────────────────────────────────────────────────────────────
  e2e-desktop:
    name: E2E Desktop
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'e2e-desktop'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      # PyO3 refuses an interpreter newer than 3.13, and the macOS runner now
      # ships 3.14 by default: without this pin the build of apollia-cli fails
      # before a single desktop step runs, which is how this job spent three
      # weeks red.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Cache cargo + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-e2e-

      - name: Build CLI
        run: cargo build -p apollia-cli

      - name: Pre-build E2E binary
        run: cargo test -p apollia-desktop --test e2e --no-run

      - name: Start runtime
        run: ./target/debug/apollia-os start &

      - name: Wait for runtime ready
        run: |
          for i in $(seq 1 30); do
            TOKEN_FILE="${HOME}/.apollia/api-token"
            if [ -f "${TOKEN_FILE}" ]; then
              TOKEN=$(cat "${TOKEN_FILE}")
              if curl -sf -H "Authorization: Bearer ${TOKEN}" \
                   http://127.0.0.1:7771/api/v1/health > /dev/null 2>&1; then
                echo "Runtime ready (${i}s)"
                exit 0
              fi
            fi
            sleep 1
          done
          echo "Runtime did not become ready within 30s" >&2
          exit 1

      - name: Run E2E tests
        run: cargo test -p apollia-desktop --test e2e -- --ignored

      - name: Stop runtime
        if: always()
        run: ./target/debug/apollia-os stop || true

  # ── Python bridge tests (PyO3-gated AIP suite) ─────────────────────────────
  # The `python-tests` feature of apollia-e2e-tests gates the AIP integration
  # binaries that load real decorator-built Python agents through the PyO3
  # bridge. They need the Apollia SDK importable from the interpreter pointed
  # to by PYO3_PYTHON, so we pip-install the editable SDK first. Never gates a
  # PR: the heavy PyO3 link lives in nightly.
  python-tests:
    name: Python Bridge Tests
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'python-tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            python3-dev clang cmake

      - name: Install Apollia SDK (editable)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ./sdk

      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: python-tests

      - name: Run PyO3-gated AIP suite
        run: |
          cargo test -p apollia-e2e-tests \
            --features python-tests \
            --no-fail-fast

  # ── CLI E2E runtime ────────────────────────────────────────────────────────
  # The PR loop (`ci.yml`, job cli-e2e) only plays Track 1, offline. Here the
  # daemon starts on a seeded throwaway HOME (APOLLIA_REQUIRE_RUNTIME=1), so
  # the runtime-only leaves are replayed by a machine. The GGUF points at a
  # file that does not exist: Track 3 records a justified skip, never a
  # failure. The SDK is installed so the Track 2 stub agent can run.
  cli-e2e-runtime:
    name: CLI E2E (runtime, Tracks 1+2)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'cli-e2e-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install Apollia SDK (editable)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ./sdk
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            cmake clang pkg-config sqlite3
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cli-e2e-runtime
      - name: Build apollia-cli
        run: cargo build -p apollia-cli
      - name: Run CLI E2E (Tracks 1 + 2, runtime, seeded)
        run: APOLLIA_REQUIRE_RUNTIME=1 APOLLIA_TEST_MODEL_GGUF=/nonexistent-apollia-e2e.gguf bash tests/cli/cli-e2e.sh
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cli-e2e-runtime-report
          path: tests/cli/report/

  # ── Multi-runner CPU E2E ───────────────────────────────────────────────────
  # Spawns the daemon plus the CPU sidecar runner on the 3 OSes, checks the
  # loopback HTTP handshake and the end-to-end inference on a light GGUF.
  multirunner-cpu-e2e:
    name: Multi-runner CPU E2E (${{ matrix.os }})
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'multirunner-cpu-e2e'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}

      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            python3-dev clang cmake

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: multirunner-cpu-${{ matrix.triple }}

      - name: Build apollia-runner (local-cpu)
        shell: bash
        env:
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        run: |
          cargo build -p apollia-runner --release \
            --no-default-features \
            --features local-cpu \
            --target ${{ matrix.triple }}

      - name: Run apollia-runner IPC integration tests
        shell: bash
        run: |
          cargo test -p apollia-runner --release \
            --no-default-features \
            --features local-cpu \
            --target ${{ matrix.triple }}

      - name: Run apollia-runtime supervisor smoke tests
        shell: bash
        run: |
          cargo test -p apollia-runtime --release \
            --target ${{ matrix.triple }} \
            runner_supervisor::

  # ── OCR languages ──────────────────────────────────────────────────────────
  # The language data the registry pins ([[ocr]] of pinned_models.toml) is
  # downloaded from the address the application composes, and each file is
  # compared to its pinned size and SHA-256 by the script itself. The first
  # address the registry pinned died upstream in silence; this job is what
  # makes the next one fail loudly. Exit 2 (network absent) is a red too.
  ocr-languages:
    name: OCR languages still download
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'ocr-languages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Download and compare every pinned language
        run: python3 -I scripts/check_ocr_languages.py

  # ── OCR on Windows MSVC ────────────────────────────────────────────────────
  # The build script of tesseract-rs forces the dynamic C runtime (/MD,
  # MultiThreadedDLL) through cmake -D flags, while the Windows desktop links
  # with +crt-static (.cargo/config.toml) and builds its C++ with /MT. This job
  # links the ocr feature under the two conditions the shipped binaries are
  # built in, and writes one verdict line per condition to the run summary:
  #   - desktop: no RUSTFLAGS, so the +crt-static of .cargo/config.toml applies,
  #     with the C/C++ environment of the desktop-windows job of release.yml;
  #   - CLI: RUSTFLAGS=-L <Python libraries>, as the CLI matrix of release.yml
  #     sets it, which makes cargo ignore target.<triple>.rustflags.
  # Weekly afterwards, it keeps the ocr feature alive on Windows.
  #
  # Not run under `check_test_home_isolation.py --wrap`: the build script of
  # tesseract-rs writes under %APPDATA% by construction, the runner is
  # throwaway. No rust-cache either: a cached build-script output of
  # tesseract-rs would skip the compile and link against a directory this run
  # never filled, and the measurement is a cold build from verified sources.
  ocr-windows:
    name: OCR on Windows MSVC
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'ocr-windows'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # The archives are checked against packaging/tesseract-sources-checksums.txt
      # (sha256 and tag commit) and staged under %APPDATA%\tesseract-rs, where
      # the build script finds them and downloads nothing.
      - name: Stage verified Tesseract and Leptonica sources
        shell: bash
        run: bash packaging/fetch-tesseract-sources.sh

      # The French data the registry pins (pinned_models.toml), from the
      # upstream repository at a fixed commit, for the five engine tests.
      - name: Fetch the French language data
        shell: bash
        run: |
          DIR="$(cygpath -u "$RUNNER_TEMP")/tessdata"
          mkdir -p "$DIR"
          curl --http1.1 -fsSL --retry 3 -o "$DIR/fra.traineddata" \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/923915d4ced2a7235221788285785a29c4a42d4a/fra.traineddata"
          echo "ced037562e8c80c13122dece28dd477d399af80911a28791a66a63ac1e3445ca  $DIR/fra.traineddata" | sha256sum -c -
          echo "APOLLIA_TEST_TESSDATA=$(cygpath -w "$DIR")" >> "$GITHUB_ENV"

      # The desktop condition. RUSTFLAGS stays unset on purpose: it would
      # override target.<triple>.rustflags and drop +crt-static.
      - name: Desktop link (+crt-static), test apollia-sources with ocr
        id: desktop
        shell: bash
        env:
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        run: |
          if [ -n "${RUSTFLAGS:-}${CARGO_ENCODED_RUSTFLAGS:-}" ]; then
            echo "::error::RUSTFLAGS is set, +crt-static would not apply"
            exit 1
          fi
          # Link first, keeping the path of every test binary for the verdict.
          mkdir -p target/ocr-measure
          cargo test -p apollia-sources --release --features ocr \
            --target x86_64-pc-windows-msvc --no-run \
            --message-format=json-render-diagnostics > target/ocr-measure/test-build.json
          cargo test -p apollia-sources --release --features ocr \
            --target x86_64-pc-windows-msvc -- --include-ignored

      # The CLI condition, measured twice: without ocr for the size it adds,
      # then with it. The interpreter of setup-python provides the import
      # library the link needs, through the same -L flag release.yml passes.
      - name: CLI link (RUSTFLAGS), build apollia-cli without ocr
        id: cli-base
        if: success() || failure()
        shell: bash
        env:
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
          PYO3_PYTHON: ${{ env.pythonLocation }}\python.exe
          RUSTFLAGS: -L ${{ env.pythonLocation }}\libs
        run: |
          cargo build --release -p apollia-cli --target x86_64-pc-windows-msvc
          mkdir -p target/ocr-measure
          EXE=target/x86_64-pc-windows-msvc/release/apollia-os.exe
          wc -c < "$EXE" | tr -d '[:space:]' > target/ocr-measure/cli-base-size

      - name: CLI link (RUSTFLAGS), build apollia-cli with ocr
        id: cli
        if: success() || failure()
        shell: bash
        env:
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
          PYO3_PYTHON: ${{ env.pythonLocation }}\python.exe
          RUSTFLAGS: -L ${{ env.pythonLocation }}\libs
        run: |
          cargo build --release -p apollia-cli --features ocr --target x86_64-pc-windows-msvc
          mkdir -p target/ocr-measure
          EXE=target/x86_64-pc-windows-msvc/release/apollia-os.exe
          SIZE=$(wc -c < "$EXE" | tr -d '[:space:]')
          echo "$SIZE" > target/ocr-measure/cli-size
          {
            echo "### apollia-os.exe with ocr (RUSTFLAGS set)"
            echo ""
            echo "Size: $SIZE bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      # dumpbin is not on the PATH outside a developer prompt: vswhere finds it.
      - name: CLI dependents (dumpbin)
        if: steps.cli.outcome == 'success'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $deps = & $dumpbin /dependents target\x86_64-pc-windows-msvc\release\apollia-os.exe | Out-String
          Write-Output $deps
          "### dumpbin /dependents apollia-os.exe (with ocr)`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $deps.Trim() | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: OCR Windows verdict
        if: always()
        shell: bash
        env:
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          CLI_BASE_OUTCOME: ${{ steps.cli-base.outcome }}
          CLI_OUTCOME: ${{ steps.cli.outcome }}
        run: |
          verdict() { if [ "$1" = success ]; then echo "link passed"; else echo "link failed ($1)"; fi; }
          read_size() { if [ -s "target/ocr-measure/$1" ]; then cat "target/ocr-measure/$1"; else echo "not measured"; fi; }
          BASE=$(read_size cli-base-size)
          WITH=$(read_size cli-size)
          {
            echo "### OCR on Windows MSVC: verdict"
            echo ""
            echo "- D3 desktop (+crt-static): $(verdict "$DESKTOP_OUTCOME")"
            echo "- D3 CLI (RUSTFLAGS): $(verdict "$CLI_OUTCOME")"
            echo "- apollia-os.exe without ocr: $BASE bytes ($(verdict "$CLI_BASE_OUTCOME"))"
            echo "- apollia-os.exe with ocr: $WITH bytes"
            case "$BASE$WITH" in
              *[!0-9]*) ;;
              *) echo "- added by ocr: $((WITH - BASE)) bytes" ;;
            esac
            echo ""
            echo "Test binaries (desktop condition):"
            echo ""
            python -I -c '
          import json, os, sys
          found = 0
          try:
              lines = open(sys.argv[1], encoding="utf-8").read().splitlines()
          except OSError:
              lines = []
          for line in lines:
              try:
                  msg = json.loads(line)
              except ValueError:
                  continue
              exe = msg.get("executable") if msg.get("reason") == "compiler-artifact" else None
              if exe and os.path.isfile(exe):
                  found += 1
                  print(f"- {os.path.basename(exe)}: {os.path.getsize(exe)} bytes")
          if not found:
              print("- none linked")
          ' target/ocr-measure/test-build.json
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Feature matrix sanity (apollia-runner backends) ────────────────────────
  feature-matrix:
    name: Feature ${{ matrix.crate }} (${{ matrix.feature }})
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'feature-matrix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: apollia-runner
            feature: local-cpu
          - crate: apollia-runner
            feature: local-cuda
            install_cuda: true
          - crate: apollia-runner
            feature: local-rocm
            install_rocm: true
          - crate: apollia-runner
            feature: local-vulkan
            install_vulkan: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential cmake clang pkg-config \
            libasound2-dev libpulse-dev libjack-jackd2-dev libssl-dev

      - name: Install CUDA Toolkit
        if: matrix.install_cuda
        uses: Jimver/cuda-toolkit@9b295696791d75d658d8de64c4a85097ad8abeaf # v0.2.16
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc","cudart","cublas","cublas_dev"]'
          use-github-cache: true

      - name: Install ROCm
        if: matrix.install_rocm
        run: |
          sudo apt-get install -y wget gnupg
          wget -O- https://repo.radeon.com/rocm/rocm.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.0/ jammy main" | \
            sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update -q
          sudo apt-get install -y rocm-hip-sdk rocblas hipblas

      - name: Install Vulkan SDK
        if: matrix.install_vulkan
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/lunarg.gpg
          echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan/1.3.290 jammy main" | \
            sudo tee /etc/apt/sources.list.d/vulkan.list
          sudo apt-get update -q
          sudo apt-get install -y vulkan-sdk

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: feature-${{ matrix.crate }}-${{ matrix.feature }}

      - name: cargo check
        run: cargo check -p ${{ matrix.crate }} --no-default-features --features ${{ matrix.feature }}

  # ── Coverage HTML + LCOV ───────────────────────────────────────────────────
  coverage:
    name: Coverage
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-llvm-cov
      # apollia-desktop and apollia-e2e-tests do not build under the coverage
      # harness; tests/ and benches/ are ignored so the report reflects source.
      - run: |
          cargo llvm-cov --workspace \
            --exclude apollia-e2e-tests --exclude apollia-desktop \
            --ignore-filename-regex '(/tests/|/benches/)' --html
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-html-${{ github.sha }}
          path: target/llvm-cov/html/
          retention-days: 30

  # ── Mutation testing : surfaces surviving mutants (test gaps) on core crates ─
  # Advisory report only. cargo-mutants flips operators / deletes lines and
  # checks a test fails; a surviving mutant is an untested behavior. Scoped to
  # the crates that build and test in isolation, with tests restricted to the
  # mutated package so a run finishes within the job. The run is defined by
  # its command line alone: `--no-config` keeps a `.cargo/mutants.toml` left in
  # a checkout from changing what is measured.
  mutants:
    name: Mutation Testing (core)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'mutants'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-mutants
      - name: cargo mutants (permissions + core)
        run: |
          cargo mutants --no-config --test-workspace=false -j 2 \
            --package apollia-permissions --package apollia-core \
            --output mutants.out
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: mutants-report-${{ github.sha }}
          path: mutants.out/
          retention-days: 30

  # ── Deep audit (redownloads the DB to catch the recent advisories) ────────
  deep-audit:
    name: Deep Dependency Check
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'deep-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: cargo-deny full check
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check all

  # ── Unsafe surface : informative report of unsafe usage across the tree ────
  # Non-blocking. cargo-geiger builds the workspace and can be brittle, so it
  # lives in nightly and never gates a PR. The report is uploaded as a text
  # artifact to track the unsafe footprint over time.
  geiger:
    name: Unsafe Surface (advisory)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'geiger'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libssl-dev libasound2-dev libpulse-dev cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: cargo geiger (report)
        run: cargo geiger --workspace --output-format Ascii | tee geiger-report.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: geiger-report-${{ github.sha }}
          path: geiger-report.txt
          retention-days: 30

  # ── Loom concurrency models (advisory) ────────────────────────────────────
  # Exhaustive interleaving check of the runtime's actor algorithms via the
  # standalone apollia-loom-models crate (excluded from the workspace because
  # `--cfg loom` poisons Tokio). No system deps: the crate has no Tokio/pyo3 in
  # its tree. Advisory, never gates a PR.
  loom:
    name: Loom Models (advisory)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'loom'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: loom
      - name: Run Loom models
        env:
          RUSTFLAGS: "--cfg loom"
          LOOM_MAX_PREEMPTIONS: "3"
        run: cargo test --manifest-path crates/apollia-loom-models/Cargo.toml --release

  # ── Miri UB check on FFI-adjacent pure helpers (advisory) ──────────────────
  # Miri interprets MIR to catch undefined behavior. It cannot execute the PyO3
  # boundary (libpython is an unsupported foreign call), so this runs only the
  # interpreter-free `miri_pure` helper suite in apollia-aip. Advisory.
  miri:
    name: Miri (advisory)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'miri'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Miri is a nightly-only component (mirrors the fuzz-deep nightly setup).
      - name: Install nightly + miri
        run: rustup toolchain install nightly --profile minimal --component miri --no-self-update
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libssl-dev cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: miri
      - name: Run Miri on FFI-adjacent pure helpers
        run: cargo +nightly miri test -p apollia-aip --lib miri_pure

  # ── Kani bounded symbolic proofs (advisory) ────────────────────────────────
  # Bit-precise model checking of the cardinal runtime invariants: the
  # non-bypassable StepBudget (apollia-oria) and the mailbox lease/ack fence
  # (apollia-runtime). Kani links its own toolchain via rustup, so it cannot run
  # on the Homebrew dev machines; it lives here, advisory, never gating a PR. The
  # `#[cfg(kani)]` harnesses prove the pure decision helpers over their whole
  # bounded domain, which the in-tree proptest mirrors only sample.
  kani:
    name: Kani Proofs (advisory)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'kani'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: kani
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Prove StepBudget invariants
        run: cargo kani -p apollia-oria
      # Scoped to the mailbox harnesses: the crate also carries the audit-journal
      # SHA harness, which is CBMC-pathological (does not terminate in a sane
      # budget) and is tracked separately. Widen this once that seed is optimized.
      - name: Prove mailbox lease/ack invariants
        run: cargo kani -p apollia-runtime --harness 'mailbox::proofs::'

  # ── Deep fuzz ──────────────────────────────────────────────────────────────
  # Long-running libFuzzer session over the untrusted-input parsers. Any crash
  # artifact is uploaded for triage. Advisory: never blocks. The short PR smoke
  # run lives in ci.yml.
  fuzz-deep:
    name: Deep Fuzz (advisory)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.job == 'all' ||
      github.event.inputs.job == 'fuzz-deep'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # cargo-fuzz builds targets with -Zsanitizer=address, which needs nightly.
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "fuzz -> target"
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-fuzz
      - name: Fuzz each target (deep)
        run: |
          set -euo pipefail
          # --target is load-bearing: install-action ships cargo-fuzz as a
          # statically linked musl binary, and cargo-fuzz defaults its build
          # target to its own compile-time triple. Without the flag the build
          # targets x86_64-unknown-linux-musl and dies on `libc` ("sanitizer
          # is incompatible with statically linked libc", "can't find crate
          # for `core`") before any objective runs.
          for t in parse_automation confidence_parser gbnf web_read_extract truncation; do
            echo "::group::fuzz $t"
            # fuzz/corpus/ is gitignored (fuzz/.gitignore), so a fresh checkout
            # has no corpus directory, and libFuzzer refuses to start when a
            # corpus argument names a directory that does not exist.
            mkdir -p fuzz/corpus/"$t"
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
              "$t" fuzz/corpus/"$t" fuzz/seeds/"$t" \
              -- -max_total_time=600 -rss_limit_mb=4096 || true
            echo "::endgroup::"
          done
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts/**
          if-no-files-found: ignore
          retention-days: 30
