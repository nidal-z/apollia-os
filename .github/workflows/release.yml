# Release — production des artefacts distribuables.
#
# Déclenché sur push d'un tag `v*` (release officielle) ou via dispatch
# manuel pour tester sans bumper la version.
#
# Produit, en parallèle :
#   1. 13 binaires CLI self-contained (Python + CRT statique bundlés)
#      → tarball/zip par preset OS × arch × accélérateur
#   2. Desktop bundle macOS ARM64 (.dmg via Tauri 2)
#      [Linux .deb/.AppImage + Windows .msi : à étendre — pour l'instant
#       le binaire CLI + launcher couvre Windows/Linux pour les power-users]
#
# Job final `release` agrège tout dans une GitHub Release draft (review manuel
# avant publication).
#
# Wall-clock cold : ~35-40 min · warm cache : ~20 min. Cf. BUILD.md.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      presets:
        description: "CLI presets à builder (comma-separated, ex: macos-silicon,windows-x86-cuda). 'all' = tous."
        required: false
        default: "all"
      skip_desktop:
        description: "Skip le bundle desktop macOS (gain ~12 min si tu testes juste CLI)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Setup — calcule la matrice CLI filtrée (dynamic matrix).
  #
  # GH Actions ne supporte PAS `matrix.preset` dans le `if:` au niveau du job
  # (limitation parser). Le contournement standard : un job léger qui sort
  # le JSON de la matrice, ingéré ensuite via `fromJSON(needs.setup.outputs.matrix)`.
  # ────────────────────────────────────────────────────────────────────────────
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      run_desktop: ${{ steps.compute.outputs.run_desktop }}
    steps:
      - id: compute
        env:
          PRESETS_INPUT: ${{ github.event.inputs.presets || 'all' }}
          SKIP_DESKTOP: ${{ github.event.inputs.skip_desktop || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          # Full preset matrix — single source of truth.
          read -r -d '' FULL <<'JSON' || true
          {
            "include": [
              {"preset":"macos-silicon",      "runner":"macos-latest",    "triple":"aarch64-apple-darwin",      "features":"cloud,local-metal,local-accelerate,stt-metal", "archive":"tar.gz"},
              {"preset":"linux-x86-cpu",      "runner":"ubuntu-latest",   "triple":"x86_64-unknown-linux-gnu",  "features":"cloud,local-cpu,stt-whisper-cpp",              "archive":"tar.gz"},
              {"preset":"linux-x86-cuda",     "runner":"ubuntu-latest",   "triple":"x86_64-unknown-linux-gnu",  "features":"cloud,local-cuda,stt-cuda",                    "archive":"tar.gz", "needs_cuda":true},
              {"preset":"linux-x86-rocm",     "runner":"ubuntu-latest",   "triple":"x86_64-unknown-linux-gnu",  "features":"cloud,local-rocm,stt-rocm",                    "archive":"tar.gz", "needs_rocm":true},
              {"preset":"linux-x86-vulkan",   "runner":"ubuntu-latest",   "triple":"x86_64-unknown-linux-gnu",  "features":"cloud,local-vulkan,stt-whisper-cpp",           "archive":"tar.gz", "needs_vulkan":true},
              {"preset":"linux-arm-cpu",      "runner":"ubuntu-24.04-arm","triple":"aarch64-unknown-linux-gnu", "features":"cloud,local-cpu,stt-whisper-cpp",              "archive":"tar.gz"},
              {"preset":"linux-arm-cuda",     "runner":"ubuntu-24.04-arm","triple":"aarch64-unknown-linux-gnu", "features":"cloud,local-cuda,stt-cuda",                    "archive":"tar.gz", "needs_cuda":true, "allow_fail":true},
              {"preset":"windows-x86-cpu",    "runner":"windows-latest",  "triple":"x86_64-pc-windows-msvc",    "features":"cloud,local-cpu,stt-whisper-cpp",              "archive":"zip"},
              {"preset":"windows-x86-cuda",   "runner":"windows-latest",  "triple":"x86_64-pc-windows-msvc",    "features":"cloud,local-cuda,stt-cuda",                    "archive":"zip", "needs_cuda":true},
              {"preset":"windows-x86-rocm",   "runner":"windows-latest",  "triple":"x86_64-pc-windows-msvc",    "features":"cloud,local-rocm,stt-rocm",                    "archive":"zip", "needs_rocm":true, "allow_fail":true},
              {"preset":"windows-x86-vulkan", "runner":"windows-latest",  "triple":"x86_64-pc-windows-msvc",    "features":"cloud,local-vulkan,stt-whisper-cpp",           "archive":"zip", "needs_vulkan":true},
              {"preset":"windows-arm-cpu",    "runner":"windows-11-arm",  "triple":"aarch64-pc-windows-msvc",   "features":"cloud,local-cpu,stt-whisper-cpp",              "archive":"zip"},
              {"preset":"windows-arm-cuda",   "runner":"windows-11-arm",  "triple":"aarch64-pc-windows-msvc",   "features":"cloud,local-cuda,stt-cuda",                    "archive":"zip", "needs_cuda":true, "allow_fail":true}
            ]
          }
          JSON

          if [[ "$EVENT_NAME" != "workflow_dispatch" || "$PRESETS_INPUT" == "all" || -z "$PRESETS_INPUT" ]]; then
            MATRIX="$FULL"
          else
            # jq filter on PRESETS_INPUT (comma-separated)
            MATRIX=$(echo "$FULL" | jq -c --arg p "$PRESETS_INPUT" \
              '{include: [.include[] | select(.preset as $x | $p | split(",") | index($x))]}')
          fi

          echo "Matrix selected:"
          echo "$MATRIX" | jq -r '.include[] | "  · " + .preset'

          # GH Actions output: compact JSON (single line).
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"

          # Desktop gate.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$SKIP_DESKTOP" == "true" ]]; then
            echo "run_desktop=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_desktop=true" >> "$GITHUB_OUTPUT"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # CLI binaries (13 presets max) — self-contained bundles avec Python embarqué
  # ────────────────────────────────────────────────────────────────────────────
  cli:
    name: CLI ${{ matrix.preset }}
    needs: setup
    if: needs.setup.outputs.matrix != '' && fromJSON(needs.setup.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_fail || false }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install Linux build deps
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            python3-dev clang cmake

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ── GPU SDK install (only if matrix says so) ──────────────────────────
      - name: Install CUDA Toolkit (Linux+Windows x86)
        if: matrix.needs_cuda && !contains(matrix.runner, 'arm')
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","curand","curand_dev","thrust"]'
          use-github-cache: true

      - name: Install CUDA aarch64 (Jetson SBSA)
        if: matrix.needs_cuda && matrix.runner == 'ubuntu-24.04-arm'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/12.4.0/local_installers/cuda-repo-ubuntu2204-12-4-local_12.4.0-550.54.14-1_arm64.deb -O /tmp/cuda.deb || true
          sudo dpkg -i /tmp/cuda.deb || true
          sudo cp /var/cuda-repo-*/cuda-*-keyring.gpg /usr/share/keyrings/ || true
          sudo apt-get update -q
          sudo apt-get install -y cuda-toolkit-12-4 || echo "::warning::CUDA aarch64 install failed (L4T only)"
          echo "CUDA_PATH=/usr/local/cuda-12.4" >> $GITHUB_ENV
          echo "/usr/local/cuda-12.4/bin" >> $GITHUB_PATH

      - name: Install ROCm (Linux)
        if: matrix.needs_rocm && startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get install -y wget gnupg
          wget -O- https://repo.radeon.com/rocm/rocm.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.0/ jammy main" | \
            sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update -q
          sudo apt-get install -y rocm-hip-sdk rocm-llvm rocblas hipblas
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "/opt/rocm/bin" >> $GITHUB_PATH

      - name: Install HIP SDK (Windows)
        if: matrix.needs_rocm && startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: |
          $url = "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-24.Q3-WinSvr2022-For-HIP.exe"
          Invoke-WebRequest -Uri $url -OutFile hip-installer.exe -UseBasicParsing
          Start-Process -FilePath ".\hip-installer.exe" -ArgumentList "-install","-quiet" -Wait
          echo "HIP_PATH=C:\Program Files\AMD\ROCm\6.1" >> $env:GITHUB_ENV
          echo "C:\Program Files\AMD\ROCm\6.1\bin" >> $env:GITHUB_PATH

      - name: Install Vulkan SDK (Linux)
        if: matrix.needs_vulkan && startsWith(matrix.runner, 'ubuntu')
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/lunarg.gpg
          echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan/1.3.290 jammy main" | \
            sudo tee /etc/apt/sources.list.d/vulkan.list
          sudo apt-get update -q
          sudo apt-get install -y vulkan-sdk

      - name: Install Vulkan SDK (Windows)
        if: matrix.needs_vulkan && startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/1.3.290.0/windows/VulkanSDK-1.3.290.0-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe -UseBasicParsing
          Start-Process -FilePath ".\VulkanSDK.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          $sdk = "C:\VulkanSDK\1.3.290.0"
          echo "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          echo "$sdk\Bin" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.preset }}
          shared-key: cli-binaries

      # ── Python bundle (avant cargo : PyO3 link contre l'interprète bundlé) ──
      - name: Build Python bundle
        shell: bash
        run: |
          mkdir -p target/python-bundle/${{ matrix.triple }}
          bash packaging/build-python-bundle.sh \
            ${{ matrix.triple }} \
            target/python-bundle/${{ matrix.triple }}
          if [ -x "target/python-bundle/${{ matrix.triple }}/python/bin/python3.13" ]; then
            echo "PYO3_PYTHON=$(pwd)/target/python-bundle/${{ matrix.triple }}/python/bin/python3.13" >> $GITHUB_ENV
          else
            echo "PYO3_PYTHON=$(pwd)/target/python-bundle/${{ matrix.triple }}/python/python.exe" >> $GITHUB_ENV
          fi

      # ── Build ─────────────────────────────────────────────────────────────
      # Windows : +crt-static via .cargo/config.toml + CMAKE_MSVC_RUNTIME_LIBRARY
      # pour aligner /MT côté llama-cpp-sys-2 et whisper-rs-sys.
      - name: Build CLI
        shell: bash
        env:
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        run: |
          cargo build --release -p apollia-cli \
            --target ${{ matrix.triple }} \
            --no-default-features \
            --features "${{ matrix.features }}"

      - name: Strip binary (Linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: strip target/${{ matrix.triple }}/release/apollia-os

      # ── Package self-contained ────────────────────────────────────────────
      - name: Assemble bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          STAGE="target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}"
          mkdir -p "$STAGE"
          cp target/${{ matrix.triple }}/release/apollia-os "$STAGE/apollia-os"
          cp packaging/launchers/apollia-os.sh "$STAGE/apollia-os.sh"
          chmod +x "$STAGE/apollia-os.sh"
          cp -R target/python-bundle/${{ matrix.triple }}/python "$STAGE/python"
          cat > "$STAGE/README.txt" <<EOF
          Apollia OS ${{ matrix.preset }} — self-contained bundle
          ========================================================
          Lance : ./apollia-os.sh start
          Doc   : https://apollia.fr/docs/install
          Inclus : binaire + Python 3.13 + site-packages.
          Requis : driver GPU à jour si preset GPU.
          EOF
          cd target/${{ matrix.triple }}/bundle
          tar -czf apollia-os-${{ matrix.preset }}.tar.gz apollia-os-${{ matrix.preset }}/
          shasum -a 256 apollia-os-${{ matrix.preset }}.tar.gz > apollia-os-${{ matrix.preset }}.tar.gz.sha256

      - name: Assemble bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.triple }}/release/apollia-os.exe" "$stage/apollia-os.exe"
          Copy-Item "packaging/launchers/apollia-os.bat" "$stage/apollia-os.bat"
          Copy-Item -Recurse "target/python-bundle/${{ matrix.triple }}/python/*" "$stage/"
          @"
          Apollia OS ${{ matrix.preset }} — self-contained bundle
          ========================================================
          Lance : apollia-os.bat start
          Doc   : https://apollia.fr/docs/install
          Inclus : binaire + Python 3.13 + site-packages + CRT statique.
          Requis cote user : driver GPU a jour. Pas de VC++ Redist necessaire.
          "@ | Out-File "$stage/README.txt" -Encoding ASCII
          Push-Location "target/${{ matrix.triple }}/bundle"
          Compress-Archive -Path "apollia-os-${{ matrix.preset }}" -DestinationPath "apollia-os-${{ matrix.preset }}.zip"
          $hash = (Get-FileHash "apollia-os-${{ matrix.preset }}.zip" -Algorithm SHA256).Hash
          "$hash  apollia-os-${{ matrix.preset }}.zip" | Out-File "apollia-os-${{ matrix.preset }}.zip.sha256" -Encoding ASCII
          Pop-Location

      - uses: actions/upload-artifact@v5
        with:
          name: apollia-os-${{ matrix.preset }}
          path: |
            target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}.${{ matrix.archive }}
            target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Desktop bundle Tauri — macOS ARM64 .dmg (extension future : Linux/Win)
  # ────────────────────────────────────────────────────────────────────────────
  desktop-macos:
    name: Desktop macOS (ARM64)
    needs: setup
    if: needs.setup.outputs.run_desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-macos-arm64

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend deps
        working-directory: crates/apollia-desktop/ui
        run: npm ci

      - name: Build Python bundle (aarch64-apple-darwin)
        run: |
          ./packaging/build-python-bundle.sh aarch64-apple-darwin \
            target/python-bundle/aarch64-apple-darwin

      - name: Build Tauri app
        working-directory: crates/apollia-desktop
        env:
          PYO3_PYTHON: ${{ github.workspace }}/target/python-bundle/aarch64-apple-darwin/python/bin/python3.13
          RUSTFLAGS: -L ${{ github.workspace }}/target/python-bundle/aarch64-apple-darwin/python/lib
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Post-bundle (install_names + ad-hoc sign)
        working-directory: crates/apollia-desktop
        env:
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        run: |
          bash scripts/after-bundle.sh
          APP="../../target/aarch64-apple-darwin/release/bundle/macos/Apollia OS.app"
          codesign --force --deep --sign - \
            --options runtime \
            --entitlements entitlements.plist \
            "$APP"
          codesign --verify --verbose=2 "$APP" || true

      - name: SHA256SUMS
        working-directory: target/aarch64-apple-darwin/release/bundle/dmg
        run: shasum -a 256 *.dmg > SHA256SUMS

      - uses: actions/upload-artifact@v5
        with:
          name: apollia-desktop-macos-arm64-dmg
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Aggregation → GitHub Release draft (tag push uniquement)
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release (draft)
    needs: [cli, desktop-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create release draft
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
            artifacts/*.dmg
            artifacts/SHA256SUMS
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
