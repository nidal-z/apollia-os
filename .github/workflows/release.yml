# Release - production of the distributable artefacts.
#
# Triggered on a `v*` tag push (an official release), or through a manual
# dispatch to test without bumping the version.
#
# Produces, in parallel:
#   1. Six self-contained CLI archives (Python plus static CRT bundled), one
#      per preset of the FULL matrix in the `setup` job below
#      -> one tarball/zip per OS x arch x accelerator preset
#   2. Desktop installers (Tauri 2), three jobs, one installer per system:
#        macOS ARM64         : .dmg
#        Linux x86_64        : .deb + .AppImage
#        Windows x86_64      : .msi + .exe (NSIS)
#      Every desktop job embeds the same Python bundle (PyO3) as the CLI job.
#      No installer carries an engine for NVIDIA cards: that engine is
#      published apart, under a signed manifest, by engines.yml, and the
#      application downloads it on demand.
#
# The final `release` job aggregates everything into a draft GitHub Release
# (reviewed by hand before publication).
#
# Wall clock, cold: 35 to 40 min; warm cache: about 20 min.

# Artifact retention: the build jobs' uploads are consumed by the publish job
# of the same run, which attaches them to the GitHub Release, so they are kept
# a week, enough to re-run a failed publish. At 30 days the desktop bundles
# alone held some 50 GB and hit the account's artifact quota, which then
# failed every upload of every workflow, CI included.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      presets:
        description: "CLI presets to build (comma-separated, e.g. macos-silicon,linux-x86-vulkan). 'all' = every one."
        required: false
        default: "all"
      skip_desktop:
        description: "Skip every desktop bundle (saves the whole desktop half when testing the CLI alone)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      desktop:
        description: "Which desktop bundles to build. Narrowing one platform is how you iterate on it without paying for the others."
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "macos"
          - "linux"
          - "windows"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default. Only the final `release` job escalates (below).
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Setup - computes the filtered CLI matrix (dynamic matrix).
  #
  # GH Actions does NOT support `matrix.preset` in a job-level `if:` (a parser
  # limitation). The standard workaround: a light job that outputs the matrix
  # JSON, then read back through `fromJSON(needs.setup.outputs.matrix)`.
  # ────────────────────────────────────────────────────────────────────────────
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      run_desktop: ${{ steps.compute.outputs.run_desktop }}
      desktop: ${{ steps.compute.outputs.desktop }}
    steps:
      - id: compute
        env:
          PRESETS_INPUT: ${{ github.event.inputs.presets || 'all' }}
          SKIP_DESKTOP: ${{ github.event.inputs.skip_desktop || 'false' }}
          DESKTOP: ${{ github.event.inputs.desktop || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          # Full preset matrix - single source of truth.
          #
          # `allow_fail` marks a preset as advisory: it still builds and uploads
          # when it works, but its failure does not block the release. Exactly
          # three presets are blocking, one per supported platform, which is what
          # makes a tag able to produce a draft at all. Previously ten of the
          # thirteen were blocking, so any single exotic accelerator failing took
          # the whole release with it.
          #
          # The `local-*` / `stt-*` features now only select the whisper
          # acceleration of the STT sidecar. Local LLM inference runs through the
          # pinned llama-server binary, which upstream publishes per platform, so
          # a GPU preset failing here costs STT acceleration, never inference.
          # Archive names live in packaging/artifacts.json (the naming
          # contract), never here: each job reads its name from the contract,
          # so a preset absent from it fails loudly instead of shipping a
          # name no consumer knows.
          #
          # Windows ARM carried two presets and carries none for 0.1.0. pandas
          # publishes no win_arm64 wheel, so pip fell back to the source
          # archive whose sum is not pinned and --require-hashes refused, which
          # is the guard working. Building it from source on the runner would
          # need a C toolchain and NumPy in place for an architecture that is
          # in none of the three blocking platforms and that neither the
          # gestural automaton nor a hand pass can reach. Removed rather than
          # left permanently red: a job nobody can act on teaches an operator
          # to read past red.
          read -r -d '' FULL <<'JSON' || true
          {
            "include": [
              {"preset":"macos-silicon",      "runner":"macos-latest",     "triple":"aarch64-apple-darwin",      "features":"local-metal"},
              {"preset":"linux-x86-cpu",      "runner":"ubuntu-24.04",     "triple":"x86_64-unknown-linux-gnu",  "features":"local-cpu"},
              {"preset":"windows-x86-cpu",    "runner":"windows-latest",   "triple":"x86_64-pc-windows-msvc",    "features":"local-cpu"},
              {"preset":"linux-x86-vulkan",   "runner":"ubuntu-24.04",     "triple":"x86_64-unknown-linux-gnu",  "features":"local-vulkan", "needs_vulkan":true, "allow_fail":true},
              {"preset":"linux-arm-cpu",      "runner":"ubuntu-24.04-arm", "triple":"aarch64-unknown-linux-gnu", "features":"local-cpu",    "allow_fail":true},
              {"preset":"windows-x86-vulkan", "runner":"windows-latest",   "triple":"x86_64-pc-windows-msvc",    "features":"local-vulkan", "needs_vulkan":true, "allow_fail":true}
            ]
          }
          JSON

          if [[ "$EVENT_NAME" != "workflow_dispatch" || "$PRESETS_INPUT" == "all" || -z "$PRESETS_INPUT" ]]; then
            MATRIX="$FULL"
          else
            # jq filter on PRESETS_INPUT (comma-separated)
            MATRIX=$(echo "$FULL" | jq -c --arg p "$PRESETS_INPUT" \
              '{include: [.include[] | select(.preset as $x | $p | split(",") | index($x))]}')
          fi

          echo "Matrix selected:"
          echo "$MATRIX" | jq -r '.include[] | "  · " + .preset'

          # GH Actions output: compact JSON (single line).
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"

          # Desktop gate. `skip_desktop` still turns the whole half off; the
          # `desktop` choice then narrows what remains, so iterating on one
          # bundle does not pay for the four others. A tag push takes every
          # bundle: the filter is a manual-run affordance, never a release one.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$SKIP_DESKTOP" == "true" ]]; then
            echo "run_desktop=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_desktop=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "desktop=${DESKTOP}" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=all" >> "$GITHUB_OUTPUT"
          fi
          echo "  desktop selection: ${DESKTOP}"

  # ────────────────────────────────────────────────────────────────────────────
  # CLI binaries (13 presets at most) - self-contained bundles with Python
  # ────────────────────────────────────────────────────────────────────────────
  cli:
    name: CLI ${{ matrix.preset }}
    needs: setup
    if: needs.setup.outputs.matrix != '' && fromJSON(needs.setup.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_fail || false }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}

      - name: Install Linux build deps
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            python3-dev clang cmake

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install Vulkan SDK (Linux)
        if: matrix.needs_vulkan && startsWith(matrix.runner, 'ubuntu')
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/lunarg.gpg
          echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan/1.3.290 noble main" | \
            sudo tee /etc/apt/sources.list.d/vulkan.list
          sudo apt-get update -q
          sudo apt-get install -y vulkan-sdk

      - name: Install Vulkan SDK (Windows)
        if: matrix.needs_vulkan && startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: |
          # The installer runs on the host that produces signed artifacts, so
          # its integrity is pinned: the sha256 is verified before
          # execution, sha256 computed from the archive at this URL.
          # LunarG withdraws old Windows installers (1.3.290.0 went 404): the
          # versions still served are listed at
          # https://vulkan.lunarg.com/sdk/versions/windows.json
          $url = "https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe"
          $expected = "acb4ae0786fd3e558f8b3c36cc3eba91638984217ba8a6795ec64d2f9ffd8c4b"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe -UseBasicParsing
          $actual = (Get-FileHash VulkanSDK.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
              throw "VulkanSDK.exe sha256 mismatch: expected $expected, got $actual"
          }
          Start-Process -FilePath ".\VulkanSDK.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          $sdk = "C:\VulkanSDK\1.3.296.0"
          echo "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          echo "$sdk\Bin" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.preset }}
          shared-key: cli-binaries

      # ── Python bundle (before cargo: PyO3 links against the bundled interpreter) ──
      - name: Build Python bundle
        shell: bash
        run: |
          mkdir -p target/python-bundle/${{ matrix.triple }}
          bash packaging/build-python-bundle.sh \
            ${{ matrix.triple }} \
            target/python-bundle/${{ matrix.triple }}
          # Two spellings of one directory, and the split is deliberate. The
          # tests run under Git Bash on the Windows runners, where a native
          # `D:\a\...` path is unreliable, so they stay relative. The values
          # are read by rustc and PyO3, which are native binaries and cannot
          # open the MSYS path `$(pwd)` would answer there.
          REL="target/python-bundle/${{ matrix.triple }}/python"
          NAT="${{ github.workspace }}/target/python-bundle/${{ matrix.triple }}/python"
          if [ -x "$REL/bin/python3.13" ]; then
            echo "PYO3_PYTHON=$NAT/bin/python3.13" >> $GITHUB_ENV
          else
            echo "PYO3_PYTHON=$NAT/python.exe" >> $GITHUB_ENV
          fi
          # python-build-standalone answers `sysconfig` with its build-time
          # prefix, `LIBDIR=/install/lib`, a directory that exists on no runner.
          # PyO3 turns that into the only link search path it emits, so the link
          # dies on `-lpython3.13` while the library sits in the bundle. The two
          # desktop jobs below already carry this flag; the CLI matrix never did,
          # which is why they linked and it did not. Windows keeps its import
          # library in `libs/`, the other two in `lib/`.
          if [ -d "$REL/libs" ]; then
            echo "RUSTFLAGS=-L $NAT/libs" >> $GITHUB_ENV
          else
            echo "RUSTFLAGS=-L $NAT/lib" >> $GITHUB_ENV
          fi

      # ── Build ─────────────────────────────────────────────────────────────
      # Since the multi-runner refactor, apollia-cli exposes no backend
      # feature: the cloud clients are unconditional. `matrix.features` now
      # carries only the runner backend, read by the "Extract runner feature"
      # step below. Every name there is declared in a Cargo.toml: an invented
      # name builds nothing.
      # Windows: +crt-static through .cargo/config.toml plus
      # CMAKE_MSVC_RUNTIME_LIBRARY, to align /MT on the apollia-runner side.
      - name: Build CLI
        shell: bash
        env:
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        run: |
          cargo build --release -p apollia-cli \
            --target ${{ matrix.triple }} \
            --no-default-features

      # Build apollia-runner with the matching backend feature.
      # Extracts local-{cpu,cuda,rocm,vulkan,metal} from matrix.features.
      # For the presets with no local-* (cloud only), no runner is built.
      - name: Extract runner feature
        id: runner_feat
        shell: bash
        run: |
          FEAT=$(echo "${{ matrix.features }}" | tr ',' '\n' | grep -E '^local-(cpu|cuda|rocm|vulkan|metal)$' | head -1 || true)
          echo "feature=$FEAT" >> "$GITHUB_OUTPUT"
          if [ -n "$FEAT" ]; then
            BACKEND=${FEAT#local-}
            echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          fi

      # host_runner_cmake_env restores whisper.cpp's optimisation flags on
      # MSVC, which the cmake crate strips, and routes the Vulkan build around
      # a path-length limit; the clean makes a cached tree apply them.
      - name: Build apollia-runner
        if: steps.runner_feat.outputs.feature != ''
        shell: bash
        env:
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        run: |
          source scripts/host_desktop_defaults.sh
          host_runner_cmake_env "${{ matrix.triple }}"
          host_runner_cmake_clean "${{ matrix.triple }}" --release --target ${{ matrix.triple }}
          cargo build --release -p apollia-runner \
            --target ${{ matrix.triple }} \
            --no-default-features \
            --features "${{ steps.runner_feat.outputs.feature }}"

      - name: Strip binary (Linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          strip target/${{ matrix.triple }}/release/apollia-os
          if [ -f target/${{ matrix.triple }}/release/apollia-runner ]; then
            strip target/${{ matrix.triple }}/release/apollia-runner
          fi

      # ── Package self-contained ────────────────────────────────────────────
      # The archive name comes from the naming contract, the same file
      # `apollia-os update` embeds at build time. A preset missing from the
      # contract is a red here, not a name invented on the spot.
      - name: Read the archive name from the naming contract
        id: contract
        shell: bash
        run: |
          NAME=$(jq -r --arg p "${{ matrix.preset }}" \
            '.cli[] | select(.preset == $p) | .archive' packaging/artifacts.json)
          if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
            echo "::error::preset ${{ matrix.preset }} is absent from packaging/artifacts.json"
            exit 1
          fi
          echo "archive=$NAME" >> "$GITHUB_OUTPUT"

      # The self-contained promise includes the inference engine. Exit 2 means
      # the pinned upstream release has no build for this couple: the bundle
      # ships without it, and its README says so instead of implying it.
      - name: Stage the llama-server engine
        shell: bash
        env:
          RUNNER_BACKEND: ${{ steps.runner_feat.outputs.backend }}
        run: |
          STAGE="target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}"
          mkdir -p "$STAGE"
          set +e
          bash packaging/fetch-llama-server.sh "$RUNNER_BACKEND" "$STAGE/runners"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "LLAMA_BUNDLED=1" >> "$GITHUB_ENV"
          elif [ "$rc" -eq 2 ]; then
            echo "::warning::no upstream llama-server build for preset ${{ matrix.preset }}; the bundle ships without the embedded engine"
            echo "LLAMA_BUNDLED=0" >> "$GITHUB_ENV"
          else
            exit "$rc"
          fi

      - name: Assemble bundle (Unix)
        if: runner.os != 'Windows'
        env:
          RUNNER_BACKEND: ${{ steps.runner_feat.outputs.backend }}
        run: |
          STAGE="target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}"
          mkdir -p "$STAGE"
          cp target/${{ matrix.triple }}/release/apollia-os "$STAGE/apollia-os"
          cp packaging/launchers/apollia-os.sh "$STAGE/apollia-os.sh"
          chmod +x "$STAGE/apollia-os.sh"
          cp -R target/python-bundle/${{ matrix.triple }}/python "$STAGE/python"
          # Includes the runner matching the preset backend, when it was built.
          if [ -n "$RUNNER_BACKEND" ] && [ -f "target/${{ matrix.triple }}/release/apollia-runner" ]; then
            cp "target/${{ matrix.triple }}/release/apollia-runner" "$STAGE/apollia-runner-$RUNNER_BACKEND"
            chmod +x "$STAGE/apollia-runner-$RUNNER_BACKEND"
            echo "  Runner bundled: apollia-runner-$RUNNER_BACKEND"
          fi
          if [ "${LLAMA_BUNDLED:-0}" = "1" ]; then
            ENGINE=" + llama-server engine"
            ENGINE_NOTE=""
          else
            ENGINE=""
            ENGINE_NOTE="Note: the llama-server engine is not bundled for this preset (no upstream build); the daemon uses a llama-server found on PATH."
          fi
          cat > "$STAGE/README.txt" <<EOF
          Apollia OS ${{ matrix.preset }} - self-contained bundle
          ========================================================
          Run   : ./apollia-os.sh start
          Doc   : https://docs.apollia.fr/how-to/install-and-run
          Included: apollia-os daemon + sidecar runner ($RUNNER_BACKEND)$ENGINE + Python 3.13.
          Required: an up-to-date GPU driver for a GPU preset.
          $ENGINE_NOTE
          EOF
          ARCHIVE="${{ steps.contract.outputs.archive }}"
          cd target/${{ matrix.triple }}/bundle
          tar -czf "$ARCHIVE" apollia-os-${{ matrix.preset }}/
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Assemble bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUNNER_BACKEND: ${{ steps.runner_feat.outputs.backend }}
        run: |
          $stage = "target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.triple }}/release/apollia-os.exe" "$stage/apollia-os.exe"
          Copy-Item "packaging/launchers/apollia-os.bat" "$stage/apollia-os.bat"
          Copy-Item -Recurse "target/python-bundle/${{ matrix.triple }}/python/*" "$stage/"
          $rb = "${env:RUNNER_BACKEND}"
          if ($rb -and (Test-Path "target/${{ matrix.triple }}/release/apollia-runner.exe")) {
              Copy-Item "target/${{ matrix.triple }}/release/apollia-runner.exe" "$stage/apollia-runner-$rb.exe"
              Write-Host "  Runner bundled : apollia-runner-$rb.exe"
          }
          if ("${env:LLAMA_BUNDLED}" -eq "1") {
              $engine = " + llama-server engine"
              $engineNote = ""
          } else {
              $engine = ""
              $engineNote = "Note: the llama-server engine is not bundled for this preset (no upstream build); the daemon uses a llama-server found on PATH."
          }
          @"
          Apollia OS ${{ matrix.preset }} - self-contained bundle
          ========================================================
          Run   : apollia-os.bat start
          Doc   : https://docs.apollia.fr/how-to/install-and-run
          Included: apollia-os.exe daemon + sidecar runner ($rb)$engine + Python 3.13 + static CRT.
          Required: an up-to-date GPU driver. No VC++ Redist needed.
          $engineNote
          "@ | Out-File "$stage/README.txt" -Encoding ASCII
          $archive = "${{ steps.contract.outputs.archive }}"
          Push-Location "target/${{ matrix.triple }}/bundle"
          Compress-Archive -Path "apollia-os-${{ matrix.preset }}" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          "$hash  $archive" | Out-File "$archive.sha256" -Encoding ASCII
          Pop-Location

      # ── SBOM (whole bundle : Rust crates + embedded CPython) ────────────────
      # The release published eighteen deliverables that nothing had ever
      # started. This runs the bundle this job just assembled, through the
      # launcher a user runs, under a throwaway home so it depends on no state
      # and leaves none. It is placed after assembly on purpose: the binary
      # alone cannot start on macOS, where its libpython is linked at
      # `@executable_path/../Resources/python/lib`, a path only the packaged
      # layout answers. What is asserted is thin, that the thing starts, names
      # itself and answers its command surface; what it catches is the class
      # that ships broken and is found by a user.
      - name: Smoke the bundle this job just assembled
        shell: bash
        run: |
          set -euo pipefail
          STAGE="target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}"
          # The launcher is the entry point the archive documents and a user
          # runs: it points the binary at the interpreter beside it and at the
          # library that interpreter needs. Running the binary alone is not the
          # shipped contract and does not start on macOS.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            LAUNCH=(cmd //c "$(cygpath -w "$STAGE/apollia-os.bat")")
            PROBE="$STAGE/apollia-os.bat"
          else
            LAUNCH=("$STAGE/apollia-os.sh")
            PROBE="$STAGE/apollia-os.sh"
          fi
          if [ ! -f "$PROBE" ]; then
            echo "::error::$PROBE is not in the assembled bundle"
            ls -la "$STAGE" || true
            exit 1
          fi
          HOME_DIR="$(mktemp -d)"
          export HOME="$HOME_DIR" USERPROFILE="$HOME_DIR"
          echo "== version"
          "${LAUNCH[@]}" --version
          "${LAUNCH[@]}" --version | grep -q "apollia-os" || {
            echo "::error::--version does not name the binary"; exit 1; }
          echo "== help"
          "${LAUNCH[@]}" --help > /dev/null
          echo "== doctor, machine readable"
          "${LAUNCH[@]}" doctor --json > doctor.json
          python3 -c "import json,sys; d=json.load(open('doctor.json')); n=len(d['checks']); print(f'{n} check(s)'); sys.exit(0 if n else 1)"
          rm -rf "$HOME_DIR" doctor.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}
          format: cyclonedx-json
          output-file: target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}.cdx.json
          upload-artifact: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}
          format: spdx-json
          output-file: target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apollia-os-${{ matrix.preset }}
          path: |
            target/${{ matrix.triple }}/bundle/${{ steps.contract.outputs.archive }}
            target/${{ matrix.triple }}/bundle/${{ steps.contract.outputs.archive }}.sha256
            target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}.cdx.json
            target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}.spdx.json
          if-no-files-found: error
          retention-days: 7 # see "Artifact retention" at the top

  # ────────────────────────────────────────────────────────────────────────────
  # Desktop bundle Tauri - macOS ARM64 .dmg (extension future : Linux/Win)
  # ────────────────────────────────────────────────────────────────────────────
  desktop-macos:
    name: Desktop macOS (ARM64)
    needs: setup
    if: needs.setup.outputs.run_desktop == 'true' && (needs.setup.outputs.desktop == 'all' || needs.setup.outputs.desktop == 'macos')
    runs-on: macos-latest
    env:
      # Deliberately not named APPLE_SIGNING_IDENTITY. The Tauri bundler reads
      # that variable and takes it over the `signingIdentity` pinned in
      # tauri.conf.json, and a variable defined-but-empty is still a value to
      # it: it signed with the identity "" and stopped on "no identity found".
      # A build without the Apple secrets must produce an ad hoc bundle, so the
      # real variable is exported below, only once it has content.
      APPLE_IDENTITY_INPUT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: desktop-macos-arm64

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend deps
        working-directory: crates/apollia-desktop/ui
        run: npm ci

      - name: Build Python bundle (aarch64-apple-darwin)
        run: |
          ./packaging/build-python-bundle.sh aarch64-apple-darwin \
            target/python-bundle/aarch64-apple-darwin

      # `createUpdaterArtifacts: true` + `pubkey` make `cargo tauri build`
      # demand TAURI_SIGNING_PRIVATE_KEY. The build must finish either way:
      # with the secret it emits updater artifacts, without it it builds with
      # createUpdaterArtifacts=false and the run summary says so. Configuring
      # the secret stays a human act.
      - name: Guard the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not configured: building with createUpdaterArtifacts=false, this build ships no updater artifact"
            echo "TAURI_SIGNING_PRIVATE_KEY absent : createUpdaterArtifacts=false, no updater artifact" >> "$GITHUB_STEP_SUMMARY"
            echo 'TAURI_BUNDLE_CONFIG={"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"
          fi

      # Tauri reads the APPLE_* variables itself: it imports the certificate
      # into a temporary keychain, signs the .app (hardened runtime and
      # entitlements from tauri.conf.json), then notarizes and staples it,
      # all BEFORE the .dmg is sealed from that .app. The previous shape
      # re-signed the .app on disk after the build, so the sealed .dmg kept
      # the ad hoc payload and notarization could only refuse it.
      - name: Prepare Apple Developer ID signing (if secrets present)
        if: env.APPLE_IDENTITY_INPUT != '' && env.APPLE_API_KEY_P8_BASE64 != ''
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_IDENTITY_INPUT"
            echo "APPLE_CERTIFICATE=$APPLE_CERT_P12_BASE64"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERT_PASSWORD"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"

      - name: Build Tauri app
        working-directory: crates/apollia-desktop
        env:
          PYO3_PYTHON: ${{ github.workspace }}/target/python-bundle/aarch64-apple-darwin/python/bin/python3.13
          RUSTFLAGS: -L ${{ github.workspace }}/target/python-bundle/aarch64-apple-darwin/python/lib
          APOLLIA_DESKTOP_RUNNERS: "cpu metal"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          PATCH="${TAURI_BUNDLE_CONFIG:-}"
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            # tauri.conf.json pins the ad hoc identity "-"; a merge-patch null
            # hands the choice back to APPLE_SIGNING_IDENTITY.
            [ -n "$PATCH" ] || PATCH='{}'
            PATCH=$(jq -c '.bundle.macOS.signingIdentity = null' <<<"$PATCH")
          fi
          if [ -n "$PATCH" ]; then
            cargo tauri build --target aarch64-apple-darwin --config "$PATCH"
          else
            cargo tauri build --target aarch64-apple-darwin
          fi

      # The libpython relocation runs before bundling (beforeBundleCommand,
      # crates/apollia-desktop/scripts/patch-prebundle-libpython.sh), so what Tauri
      # signs is what the
      # .dmg carries. This verification renders a verdict: no `|| true`.
      - name: Verify the .app signature
        run: |
          codesign --verify --verbose=2 \
            "target/aarch64-apple-darwin/release/bundle/macos/Apollia OS.app"

      # The MLX engine (packaging/build-mlx-engine.sh) ships inside the
      # bundled Python tree, in its own package directory. This runs its
      # server entry point from the sealed .app, with the bundled interpreter
      # and under the isolation contract the supervisor uses (`-S`, the engine
      # directory as the only package path), so a bundle without a working
      # engine fails here rather than on a user's machine. It also refuses a
      # bundle that carries mlx-embeddings (GPL-3.0), which never ships.
      - name: Verify the MLX engine in the .app
        run: |
          RES="target/aarch64-apple-darwin/release/bundle/macos/Apollia OS.app/Contents/Resources/python"
          PYTHONNOUSERSITE=1 PYTHONPATH="$RES/engines/mlx/site-packages" \
            "$RES/bin/python3.13" -S -m vllm_mlx.cli serve --help
          if ls -d "$RES/engines/mlx/site-packages"/mlx_embeddings* >/dev/null 2>&1; then
            echo "::error::mlx-embeddings (GPL-3.0) is in the bundle"
            exit 1
          fi
          du -sh "$RES/engines/mlx"

      # When the signing key is present, `cargo tauri build` emits the updater
      # archive and its minisign signature next to the .app. Stage them beside
      # the .dmg so one upload carries everything; their absence is the no-key
      # build and is said out loud, because latest.json is composed from the
      # signatures the release job receives.
      - name: Collect updater artifacts
        shell: bash
        run: |
          BUNDLE=target/aarch64-apple-darwin/release/bundle
          if [ -f "$BUNDLE/macos/Apollia OS.app.tar.gz.sig" ]; then
            cp "$BUNDLE/macos/Apollia OS.app.tar.gz" \
               "$BUNDLE/macos/Apollia OS.app.tar.gz.sig" "$BUNDLE/dmg/"
          else
            echo "::warning::no macOS updater artifact (TAURI_SIGNING_PRIVATE_KEY absent): latest.json will not cover darwin-aarch64"
          fi
          # GitHub rewrites any character outside [A-Za-z0-9._-] in a release
          # asset name, so "Apollia OS_..." is served as "Apollia.OS_...". The
          # file is renamed here rather than the name being guessed downstream:
          # one name from the runner to the download URL, and a contract a
          # guard can check on disk.
          for f in "$BUNDLE/dmg"/"Apollia OS"*; do
            [ -e "$f" ] || continue
            mv "$f" "$BUNDLE/dmg/$(basename "$f" | sed 's/^Apollia OS/Apollia-OS/')"
          done

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/aarch64-apple-darwin/release/bundle
          format: cyclonedx-json
          output-file: target/aarch64-apple-darwin/release/bundle/dmg/apollia-desktop-macos-arm64.cdx.json
          upload-artifact: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/aarch64-apple-darwin/release/bundle
          format: spdx-json
          output-file: target/aarch64-apple-darwin/release/bundle/dmg/apollia-desktop-macos-arm64.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apollia-desktop-macos-arm64-dmg
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/dmg/*.app.tar.gz
            target/aarch64-apple-darwin/release/bundle/dmg/*.app.tar.gz.sig
            target/aarch64-apple-darwin/release/bundle/dmg/apollia-desktop-macos-arm64.cdx.json
            target/aarch64-apple-darwin/release/bundle/dmg/apollia-desktop-macos-arm64.spdx.json
          if-no-files-found: error
          retention-days: 7 # see "Artifact retention" at the top

  # ────────────────────────────────────────────────────────────────────────────
  # Desktop bundle Tauri - Linux x86_64 (.deb + .AppImage)
  # ────────────────────────────────────────────────────────────────────────────
  desktop-linux:
    name: Desktop Linux (x86_64)
    needs: setup
    if: needs.setup.outputs.run_desktop == 'true' && (needs.setup.outputs.desktop == 'all' || needs.setup.outputs.desktop == 'linux')
    # Pinned to 24.04 (noble), the same base as the Linux CLI builds; GitHub
    # retires the 22.04 image on 2026-09-17.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install Tauri / Linux build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev curl wget file \
            python3-dev clang cmake \
            patchelf librsvg2-common libgdk-pixbuf2.0-bin desktop-file-utils

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: desktop-linux-x86_64

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend deps
        working-directory: crates/apollia-desktop/ui
        run: npm ci

      - name: Build Python bundle (x86_64-unknown-linux-gnu)
        run: |
          ./packaging/build-python-bundle.sh x86_64-unknown-linux-gnu \
            target/python-bundle/x86_64-unknown-linux-gnu

      # `createUpdaterArtifacts: true` + `pubkey` make `cargo tauri build`
      # demand TAURI_SIGNING_PRIVATE_KEY. The build must finish either way:
      # with the secret it emits updater artifacts, without it it builds with
      # createUpdaterArtifacts=false and the run summary says so. Configuring
      # the secret stays a human act.
      - name: Guard the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not configured: building with createUpdaterArtifacts=false, this build ships no updater artifact"
            echo "TAURI_SIGNING_PRIVATE_KEY absent : createUpdaterArtifacts=false, no updater artifact" >> "$GITHUB_STEP_SUMMARY"
            echo 'TAURI_BUNDLE_CONFIG={"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"
          fi

      - name: Build Tauri app
        working-directory: crates/apollia-desktop
        env:
          PYO3_PYTHON: ${{ github.workspace }}/target/python-bundle/x86_64-unknown-linux-gnu/python/bin/python3.13
          RUSTFLAGS: -L ${{ github.workspace }}/target/python-bundle/x86_64-unknown-linux-gnu/python/lib
          # The STT runner stays on the processor here. The Vulkan one exists
          # since 2026-09-10 and is measured on Windows alone; this job is
          # blocking, and it takes the Vulkan SDK once the linux-x86-vulkan CLI
          # preset, which builds that runner with the same SDK, is green.
          APOLLIA_DESKTOP_RUNNERS: "cpu"
          # The inference engine is Vulkan here. Vulkan reaches NVIDIA, AMD
          # and Intel from one 32 MB binary, where the CUDA engine covers
          # NVIDIA alone, weighs 238 MB plus a 373 MB runtime, and falls back
          # to the CPU on every other card. The CUDA engine is not bundled:
          # the application downloads it on demand from the engine channel.
          APOLLIA_DESKTOP_LLAMA_BACKEND: "vulkan"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy and its appimage plugin are themselves AppImages, and
          # an AppImage mounts itself through FUSE 2, which Ubuntu 24.04 does
          # not ship and whose fallback it blocks by restricting unprivileged
          # user namespaces. Both ran and died without a word: tauri reports
          # `failed to run linuxdeploy` and swallows the child's stderr, so the
          # bundle step spent fifteen seconds producing no diagnosis at all.
          # This variable makes an AppImage unpack into a temporary directory
          # and run from there, which needs neither FUSE nor a namespace.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # --verbose so the bundler passes its children's output through
          # instead of swallowing it: `failed to run linuxdeploy` twice with no
          # cause attached is what this flag exists to stop.
          if [ -n "${TAURI_BUNDLE_CONFIG:-}" ]; then
            cargo tauri build --verbose --target x86_64-unknown-linux-gnu --config "$TAURI_BUNDLE_CONFIG"
          else
            cargo tauri build --verbose --target x86_64-unknown-linux-gnu
          fi

      # Flat staging: actions/upload-artifact roots the artifact at the
      # longest common ancestor of its paths, so uploading deb/*.deb and
      # appimage/*.AppImage as-is buries the installers in sub-folders the
      # release job's flat globs never see. An unmatched glob here fails the
      # copy, loudly.
      # linuxdeploy runs as a child of `cargo tauri build`, which captures its
      # output and reports only `failed to run linuxdeploy`. Two runs have now
      # died on that sentence with no cause attached, so this step exists to
      # take the cause out of the bundler's hands: it runs only on failure, and
      # replays whatever the bundler left on disk with the output going to the
      # log instead of into a pipe.
      #
      # `|| true` throughout, deliberately: this step reports, it does not
      # judge. The build step above already failed the job.
      - name: Say why linuxdeploy failed
        if: failure()
        run: |
          BUNDLE=target/x86_64-unknown-linux-gnu/release/bundle/appimage
          echo "=== what the bundler left behind"
          ls -la "$BUNDLE" 2>/dev/null || echo "  no appimage directory at all"
          echo "=== the AppDir"
          find "$BUNDLE" -maxdepth 2 -name '*.AppDir' -printf '%p\n' 2>/dev/null || true
          echo "=== the script the bundler generated, replayed with tracing"
          SCRIPT=$(find "$BUNDLE" -maxdepth 2 -name 'build_appimage.sh' 2>/dev/null | head -1)
          if [ -n "$SCRIPT" ]; then
            echo "  replaying $SCRIPT"
            ( cd "$(dirname "$SCRIPT")" && bash -x "$(basename "$SCRIPT")" 2>&1 | tail -80 ) || true
          else
            echo "  no build_appimage.sh; running linuxdeploy directly"
            LD=$(find "$BUNDLE" ~/.cache/tauri -maxdepth 2 -name 'linuxdeploy-x86_64.AppImage' 2>/dev/null | head -1)
            APPDIR=$(find "$BUNDLE" -maxdepth 2 -name '*.AppDir' 2>/dev/null | head -1)
            if [ -n "$LD" ] && [ -n "$APPDIR" ]; then
              chmod +x "$LD" || true
              "$LD" --appdir "$APPDIR" --plugin gtk --output appimage 2>&1 | tail -80 || true
            else
              echo "  found neither linuxdeploy ($LD) nor an AppDir ($APPDIR)"
            fi
          fi
          echo "=== the tools the plugin looks for"
          for t in patchelf gdk-pixbuf-query-loaders gtk-update-icon-cache desktop-file-validate; do
            printf '  %-28s %s\n' "$t" "$(command -v "$t" || echo ABSENT)"
          done
          echo "=== the pkg-config modules it queries"
          for m in gdk-pixbuf-2.0 librsvg-2.0 pango pangocairo pangoft2 gobject-2.0 gio-2.0; do
            printf '  %-18s %s\n' "$m" "$(pkg-config --modversion "$m" 2>/dev/null || echo ABSENT)"
          done

      - name: Collect installers (flat paths)
        run: |
          BUNDLE=target/x86_64-unknown-linux-gnu/release/bundle
          mkdir -p "$BUNDLE/dist"
          cp "$BUNDLE"/deb/*.deb "$BUNDLE"/appimage/*.AppImage "$BUNDLE/dist/"
          # The updater signature of the AppImage exists only on a keyed build;
          # its absence is said out loud, because latest.json is composed from
          # the signatures the release job receives.
          if compgen -G "$BUNDLE/appimage/*.AppImage.sig" > /dev/null; then
            cp "$BUNDLE"/appimage/*.AppImage.sig "$BUNDLE/dist/"
          else
            echo "::warning::no Linux updater signature (TAURI_SIGNING_PRIVATE_KEY absent): latest.json will not cover linux-x86_64"
          fi
          # GitHub rewrites any character outside [A-Za-z0-9._-] in a release
          # asset name, so "Apollia OS_..." is served as "Apollia.OS_...". The
          # file is renamed here rather than the name being guessed downstream:
          # one name from the runner to the download URL, and a contract a
          # guard can check on disk.
          for f in "$BUNDLE/dist"/"Apollia OS"*; do
            [ -e "$f" ] || continue
            mv "$f" "$BUNDLE/dist/$(basename "$f" | sed 's/^Apollia OS/Apollia-OS/')"
          done

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/x86_64-unknown-linux-gnu/release/bundle
          format: cyclonedx-json
          output-file: target/x86_64-unknown-linux-gnu/release/bundle/dist/apollia-desktop-linux-x86_64.cdx.json
          upload-artifact: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/x86_64-unknown-linux-gnu/release/bundle
          format: spdx-json
          output-file: target/x86_64-unknown-linux-gnu/release/bundle/dist/apollia-desktop-linux-x86_64.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apollia-desktop-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/bundle/dist/*
          if-no-files-found: error
          retention-days: 7 # see "Artifact retention" at the top

  # ────────────────────────────────────────────────────────────────────────────
  # Desktop bundle Tauri - Windows x86_64 (.msi + .exe NSIS)
  # ────────────────────────────────────────────────────────────────────────────
  desktop-windows:
    name: Desktop Windows (x86_64)
    needs: setup
    if: needs.setup.outputs.run_desktop == 'true' && (needs.setup.outputs.desktop == 'all' || needs.setup.outputs.desktop == 'windows')
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: desktop-windows-x86_64

      # The Vulkan STT runner is built here, so the SDK it needs at build
      # time (headers, loader, glslc for ggml's shaders) is installed the way
      # the windows-x86-vulkan CLI preset installs it, integrity pinned.
      - name: Install Vulkan SDK (Windows)
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe"
          $expected = "acb4ae0786fd3e558f8b3c36cc3eba91638984217ba8a6795ec64d2f9ffd8c4b"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe -UseBasicParsing
          $actual = (Get-FileHash VulkanSDK.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
              throw "VulkanSDK.exe sha256 mismatch: expected $expected, got $actual"
          }
          Start-Process -FilePath ".\VulkanSDK.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          $sdk = "C:\VulkanSDK\1.3.296.0"
          echo "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          echo "$sdk\Bin" >> $env:GITHUB_PATH

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend deps
        working-directory: crates/apollia-desktop/ui
        run: npm ci

      - name: Build Python bundle (x86_64-pc-windows-msvc)
        shell: bash
        run: |
          ./packaging/build-python-bundle.sh x86_64-pc-windows-msvc \
            target/python-bundle/x86_64-pc-windows-msvc

      # `createUpdaterArtifacts: true` + `pubkey` make `cargo tauri build`
      # demand TAURI_SIGNING_PRIVATE_KEY. The build must finish either way:
      # with the secret it emits updater artifacts, without it it builds with
      # createUpdaterArtifacts=false and the run summary says so. Configuring
      # the secret stays a human act.
      - name: Guard the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not configured: building with createUpdaterArtifacts=false, this build ships no updater artifact"
            echo "TAURI_SIGNING_PRIVATE_KEY absent : createUpdaterArtifacts=false, no updater artifact" >> "$GITHUB_STEP_SUMMARY"
            echo 'TAURI_BUNDLE_CONFIG={"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"
          fi

      - name: Build Tauri app
        working-directory: crates/apollia-desktop
        shell: bash
        env:
          PYO3_PYTHON: ${{ github.workspace }}/target/python-bundle/x86_64-pc-windows-msvc/python/python.exe
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
          # Both STT runners: the Vulkan one, which whisper drives on AMD,
          # Intel and NVIDIA cards alike (measured 2026-09-10 on a Radeon RX
          # 6900 XT, 2.2 s for 5.5 s of audio against 8.2 s on the processor),
          # and the processor one the runtime degrades to without a Vulkan
          # loader. This is what host_desktop_runners answers for Windows.
          APOLLIA_DESKTOP_RUNNERS: "cpu vulkan"
          # The inference engine is Vulkan here. Vulkan reaches NVIDIA, AMD
          # and Intel from one 32 MB binary, where the CUDA engine covers
          # NVIDIA alone, weighs 238 MB plus a 373 MB runtime, and falls back
          # to the CPU on every other card. The CUDA engine is not bundled:
          # the application downloads it on demand from the engine channel.
          APOLLIA_DESKTOP_LLAMA_BACKEND: "vulkan"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${TAURI_BUNDLE_CONFIG:-}" ]; then
            cargo tauri build --target x86_64-pc-windows-msvc --config "$TAURI_BUNDLE_CONFIG"
          else
            cargo tauri build --target x86_64-pc-windows-msvc
          fi

      # ── Code signing with signtool (gated by secrets) ──────────────────────
      # The PFX cert is passed as base64 and signed with signtool of the
      # Windows SDK (present by default on the windows-latest runner).
      - name: Sign MSI + NSIS installers (if cert present)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "code.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match 'x64\\signtool.exe$' } |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $bundleDir = "target/x86_64-pc-windows-msvc/release/bundle"
          $targets = @()
          if (Test-Path "$bundleDir/msi") { $targets += Get-ChildItem "$bundleDir/msi/*.msi" }
          if (Test-Path "$bundleDir/nsis") { $targets += Get-ChildItem "$bundleDir/nsis/*.exe" }
          foreach ($t in $targets) {
              & $signtool sign /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 `
                  /f $pfx /p $env:WINDOWS_CERT_PASSWORD $t.FullName
              & $signtool verify /pa $t.FullName
          }

      # Flat staging, same reason as the Linux job: keep the installers out
      # of msi/ and nsis/ sub-folders the release job's flat globs never see.
      # GitHub's pwsh shell runs with $ErrorActionPreference = 'Stop', so an
      # unmatched glob fails the step.
      - name: Collect installers (flat paths)
        shell: pwsh
        run: |
          $bundle = "target/x86_64-pc-windows-msvc/release/bundle"
          New-Item -ItemType Directory -Force -Path "$bundle/dist" | Out-Null
          Copy-Item "$bundle/msi/*.msi" "$bundle/dist/"
          Copy-Item "$bundle/nsis/*.exe" "$bundle/dist/"
          # Updater signatures exist only on a keyed build; their absence is
          # said out loud, because latest.json is composed from the signatures
          # the release job receives.
          $sigs = @(Get-ChildItem "$bundle/msi/*.msi.sig", "$bundle/nsis/*.exe.sig" -ErrorAction SilentlyContinue)
          if ($sigs.Count -gt 0) {
              $sigs | Copy-Item -Destination "$bundle/dist/"
          } else {
              Write-Output "::warning::no Windows updater signature (TAURI_SIGNING_PRIVATE_KEY absent): latest.json will not cover windows-x86_64"
          }
          # GitHub rewrites any character outside [A-Za-z0-9._-] in a release
          # asset name, so "Apollia OS_..." is served as "Apollia.OS_...". The
          # file is renamed here rather than the name being guessed downstream:
          # one name from the runner to the download URL, and a contract a
          # guard can check on disk.
          Get-ChildItem "$bundle/dist/Apollia OS*" -ErrorAction SilentlyContinue | ForEach-Object {
              Rename-Item $_.FullName ($_.Name -replace '^Apollia OS', 'Apollia-OS')
          }

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/x86_64-pc-windows-msvc/release/bundle
          format: cyclonedx-json
          output-file: target/x86_64-pc-windows-msvc/release/bundle/dist/apollia-desktop-windows-x86_64.cdx.json
          upload-artifact: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/x86_64-pc-windows-msvc/release/bundle
          format: spdx-json
          output-file: target/x86_64-pc-windows-msvc/release/bundle/dist/apollia-desktop-windows-x86_64.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apollia-desktop-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/bundle/dist/*
          if-no-files-found: error
          retention-days: 7 # see "Artifact retention" at the top

  # ────────────────────────────────────────────────────────────────────────────
  # Aggregation → GitHub Release draft (tag push uniquement)
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release (draft)
    needs: [cli, desktop-macos, desktop-linux, desktop-windows]
    # No `always()`: a missing installer is a broken release, not something a
    # reviewer discovers after the draft exists. When one platform fails, fix
    # it or re-run the failed job; the three blocking presets and three
    # desktop jobs are the contract a tag promises. The draft itself is never
    # auto-published.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    permissions:
      contents: write # publish the release draft
      id-token: write # cosign keyless OIDC + provenance
      attestations: write # build-provenance attestation
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      # `plugins.updater.pubkey` and the private key in the repository secrets
      # are two values nothing ties together. A rotation moves one and leaves
      # the other, in silence, and the bundle then refuses every update it is
      # ever offered, unrepairable remotely because the broken channel is the
      # one that would carry the repair. It happened twice on 2026-09-10 alone.
      # Reading the key id out of the signatures this run just produced is the
      # only moment both halves are in the same place.
      - name: The updater signatures come from the key the bundle trusts
        run: |
          mapfile -t sigs < <(find artifacts -name '*.sig' -type f | sort)
          if [ "${#sigs[@]}" -eq 0 ]; then
            echo "no updater signature in this run, nothing to check"
            exit 0
          fi
          python3 scripts/check_updater_key.py \
            crates/apollia-desktop/tauri.conf.json "${sigs[@]}"

      # Say plainly which platforms made it, and refuse an empty set outright.
      # The job only runs when every producing job succeeded, so a missing
      # family here means an upload contract broke, not a failed build.
      - name: Report coverage and refuse an empty draft
        run: |
          shopt -s nullglob
          mapfile -t all < <(find artifacts -type f ! -name '*.sig' ! -name '*.pem' \
                                            ! -name '*.cdx.json' ! -name '*.spdx.json' | sort)
          if [ "${#all[@]}" -eq 0 ]; then
            echo "::error::no artifact was produced; refusing to publish an empty draft"
            exit 1
          fi
          missing=0
          for probe in "dmg:macOS installer" "deb:Linux .deb" "AppImage:Linux AppImage" \
                       "msi:Windows installer"; do
            pat="${probe%%:*}"; label="${probe#*:}"
            if find artifacts -type f -iname "*.${pat}" -o -type f -iname "*${pat}*" \
               | grep -q .; then
              echo "present: ${label}"
            else
              echo "::warning::missing ${label}; the draft will not carry it"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::warning::this draft does not cover every supported platform, \
                  review before publishing"
          fi

      # The updater manifest. `cargo tauri build` does NOT emit latest.json:
      # it emits one minisign signature per updater artifact, and composing
      # the manifest from them is this step's job (tauri-action does the same
      # for projects that use it). The version is read from tauri.conf.json,
      # never from the git tag: SemVer ranks a numeric pre-release identifier
      # below an alphanumeric one, so a manifest stamped with a trial tag
      # `vX.Y.Z-rc.N` would read as permanently newer than the bundle
      # `X.Y.Z-N` it describes. A
      # platform whose signature is absent (no signing key on the build) is
      # left out, and an empty manifest is still published: the updater plugin
      # reports it as "channel unavailable", which is the true state.
      #
      # A trial version (the contract's `preview.tag`, vX.Y.Z-rc.N) publishes
      # the preview manifests instead, latest-preview.json and
      # latest-cuda-preview.json, and never a stable one: the stable channel is
      # left exactly as the last stable release set it. Its bundle must carry
      # the version X.Y.Z-N, numeric because WiX refuses any other pre-release
      # identifier; the step refuses a trial tag whose bundle says otherwise.
      #
      # latest-cuda.json is the manifest the installers with a bundled CUDA
      # engine were built to ask. Those installers are no longer produced, and
      # the copies already installed keep asking that file, so it is still
      # published, as a copy of latest.json (the contract's
      # `manifest_aliases`): such a copy updates to the one installer of its
      # system, which then offers the CUDA engine through the engine channel.
      # Dropping the file would leave those machines on their last version for
      # good, told only that the channel is unavailable.
      - name: Compose the updater manifest (latest.json)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import datetime
          import json
          import os
          import pathlib
          import re
          import sys
          import urllib.parse

          contract = json.loads(pathlib.Path("packaging/artifacts.json").read_text())
          conf = json.loads(pathlib.Path("crates/apollia-desktop/tauri.conf.json").read_text())
          version = conf["version"]
          repo = contract["repo"]
          tag = os.environ["TAG"]
          base = f"https://github.com/{repo}/releases/download/{tag}/"

          preview = contract["preview"]
          trial = re.match(preview["tag"], tag)
          if trial:
              expected = f"{trial.group(1)}-{trial.group(2)}"
              if version != expected:
                  print(f"::error::the trial tag {tag} needs tauri.conf.json version "
                        f"{expected} (numeric pre-release, WiX), found {version}")
                  sys.exit(1)
          published_as = {
              name: preview["manifests"][name] if trial else name
              for name in contract["updater_manifests"]
          }

          # One manifest per channel, because a Tauri manifest keys platforms
          # by triple: two bundles sharing a triple cannot share a manifest.
          # Each contract entry names the channel it belongs to, and each
          # bundle was built pointing at that file.
          channels = {}
          for entry in contract["desktop"]:
              # `updater: null` is a bundle that does not self-update: it
              # contributes no platform, and its channel is still created.
              if entry.get("updater") is None:
                  channels.setdefault(entry["manifest"], {})
                  continue
              artifact = entry["updater"]["artifact"].replace("{version}", version)
              signature = entry["updater"]["signature"].replace("{version}", version)
              name = entry["manifest"]
              sig_path = pathlib.Path("artifacts") / signature
              if not sig_path.is_file():
                  print(f"::warning::{signature} missing, {entry['platform']} left out of {name}")
                  channels.setdefault(name, {})
                  continue
              channels.setdefault(name, {})[entry["platform"]] = {
                  "url": base + urllib.parse.quote(artifact),
                  "signature": sig_path.read_text().strip(),
              }

          stamp = (
              datetime.datetime.now(datetime.timezone.utc)
              .isoformat(timespec="seconds").replace("+00:00", "Z")
          )
          # An alias is a manifest no bundle is built for any more: it is
          # published with the platforms of the manifest it names.
          aliases = contract.get("manifest_aliases", {})
          for name in contract["updater_manifests"]:
              source = aliases.get(name, name)
              platforms = channels.get(source, {})
              manifest = {
                  "version": version,
                  "notes": f"Apollia OS {tag}",
                  "pub_date": stamp,
                  "platforms": platforms,
              }
              out = pathlib.Path("artifacts") / published_as[name]
              out.write_text(json.dumps(manifest, indent=2) + "\n")
              note = f" (copy of {source})" if source != name else ""
              print(f"wrote {out} covering {sorted(platforms)}{note}")
          EOF

      # One SHA256SUMS covering every artifact. The three per-job files of the
      # previous shape were homonyms: merged into one directory, two of the
      # three were silently overwritten.
      # ── What the release publishes, decided once ───────────────────────────
      # `artifacts/` can hold more than the release ships: a job once uploaded
      # a build input there, twelve shared objects no upload pattern
      # published, which sat beside the installers once merged flat. Steps
      # that walked the directory rather than the publication list therefore
      # signed twelve files nobody could download, and listed them in
      # SHA256SUMS, so the `shasum -a 256 -c SHA256SUMS` that SECURITY.md
      # documents failed twelve times on a correctly built release.
      #
      # The patterns below are the publication list, and the release step at the
      # bottom of this job repeats them; check_release_artifacts.py holds the
      # two identical, because a drift between them brings the defect straight
      # back.
      - name: Select what the release publishes
        working-directory: artifacts
        run: |
          shopt -s nullglob
          published=()
          for pattern in \
            '*.tar.gz' '*.tar.gz.sha256' '*.zip' '*.zip.sha256' \
            '*.dmg' '*.deb' '*.AppImage' '*.msi' '*.exe' \
            'latest*.json' \
            '*.cdx.json' '*.spdx.json' '*.sig'; do
            for f in $pattern; do
              [ -f "$f" ] && published+=("$f")
            done
          done
          if [ "${#published[@]}" -eq 0 ]; then
            echo "::error::the publication list is empty; refusing to sign and hash nothing"
            exit 1
          fi
          printf '%s\n' "${published[@]}" | sort -u > "$RUNNER_TEMP/published.txt"
          echo "published $(wc -l < "$RUNNER_TEMP/published.txt") file(s):"
          cat "$RUNNER_TEMP/published.txt"

      - name: SHA256SUMS
        working-directory: artifacts
        run: |
          # Reads the publication list rather than the directory: an inventory
          # that names a file the release does not carry fails on a user's
          # machine through no fault of theirs.
          # NUL-separated on principle rather than on need: the desktop jobs
          # rename their bundles out of the space tauri-bundler puts there, but
          # a separator that cannot appear in a name costs nothing and does not
          # depend on that staying true.
          tr '\n' '\0' < "$RUNNER_TEMP/published.txt" | \
            xargs -0 shasum -a 256 > SHA256SUMS
          cat SHA256SUMS

      - name: GPG-sign SHA256SUMS (if key present)
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: artifacts
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback \
            --detach-sign --armor --output SHA256SUMS.asc SHA256SUMS

      # ── Cryptographic signing (cosign keyless, Sigstore OIDC) ───────────────
      # Every published file gets a Sigstore bundle, which carries its signature
      # and the signing certificate together.
      # Verify with: cosign verify-blob --bundle <f>.cosign.bundle
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #   --certificate-identity-regexp '^https://github.com/Apollia-OS/' <f>
      #
      # A bundle rather than the --output-signature and --output-certificate
      # pair it replaces, for two reasons. cosign 3 signs in the new bundle
      # format by default, ignores both flags and then fails on the empty
      # --bundle it still requires. And writing `$f.sig` collided head-on with
      # the four updater signatures the contract declares: they are produced by
      # the desktop jobs, read into latest.json by the step above and hashed
      # into SHA256SUMS, so overwriting them here published files whose
      # checksums no longer matched the inventory shipped beside them.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifacts (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          shopt -s nullglob
          # Each call fetches its own ambient OIDC token from GitHub's Actions
          # endpoint, and this loop makes 40+ such calls back to back. That
          # endpoint occasionally answers a burst of requests with a
          # non-JSON body ("invalid character '<x>' looking for beginning of
          # value" out of cosign, whatever the first byte of the error page
          # happens to be), which is transient, not a real credential
          # failure: the surrounding calls in the same run succeed. Retried
          # five times with a short backoff rather than failing the whole,
          # expensive multi-platform job on one flaked token fetch.
          sign_with_retry() {
            local f="$1" attempt
            for attempt in 1 2 3 4 5; do
              if cosign sign-blob --yes --bundle "$f.cosign.bundle" "$f"; then
                return 0
              fi
              echo "::warning::cosign sign-blob failed for $f (attempt $attempt/5), retrying" >&2
              rm -f "$f.cosign.bundle"
              sleep "$((attempt * 5))"
            done
            echo "::error::cosign sign-blob failed for $f after 5 attempts" >&2
            return 1
          }
          # The publication list, plus the inventory and its detached
          # signature, which are written after it and are published too.
          # Walking artifacts/ instead signed twelve build inputs the release
          # does not carry, and published a bundle for each: a verifier found a
          # signature for a file they could not download.
          while IFS= read -r name; do
            f="artifacts/$name"
            [ -f "$f" ] || continue
            sign_with_retry "$f"
          done < "$RUNNER_TEMP/published.txt"
          for f in artifacts/SHA256SUMS artifacts/SHA256SUMS.asc; do
            [ -f "$f" ] || continue
            sign_with_retry "$f"
          done

      # ── SLSA build provenance attestation over the binaries + SBOMs ─────────
      # Verify with: gh attestation verify <file> --repo Apollia-OS/apollia-os
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.msi
            artifacts/*.exe
            artifacts/*.cdx.json
            artifacts/*.spdx.json

      # The draft body is the CHANGELOG.md section that matches the tag, so the
      # release says what changed rather than dumping a commit list.
      # `generate_release_notes` still appends GitHub's own summary underneath.
      - name: Build the release body from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            echo "::warning::CHANGELOG.md carries no section for ${version}; \
                  the whole file becomes the body"
            cp CHANGELOG.md RELEASE_BODY.md
          fi
          echo "release body: $(wc -l < RELEASE_BODY.md) line(s)"

      # The upload sends one file per matched path, and a file matched by two
      # patterns is sent twice: the second send goes to the asset-update
      # endpoint and races the first, which answers 404 and fails the job after
      # eighty minutes of building. Measured twice, on 2026-09-04 and
      # 2026-09-07, on SHA256SUMS.cosign.bundle, caught by both `SHA256SUMS*`
      # and `*.cosign.bundle`. The patterns are read from this file, so the
      # check cannot drift from what the step below actually uploads.
      - name: Refuse a file the upload would send twice
        run: |
          python3 - <<'PY'
          import glob, pathlib, re, sys, collections
          text = pathlib.Path(".github/workflows/release.yml").read_text(encoding="utf-8")
          block = re.search(
              r"name: Create release draft\n.*?\n          files: \|\n((?:            \S+\n)+)",
              text, re.S)
          if block is None:
              print("::error::the upload patterns could not be read from this workflow")
              sys.exit(2)
          patterns = [line.strip() for line in block.group(1).splitlines() if line.strip()]
          seen = collections.Counter()
          for pattern in patterns:
              for path in glob.glob(pattern):
                  seen[pathlib.Path(path).name] += 1
          twice = sorted(name for name, n in seen.items() if n > 1)
          print(f"{len(patterns)} pattern(s), {len(seen)} file(s) matched")
          if twice:
              print("::error::these files are matched by more than one upload pattern, "
                    "and the second upload of a name races the first: " + ", ".join(twice))
              sys.exit(1)
          PY

      - name: Create release draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.msi
            artifacts/*.exe
            artifacts/latest*.json
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.asc
            artifacts/*.cdx.json
            artifacts/*.spdx.json
            artifacts/*.sig
            artifacts/*.cosign.bundle
          draft: true
          # A trial version is a pre-release: GitHub never serves it as the
          # latest release, so the stable endpoint cannot reach it, and
          # publishing it fires preview-channel.yml.
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
