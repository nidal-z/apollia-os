# Release - production des artefacts distribuables.
#
# Déclenché sur push d'un tag `v*` (release officielle) ou via dispatch
# manuel pour tester sans bumper la version.
#
# Produit, en parallèle :
#   1. 13 binaires CLI self-contained (Python + CRT statique bundlés)
#      → tarball/zip par preset OS × arch × accélérateur
#   2. Desktop installers (Tauri 2), un job par OS :
#        macOS ARM64  : .dmg
#        Linux x86_64 : .deb + .AppImage
#        Windows x86_64 : .msi + .exe (NSIS)
#      Chaque job desktop embarque le meme bundle Python (PyO3) que le job CLI.
#
# Job final `release` agrège tout dans une GitHub Release draft (review manuel
# avant publication).
#
# Wall-clock cold : ~35-40 min · warm cache : ~20 min. Cf. BUILD.md.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      presets:
        description: "CLI presets à builder (comma-separated, ex: macos-silicon,windows-x86-cuda). 'all' = tous."
        required: false
        default: "all"
      skip_desktop:
        description: "Skip le bundle desktop macOS (gain ~12 min si tu testes juste CLI)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default. Only the final `release` job escalates (below).
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Setup - calcule la matrice CLI filtrée (dynamic matrix).
  #
  # GH Actions ne supporte PAS `matrix.preset` dans le `if:` au niveau du job
  # (limitation parser). Le contournement standard : un job léger qui sort
  # le JSON de la matrice, ingéré ensuite via `fromJSON(needs.setup.outputs.matrix)`.
  # ────────────────────────────────────────────────────────────────────────────
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      run_desktop: ${{ steps.compute.outputs.run_desktop }}
    steps:
      - id: compute
        env:
          PRESETS_INPUT: ${{ github.event.inputs.presets || 'all' }}
          SKIP_DESKTOP: ${{ github.event.inputs.skip_desktop || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          # Full preset matrix - single source of truth.
          #
          # `allow_fail` marks a preset as advisory: it still builds and uploads
          # when it works, but its failure does not block the release. Exactly
          # three presets are blocking, one per supported platform, which is what
          # makes a tag able to produce a draft at all. Previously ten of the
          # thirteen were blocking, so any single exotic accelerator failing took
          # the whole release with it.
          #
          # The `local-*` / `stt-*` features now only select the whisper
          # acceleration of the STT sidecar. Local LLM inference runs through the
          # pinned llama-server binary, which upstream publishes per platform, so
          # a GPU preset failing here costs STT acceleration, never inference.
          read -r -d '' FULL <<'JSON' || true
          {
            "include": [
              {"preset":"macos-silicon",      "runner":"macos-latest",    "triple":"aarch64-apple-darwin",      "features":"cloud,local-metal,local-accelerate,stt-metal", "archive":"tar.gz"},
              {"preset":"linux-x86-cpu",      "runner":"ubuntu-22.04",    "triple":"x86_64-unknown-linux-gnu",  "features":"cloud,local-cpu,stt-whisper-cpp",              "archive":"tar.gz"},
              {"preset":"windows-x86-cpu",    "runner":"windows-latest",  "triple":"x86_64-pc-windows-msvc",    "features":"cloud,local-cpu,stt-whisper-cpp",              "archive":"zip"},
              {"preset":"linux-x86-cuda",     "runner":"ubuntu-22.04",    "triple":"x86_64-unknown-linux-gnu",  "features":"cloud,local-cuda,stt-cuda",                    "archive":"tar.gz", "needs_cuda":true,   "allow_fail":true},
              {"preset":"linux-x86-rocm",     "runner":"ubuntu-22.04",    "triple":"x86_64-unknown-linux-gnu",  "features":"cloud,local-rocm,stt-rocm",                    "archive":"tar.gz", "needs_rocm":true,   "allow_fail":true},
              {"preset":"linux-x86-vulkan",   "runner":"ubuntu-22.04",    "triple":"x86_64-unknown-linux-gnu",  "features":"cloud,local-vulkan,stt-whisper-cpp",           "archive":"tar.gz", "needs_vulkan":true, "allow_fail":true},
              {"preset":"linux-arm-cpu",      "runner":"ubuntu-24.04-arm","triple":"aarch64-unknown-linux-gnu", "features":"cloud,local-cpu,stt-whisper-cpp",              "archive":"tar.gz", "allow_fail":true},
              {"preset":"linux-arm-cuda",     "runner":"ubuntu-24.04-arm","triple":"aarch64-unknown-linux-gnu", "features":"cloud,local-cuda,stt-cuda",                    "archive":"tar.gz", "needs_cuda":true,   "allow_fail":true},
              {"preset":"windows-x86-cuda",   "runner":"windows-latest",  "triple":"x86_64-pc-windows-msvc",    "features":"cloud,local-cuda,stt-cuda",                    "archive":"zip",    "needs_cuda":true,   "allow_fail":true},
              {"preset":"windows-x86-rocm",   "runner":"windows-latest",  "triple":"x86_64-pc-windows-msvc",    "features":"cloud,local-rocm,stt-rocm",                    "archive":"zip",    "needs_rocm":true,   "allow_fail":true},
              {"preset":"windows-x86-vulkan", "runner":"windows-latest",  "triple":"x86_64-pc-windows-msvc",    "features":"cloud,local-vulkan,stt-whisper-cpp",           "archive":"zip",    "needs_vulkan":true, "allow_fail":true},
              {"preset":"windows-arm-cpu",    "runner":"windows-11-arm",  "triple":"aarch64-pc-windows-msvc",   "features":"cloud,local-cpu,stt-whisper-cpp",              "archive":"zip",    "allow_fail":true},
              {"preset":"windows-arm-cuda",   "runner":"windows-11-arm",  "triple":"aarch64-pc-windows-msvc",   "features":"cloud,local-cuda,stt-cuda",                    "archive":"zip",    "needs_cuda":true,   "allow_fail":true}
            ]
          }
          JSON

          if [[ "$EVENT_NAME" != "workflow_dispatch" || "$PRESETS_INPUT" == "all" || -z "$PRESETS_INPUT" ]]; then
            MATRIX="$FULL"
          else
            # jq filter on PRESETS_INPUT (comma-separated)
            MATRIX=$(echo "$FULL" | jq -c --arg p "$PRESETS_INPUT" \
              '{include: [.include[] | select(.preset as $x | $p | split(",") | index($x))]}')
          fi

          echo "Matrix selected:"
          echo "$MATRIX" | jq -r '.include[] | "  · " + .preset'

          # GH Actions output: compact JSON (single line).
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"

          # Desktop gate.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$SKIP_DESKTOP" == "true" ]]; then
            echo "run_desktop=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_desktop=true" >> "$GITHUB_OUTPUT"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # CLI binaries (13 presets max) - self-contained bundles avec Python embarqué
  # ────────────────────────────────────────────────────────────────────────────
  cli:
    name: CLI ${{ matrix.preset }}
    needs: setup
    if: needs.setup.outputs.matrix != '' && fromJSON(needs.setup.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_fail || false }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}

      - name: Install Linux build deps
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            python3-dev clang cmake

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # ── GPU SDK install (only if matrix says so) ──────────────────────────
      # CUDA Linux x86 : sub-packages minimaux suffisent (CMake trouve nvcc + libs).
      - name: Install CUDA Toolkit (Linux x86)
        if: matrix.needs_cuda && matrix.runner == 'ubuntu-22.04'
        uses: Jimver/cuda-toolkit@9b295696791d75d658d8de64c4a85097ad8abeaf # v0.2.16
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","curand","curand_dev","thrust"]'
          use-github-cache: true

      # CUDA Windows x86 : DOIT inclure `visual_studio_integration` pour que
      # CMake détecte le toolset CUDA-MSBuild. Sans ce sub-package, le build
      # plante avec : "CMake Error : No CUDA toolset found".
      # (Cf. ggml/src/ggml-cuda/CMakeLists.txt:58 → enable_language(CUDA))
      - name: Install CUDA Toolkit (Windows x86)
        if: matrix.needs_cuda && matrix.runner == 'windows-latest'
        uses: Jimver/cuda-toolkit@9b295696791d75d658d8de64c4a85097ad8abeaf # v0.2.16
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","curand","curand_dev","thrust","visual_studio_integration"]'
          use-github-cache: true

      - name: Install CUDA aarch64 (Jetson SBSA)
        if: matrix.needs_cuda && matrix.runner == 'ubuntu-24.04-arm'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/12.4.0/local_installers/cuda-repo-ubuntu2204-12-4-local_12.4.0-550.54.14-1_arm64.deb -O /tmp/cuda.deb || true
          sudo dpkg -i /tmp/cuda.deb || true
          sudo cp /var/cuda-repo-*/cuda-*-keyring.gpg /usr/share/keyrings/ || true
          sudo apt-get update -q
          sudo apt-get install -y cuda-toolkit-12-4 || echo "::warning::CUDA aarch64 install failed (L4T only)"
          echo "CUDA_PATH=/usr/local/cuda-12.4" >> $GITHUB_ENV
          echo "/usr/local/cuda-12.4/bin" >> $GITHUB_PATH

      - name: Install ROCm (Linux)
        if: matrix.needs_rocm && startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get install -y wget gnupg
          wget -O- https://repo.radeon.com/rocm/rocm.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.0/ jammy main" | \
            sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update -q
          sudo apt-get install -y rocm-hip-sdk rocm-llvm rocblas hipblas
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "/opt/rocm/bin" >> $GITHUB_PATH

      - name: Install HIP SDK (Windows)
        if: matrix.needs_rocm && startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: |
          $url = "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-24.Q3-WinSvr2022-For-HIP.exe"
          Invoke-WebRequest -Uri $url -OutFile hip-installer.exe -UseBasicParsing
          Start-Process -FilePath ".\hip-installer.exe" -ArgumentList "-install","-quiet" -Wait
          echo "HIP_PATH=C:\Program Files\AMD\ROCm\6.1" >> $env:GITHUB_ENV
          echo "C:\Program Files\AMD\ROCm\6.1\bin" >> $env:GITHUB_PATH

      - name: Install Vulkan SDK (Linux)
        if: matrix.needs_vulkan && startsWith(matrix.runner, 'ubuntu')
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/lunarg.gpg
          echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan/1.3.290 jammy main" | \
            sudo tee /etc/apt/sources.list.d/vulkan.list
          sudo apt-get update -q
          sudo apt-get install -y vulkan-sdk

      - name: Install Vulkan SDK (Windows)
        if: matrix.needs_vulkan && startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/1.3.290.0/windows/VulkanSDK-1.3.290.0-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe -UseBasicParsing
          Start-Process -FilePath ".\VulkanSDK.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          $sdk = "C:\VulkanSDK\1.3.290.0"
          echo "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          echo "$sdk\Bin" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.preset }}
          shared-key: cli-binaries

      # ── Python bundle (avant cargo : PyO3 link contre l'interprète bundlé) ──
      - name: Build Python bundle
        shell: bash
        run: |
          mkdir -p target/python-bundle/${{ matrix.triple }}
          bash packaging/build-python-bundle.sh \
            ${{ matrix.triple }} \
            target/python-bundle/${{ matrix.triple }}
          if [ -x "target/python-bundle/${{ matrix.triple }}/python/bin/python3.13" ]; then
            echo "PYO3_PYTHON=$(pwd)/target/python-bundle/${{ matrix.triple }}/python/bin/python3.13" >> $GITHUB_ENV
          else
            echo "PYO3_PYTHON=$(pwd)/target/python-bundle/${{ matrix.triple }}/python/python.exe" >> $GITHUB_ENV
          fi

      # ── Build ─────────────────────────────────────────────────────────────
      # Depuis le refactor multi-runner, apollia-cli n'expose plus
      # que la feature `cloud`. Les features `local-*` / `stt-*` historiques
      # de `matrix.features` ne s'appliquent plus qu'au runner (filtrées par
      # l'étape "Extract runner feature" ci-dessous). On force ici `cloud`
      # quand il est demandé, rien sinon.
      # Windows : +crt-static via .cargo/config.toml + CMAKE_MSVC_RUNTIME_LIBRARY
      # pour aligner /MT côté apollia-runner (llama-cpp-sys-2 / whisper-rs-sys).
      - name: Build CLI
        shell: bash
        env:
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        run: |
          CLI_FEATS=""
          if echo "${{ matrix.features }}" | grep -q '\bcloud\b'; then
            CLI_FEATS="cloud"
          fi
          cargo build --release -p apollia-cli \
            --target ${{ matrix.triple }} \
            --no-default-features \
            --features "$CLI_FEATS"

      # Build apollia-runner avec la feature backend correspondante.
      # Extrait local-{cpu,cuda,rocm,vulkan,metal} de matrix.features.
      # Pour les presets sans local-* (cloud only), pas de runner buildé.
      - name: Extract runner feature
        id: runner_feat
        shell: bash
        run: |
          FEAT=$(echo "${{ matrix.features }}" | tr ',' '\n' | grep -E '^local-(cpu|cuda|rocm|vulkan|metal)$' | head -1 || true)
          echo "feature=$FEAT" >> "$GITHUB_OUTPUT"
          if [ -n "$FEAT" ]; then
            BACKEND=${FEAT#local-}
            echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          fi

      - name: Build apollia-runner
        if: steps.runner_feat.outputs.feature != ''
        shell: bash
        env:
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        run: |
          cargo build --release -p apollia-runner \
            --target ${{ matrix.triple }} \
            --no-default-features \
            --features "${{ steps.runner_feat.outputs.feature }}"

      - name: Strip binary (Linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          strip target/${{ matrix.triple }}/release/apollia-os
          if [ -f target/${{ matrix.triple }}/release/apollia-runner ]; then
            strip target/${{ matrix.triple }}/release/apollia-runner
          fi

      # ── Package self-contained ────────────────────────────────────────────
      - name: Assemble bundle (Unix)
        if: runner.os != 'Windows'
        env:
          RUNNER_BACKEND: ${{ steps.runner_feat.outputs.backend }}
        run: |
          STAGE="target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}"
          mkdir -p "$STAGE"
          cp target/${{ matrix.triple }}/release/apollia-os "$STAGE/apollia-os"
          cp packaging/launchers/apollia-os.sh "$STAGE/apollia-os.sh"
          chmod +x "$STAGE/apollia-os.sh"
          cp -R target/python-bundle/${{ matrix.triple }}/python "$STAGE/python"
          # Inclut le runner correspondant au backend du preset si compilé.
          if [ -n "$RUNNER_BACKEND" ] && [ -f "target/${{ matrix.triple }}/release/apollia-runner" ]; then
            cp "target/${{ matrix.triple }}/release/apollia-runner" "$STAGE/apollia-runner-$RUNNER_BACKEND"
            chmod +x "$STAGE/apollia-runner-$RUNNER_BACKEND"
            echo "  Runner bundled : apollia-runner-$RUNNER_BACKEND"
          fi
          cat > "$STAGE/README.txt" <<EOF
          Apollia OS ${{ matrix.preset }} - self-contained bundle
          ========================================================
          Lance : ./apollia-os.sh start
          Doc   : https://apollia.fr/docs/install
          Inclus : daemon apollia-os + sidecar runner ($RUNNER_BACKEND) + Python 3.13.
          Requis : driver GPU à jour si preset GPU.
          EOF
          cd target/${{ matrix.triple }}/bundle
          tar -czf apollia-os-${{ matrix.preset }}.tar.gz apollia-os-${{ matrix.preset }}/
          shasum -a 256 apollia-os-${{ matrix.preset }}.tar.gz > apollia-os-${{ matrix.preset }}.tar.gz.sha256

      - name: Assemble bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUNNER_BACKEND: ${{ steps.runner_feat.outputs.backend }}
        run: |
          $stage = "target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.triple }}/release/apollia-os.exe" "$stage/apollia-os.exe"
          Copy-Item "packaging/launchers/apollia-os.bat" "$stage/apollia-os.bat"
          Copy-Item -Recurse "target/python-bundle/${{ matrix.triple }}/python/*" "$stage/"
          $rb = "${env:RUNNER_BACKEND}"
          if ($rb -and (Test-Path "target/${{ matrix.triple }}/release/apollia-runner.exe")) {
              Copy-Item "target/${{ matrix.triple }}/release/apollia-runner.exe" "$stage/apollia-runner-$rb.exe"
              Write-Host "  Runner bundled : apollia-runner-$rb.exe"
          }
          @"
          Apollia OS ${{ matrix.preset }} - self-contained bundle
          ========================================================
          Lance : apollia-os.bat start
          Doc   : https://apollia.fr/docs/install
          Inclus : daemon apollia-os.exe + sidecar runner ($rb) + Python 3.13 + CRT statique.
          Requis cote user : driver GPU a jour. Pas de VC++ Redist necessaire.
          "@ | Out-File "$stage/README.txt" -Encoding ASCII
          Push-Location "target/${{ matrix.triple }}/bundle"
          Compress-Archive -Path "apollia-os-${{ matrix.preset }}" -DestinationPath "apollia-os-${{ matrix.preset }}.zip"
          $hash = (Get-FileHash "apollia-os-${{ matrix.preset }}.zip" -Algorithm SHA256).Hash
          "$hash  apollia-os-${{ matrix.preset }}.zip" | Out-File "apollia-os-${{ matrix.preset }}.zip.sha256" -Encoding ASCII
          Pop-Location

      # ── SBOM (whole bundle : Rust crates + embedded CPython) ────────────────
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}
          format: cyclonedx-json
          output-file: target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}.cdx.json
          upload-artifact: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}
          format: spdx-json
          output-file: target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apollia-os-${{ matrix.preset }}
          path: |
            target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}.${{ matrix.archive }}
            target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}.${{ matrix.archive }}.sha256
            target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}.cdx.json
            target/${{ matrix.triple }}/bundle/apollia-os-${{ matrix.preset }}.spdx.json
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Desktop bundle Tauri - macOS ARM64 .dmg (extension future : Linux/Win)
  # ────────────────────────────────────────────────────────────────────────────
  desktop-macos:
    name: Desktop macOS (ARM64)
    needs: setup
    if: needs.setup.outputs.run_desktop == 'true'
    runs-on: macos-latest
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: desktop-macos-arm64

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend deps
        working-directory: crates/apollia-desktop/ui
        run: npm ci

      - name: Build Python bundle (aarch64-apple-darwin)
        run: |
          ./packaging/build-python-bundle.sh aarch64-apple-darwin \
            target/python-bundle/aarch64-apple-darwin

      - name: Build Tauri app
        working-directory: crates/apollia-desktop
        env:
          PYO3_PYTHON: ${{ github.workspace }}/target/python-bundle/aarch64-apple-darwin/python/bin/python3.13
          RUSTFLAGS: -L ${{ github.workspace }}/target/python-bundle/aarch64-apple-darwin/python/lib
          APOLLIA_DESKTOP_RUNNERS: "cpu metal"
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Post-bundle (install_names + ad-hoc sign)
        working-directory: crates/apollia-desktop
        env:
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        run: |
          bash scripts/after-bundle.sh
          APP="../../target/aarch64-apple-darwin/release/bundle/macos/Apollia OS.app"
          codesign --force --deep --sign - \
            --options runtime \
            --entitlements entitlements.plist \
            "$APP"
          codesign --verify --verbose=2 "$APP" || true

      # ── Apple Developer ID signing + notarization (gated by secrets) ────────
      # Reste no-op si les secrets ne sont pas configurés ; permet une release
      # interne non-signée pour les tests internes avant achat du cert Apple.
      - name: Apple Developer ID sign + notarize (if secrets present)
        if: env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_API_KEY != ''
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -e
          KEYCHAIN=apollia-build.keychain
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"

          APP="target/aarch64-apple-darwin/release/bundle/macos/Apollia OS.app"
          codesign --force --deep --options runtime \
            --entitlements crates/apollia-desktop/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            "$APP"
          codesign --verify --verbose=2 "$APP"

          DMG=$(ls target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG"

          echo "$APPLE_API_KEY" | base64 -d > /tmp/AuthKey.p8
          xcrun notarytool submit "$DMG" \
            --key /tmp/AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"

      - name: SHA256SUMS
        working-directory: target/aarch64-apple-darwin/release/bundle/dmg
        run: shasum -a 256 *.dmg > SHA256SUMS

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/aarch64-apple-darwin/release/bundle
          format: cyclonedx-json
          output-file: target/aarch64-apple-darwin/release/bundle/dmg/apollia-desktop-macos-arm64.cdx.json
          upload-artifact: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/aarch64-apple-darwin/release/bundle
          format: spdx-json
          output-file: target/aarch64-apple-darwin/release/bundle/dmg/apollia-desktop-macos-arm64.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apollia-desktop-macos-arm64-dmg
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS
            target/aarch64-apple-darwin/release/bundle/dmg/apollia-desktop-macos-arm64.cdx.json
            target/aarch64-apple-darwin/release/bundle/dmg/apollia-desktop-macos-arm64.spdx.json
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Desktop bundle Tauri - Linux x86_64 (.deb + .AppImage)
  # ────────────────────────────────────────────────────────────────────────────
  desktop-linux:
    name: Desktop Linux (x86_64)
    needs: setup
    if: needs.setup.outputs.run_desktop == 'true'
    # Pin sur 22.04 (jammy) pour cohérence avec les CLI Linux : webkit2gtk-4.1
    # est dispo sur noble mais on garde une base unique pour les builds.
    runs-on: ubuntu-22.04
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install Tauri / Linux build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev curl wget file \
            python3-dev clang cmake

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: desktop-linux-x86_64

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend deps
        working-directory: crates/apollia-desktop/ui
        run: npm ci

      - name: Build Python bundle (x86_64-unknown-linux-gnu)
        run: |
          ./packaging/build-python-bundle.sh x86_64-unknown-linux-gnu \
            target/python-bundle/x86_64-unknown-linux-gnu

      - name: Build Tauri app
        working-directory: crates/apollia-desktop
        env:
          PYO3_PYTHON: ${{ github.workspace }}/target/python-bundle/x86_64-unknown-linux-gnu/python/bin/python3.13
          RUSTFLAGS: -L ${{ github.workspace }}/target/python-bundle/x86_64-unknown-linux-gnu/python/lib
          APOLLIA_DESKTOP_RUNNERS: "cpu"
        run: cargo tauri build --target x86_64-unknown-linux-gnu

      - name: SHA256SUMS
        working-directory: target/x86_64-unknown-linux-gnu/release/bundle
        run: |
          set -e
          shasum -a 256 deb/*.deb appimage/*.AppImage 2>/dev/null > SHA256SUMS || true
          cat SHA256SUMS

      # ── GPG sign SHA256SUMS (gated by secrets) ──────────────────────────────
      - name: GPG-sign SHA256SUMS (if key present)
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: target/x86_64-unknown-linux-gnu/release/bundle
        run: |
          set -e
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback \
            --detach-sign --armor --output SHA256SUMS.asc SHA256SUMS

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/x86_64-unknown-linux-gnu/release/bundle
          format: cyclonedx-json
          output-file: target/x86_64-unknown-linux-gnu/release/bundle/apollia-desktop-linux-x86_64.cdx.json
          upload-artifact: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/x86_64-unknown-linux-gnu/release/bundle
          format: spdx-json
          output-file: target/x86_64-unknown-linux-gnu/release/bundle/apollia-desktop-linux-x86_64.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apollia-desktop-linux-x86_64
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/SHA256SUMS
            target/x86_64-unknown-linux-gnu/release/bundle/SHA256SUMS.asc
            target/x86_64-unknown-linux-gnu/release/bundle/apollia-desktop-linux-x86_64.cdx.json
            target/x86_64-unknown-linux-gnu/release/bundle/apollia-desktop-linux-x86_64.spdx.json
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Desktop bundle Tauri - Windows x86_64 (.msi + .exe NSIS)
  # ────────────────────────────────────────────────────────────────────────────
  desktop-windows:
    name: Desktop Windows (x86_64)
    needs: setup
    if: needs.setup.outputs.run_desktop == 'true'
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: desktop-windows-x86_64

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend deps
        working-directory: crates/apollia-desktop/ui
        run: npm ci

      - name: Build Python bundle (x86_64-pc-windows-msvc)
        shell: bash
        run: |
          ./packaging/build-python-bundle.sh x86_64-pc-windows-msvc \
            target/python-bundle/x86_64-pc-windows-msvc

      - name: Build Tauri app
        working-directory: crates/apollia-desktop
        shell: bash
        env:
          PYO3_PYTHON: ${{ github.workspace }}/target/python-bundle/x86_64-pc-windows-msvc/python/python.exe
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
          APOLLIA_DESKTOP_RUNNERS: "cpu"
        run: cargo tauri build --target x86_64-pc-windows-msvc

      # ── Code-signing avec signtool (gated by secrets) ──────────────────────
      # Le cert PFX est passé en base64, signé via signtool de Windows SDK
      # (présent par défaut sur runner windows-latest).
      - name: Sign MSI + NSIS installers (if cert present)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "code.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match 'x64\\signtool.exe$' } |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $bundleDir = "target/x86_64-pc-windows-msvc/release/bundle"
          $targets = @()
          if (Test-Path "$bundleDir/msi") { $targets += Get-ChildItem "$bundleDir/msi/*.msi" }
          if (Test-Path "$bundleDir/nsis") { $targets += Get-ChildItem "$bundleDir/nsis/*.exe" }
          foreach ($t in $targets) {
              & $signtool sign /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 `
                  /f $pfx /p $env:WINDOWS_CERT_PASSWORD $t.FullName
              & $signtool verify /pa $t.FullName
          }

      - name: SHA256SUMS
        working-directory: target/x86_64-pc-windows-msvc/release/bundle
        shell: pwsh
        run: |
          $files = @()
          if (Test-Path msi) { $files += Get-ChildItem msi/*.msi }
          if (Test-Path nsis) { $files += Get-ChildItem nsis/*.exe }
          $lines = $files | ForEach-Object {
              $h = (Get-FileHash $_ -Algorithm SHA256).Hash
              "$h  $($_.Name)"
          }
          $lines | Out-File SHA256SUMS -Encoding ASCII
          Get-Content SHA256SUMS

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/x86_64-pc-windows-msvc/release/bundle
          format: cyclonedx-json
          output-file: target/x86_64-pc-windows-msvc/release/bundle/apollia-desktop-windows-x86_64.cdx.json
          upload-artifact: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/x86_64-pc-windows-msvc/release/bundle
          format: spdx-json
          output-file: target/x86_64-pc-windows-msvc/release/bundle/apollia-desktop-windows-x86_64.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apollia-desktop-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/SHA256SUMS
            target/x86_64-pc-windows-msvc/release/bundle/apollia-desktop-windows-x86_64.cdx.json
            target/x86_64-pc-windows-msvc/release/bundle/apollia-desktop-windows-x86_64.spdx.json
          if-no-files-found: error
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Aggregation → GitHub Release draft (tag push uniquement)
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release (draft)
    needs: [cli, desktop-macos, desktop-linux, desktop-windows]
    # `always()` so a tag still produces a reviewable draft when one platform
    # fails. The alternative, which is what the workflow did before, is that a
    # single failing desktop job discards every artifact the others produced and
    # the tag yields nothing at all. The draft is never auto-published: the
    # "Report coverage" step below states which platforms are present, and the
    # reviewer decides whether the set is publishable. An empty artifact set
    # still fails, so this cannot publish a hollow release.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release draft
      id-token: write # cosign keyless OIDC + provenance
      attestations: write # build-provenance attestation
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      # Refuse an empty draft, and say plainly which platforms made it. A release
      # missing an installer is a decision for the reviewer, not something to
      # discover after publishing.
      - name: Report coverage and refuse an empty draft
        run: |
          shopt -s nullglob
          mapfile -t all < <(find artifacts -type f ! -name '*.sig' ! -name '*.pem' \
                                            ! -name '*.cdx.json' ! -name '*.spdx.json' | sort)
          if [ "${#all[@]}" -eq 0 ]; then
            echo "::error::no artifact was produced; refusing to publish an empty draft"
            exit 1
          fi
          missing=0
          for probe in "dmg:macOS installer" "deb:Linux .deb" "AppImage:Linux AppImage" \
                       "msi:Windows installer"; do
            pat="${probe%%:*}"; label="${probe#*:}"
            if find artifacts -type f -iname "*.${pat}" -o -type f -iname "*${pat}*" \
               | grep -q .; then
              echo "present: ${label}"
            else
              echo "::warning::missing ${label}; the draft will not carry it"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::warning::this draft does not cover every supported platform, \
                  review before publishing"
          fi

      # ── Cryptographic signing (cosign keyless, Sigstore OIDC) ───────────────
      # Every published file gets a detached .sig + the signing .pem certificate.
      # Verify with: cosign verify-blob --certificate <f>.pem --signature <f>.sig
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #   --certificate-identity-regexp '^https://github.com/Apollia-OS/' <f>
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifacts (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          shopt -s nullglob
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sig | *.pem) continue ;;
            esac
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done

      # ── SLSA build provenance attestation over the binaries + SBOMs ─────────
      # Verify with: gh attestation verify <file> --repo Apollia-OS/apollia-os
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.msi
            artifacts/*.exe
            artifacts/*.cdx.json
            artifacts/*.spdx.json

      - name: Create release draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.msi
            artifacts/*.exe
            artifacts/SHA256SUMS
            artifacts/*.cdx.json
            artifacts/*.spdx.json
            artifacts/*.sig
            artifacts/*.pem
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false
