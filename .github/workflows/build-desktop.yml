name: Build Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── macOS ARM64 DMG ─────────────────────────────────────────────────────────
  # NOTE: Intel (x86_64) support planned for future release
  build-macos:
    name: Build macOS (ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend dependencies
        working-directory: crates/apollia-desktop/ui
        run: npm ci

      - name: Pre-build Python bundle (ARM64)
        run: |
          ./packaging/build-python-bundle.sh aarch64-apple-darwin \
            target/python-bundle/aarch64-apple-darwin
        # The bundle is cached across runs by `Swatinem/rust-cache` through the
        # target/python-bundle/ path.

      - name: Build Tauri app (ARM64)
        working-directory: crates/apollia-desktop
        env:
          # bundle-cli.sh re-fetches the bundle into resources/python via build-python-bundle.sh
          # and exports PYO3_PYTHON accordingly. The explicit variable below is
          # a safety net — if something bypasses bundle-cli.sh, PyO3 still links
          # against the bundled interpreter.
          PYO3_PYTHON: ${{ github.workspace }}/target/python-bundle/aarch64-apple-darwin/python/bin/python3.13
          # python-build-standalone has hardcoded /install/lib LIBDIR — override for PyO3 link
          RUSTFLAGS: -L ${{ github.workspace }}/target/python-bundle/aarch64-apple-darwin/python/lib
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Post-bundle — patch install_names + ad-hoc sign (ADR-073)
        working-directory: crates/apollia-desktop
        env:
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        run: |
          bash scripts/after-bundle.sh
          APP="../../target/aarch64-apple-darwin/release/bundle/macos/Apollia OS.app"
          codesign --force --deep --sign - \
            --options runtime \
            --entitlements entitlements.plist \
            "$APP"
          echo "==> signature verification"
          codesign --verify --verbose=2 "$APP" || true

      - name: Generate SHA256SUMS
        working-directory: target/aarch64-apple-darwin/release/bundle/dmg
        run: shasum -a 256 *.dmg > SHA256SUMS

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: apollia-desktop-macos-arm64-dmg
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: apollia-desktop-macos-arm64-sha256
          path: target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS
          if-no-files-found: error

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: apollia-desktop-macos-arm64-app
          path: target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

  # ── Linux AppImage + .deb ────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend dependencies
        working-directory: crates/apollia-desktop/ui
        run: npm ci

      - name: Pre-build Python bundle (linux-x86_64)
        run: |
          ./packaging/build-python-bundle.sh x86_64-unknown-linux-gnu \
            target/python-bundle/x86_64-unknown-linux-gnu

      - name: Build Tauri app
        working-directory: crates/apollia-desktop
        env:
          PYO3_PYTHON: ${{ github.workspace }}/target/python-bundle/x86_64-unknown-linux-gnu/python/bin/python3.13
        run: cargo tauri build

      - name: Post-bundle — patchelf RPATH
        working-directory: crates/apollia-desktop
        env:
          TAURI_TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: bash scripts/after-bundle.sh

      - name: Generate SHA256SUMS
        working-directory: target/release/bundle
        run: |
          (cd appimage && shasum -a 256 *.AppImage > SHA256SUMS || true)
          (cd deb      && shasum -a 256 *.deb      > SHA256SUMS || true)

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: apollia-desktop-linux-x86_64-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: apollia-desktop-linux-x86_64-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: apollia-desktop-linux-x86_64-sha256
          path: |
            target/release/bundle/appimage/SHA256SUMS
            target/release/bundle/deb/SHA256SUMS
          if-no-files-found: warn

  # ── GitHub Release publish (tag push only) ───────────────────────────────────
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "SHA256SUMS" \) \
            -exec cp {} release/ \;
          # Merge per-bundle SHA256SUMS into a single file at the root.
          cat artifacts/*/SHA256SUMS 2>/dev/null | sort -u > release/SHA256SUMS
          ls -la release/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: true        # manual review + "Publish" from the GitHub UI
          fail_on_unmatched_files: true
