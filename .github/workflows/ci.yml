# CI - validation continue.
#
# Tourne sur chaque push vers main et chaque PR. Goal : garder main vert,
# attraper les régressions en < 15 min de feedback.
#
# Ce qui n'est PAS ici :
#   - Build/release artifacts → release.yml (sur tag v*)
#   - E2E desktop, compile-cuda sanity, coverage profonde → nightly.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Line-coverage floor for the coverage gate, ratcheted up over time and never
  # lowered. Measured baseline is 70.58% line coverage over the workspace with
  # apollia-desktop and apollia-e2e-tests excluded (neither builds under the
  # coverage harness: the Tauri crate needs bundled frontend resources, the e2e
  # crate does not compile standalone) and with tests/ + benches/ ignored. The
  # floor sits just below the baseline so the gate is green today, then ratchets
  # up. Restoring the two excluded crates is a tracked backlog item.
  COVERAGE_FLOOR: "70"

# Annule les runs en cours sur un même ref si un push plus récent arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. Only the docs deploy job escalates (pages,
# id-token) to publish; every other job runs read-only.
permissions:
  contents: read

jobs:
  # ── Rust : fmt → clippy → test (chaîne - chacun bloque le suivant) ─────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Pinned to the build toolchain (rust-toolchain.toml) so CI fmt output
      # matches local dev exactly and never drifts against rolling stable.
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Pinned to the build toolchain so the -D warnings gate is reproducible
      # and matches the pre-commit pre-push hook byte for byte.
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # --all-targets adds tests/examples/benches to the lint surface, matching
      # the pre-commit pre-push hook. --all-features is intentionally omitted:
      # it pulls the GPU backends (cuda/rocm/vulkan) whose toolkits are absent
      # on this runner; feature-gated clippy stays in nightly.yml.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Advisory only: runs the same clippy gate on rolling stable to surface lints
  # coming in a future toolchain before we bump the pinned build toolchain.
  # Non-blocking, so upstream lint churn never blocks a PR.
  clippy-stable:
    name: Clippy (stable, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust Tests
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo test (workspace)
        run: cargo test --workspace --no-fail-fast
      - name: cargo test (python-tests)
        run: cargo test -p apollia-e2e-tests --features python-tests

  # ── CLI end-to-end (Track 1, offline, seeded fixture) ────────────────────
  cli-e2e:
    name: CLI E2E (offline)
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            cmake clang pkg-config sqlite3
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build apollia-cli
        run: cargo build -p apollia-cli
      - name: Seed builder self-test
        run: bash tests/cli/seed/self-test.sh
      - name: Run CLI E2E (Track 1, offline, seeded)
        run: bash tests/cli/cli-e2e.sh
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cli-e2e-report
          path: tests/cli/report/

  # ── Frontend ─────────────────────────────────────────────────────────────
  vitest:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/apollia-desktop/ui/package-lock.json
      - name: Install dependencies
        working-directory: crates/apollia-desktop/ui
        run: npm ci
      - name: Run Vitest
        working-directory: crates/apollia-desktop/ui
        run: npm test

  # ── Security / dependencies ──────────────────────────────────────────────
  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Explicit full check (advisories, bans, licenses, sources) on the PR
      # gate, not just a subset. The redundant heavy pass stays in nightly.yml.
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check advisories bans licenses sources

  # ── macOS Silicon : core test run backing the "Tested" platform claim ──────
  test-macos:
    name: Rust Tests (macOS Silicon)
    needs: clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Default members exclude the heavy Tauri desktop crate; full desktop
      # E2E stays in nightly.yml.
      - run: cargo test

  # ── Prose guard : locks in the sanitize invariants (no regressions) ────────
  prose-guard:
    name: Prose Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: No em-dash in prose
        run: |
          if grep -rnP "—" \
               --include="*.md" --include="*.rs" --include="*.py" --include="*.svelte" \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist --exclude-dir=.vitepress . \
             | grep -vE 'docs/agents/(FORBIDDEN|DOCS-WRITING)\.md|(^|/)AGENTS\.md:'; then
            echo "::error::em-dash (U+2014) found in prose; use a hyphen, comma, or colon"
            exit 1
          fi
      - name: No PII path, dead domain, or stale GitHub slug
        run: |
          rc=0
          # Bracket classes keep these patterns from matching their own literal text in this file.
          grep -rnE '/Users/nida[l]' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist --exclude-dir=.vitepress . && rc=1 || true
          grep -rnE 'apollia[.]dev' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist --exclude-dir=.vitepress . && rc=1 || true
          grep -rnE 'github[.]com/(nidal-z|nidalzoumit[a])/' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist --exclude-dir=.vitepress . && rc=1 || true
          [ "$rc" = 0 ] || { echo "::error::PII / dead domain / stale slug found"; exit 1; }
      # Runs before the checks it covers. Two of them independently counted a
      # symbol named in a doc-comment as a live call site, always in the
      # direction that declares a dead capability alive. This pins that case on a
      # fixture so the next check written here cannot reintroduce it quietly.
      - name: The checks themselves, on a fixture
        run: python3 scripts/check_selftest.py
      # A rule in a document is not a gate. This one exists because the trap it
      # catches was invisible: five crates lost `unwrap_used = "deny"` by
      # declaring a local [lints] table, and clippy kept passing.
      - name: Every crate actually gets the workspace lints
        run: python3 scripts/check_crate_lints.py
      # Placement, not just existence. The replay asks whether some file carries
      # an id; this asks whether the marker still sits on the paragraph it
      # guards, and reports which of its rules had no coverage.
      - name: Claim markers are placed and matched
        run: python3 scripts/check_claim_anchors.py
      # Three times the repo shipped a `with_*` builder installing a capability
      # production never asks for, each time with documentation describing it as
      # active. The shape compiles, its own tests pass, and only the call path
      # tells the truth. New instances now fail here instead of in a doc audit.
      - name: Optional-capability builders have a production caller
        run: python3 scripts/check_optional_builders.py --strict
      # The desktop owns no console on Windows, so every console-subsystem child
      # it starts is given a visible window. A first sweep hid ten spawn sites
      # and left four crates listed as remaining; nobody took them, and a later
      # change added three more in files that did not exist yet. The count went
      # up while the rule sat in a document. It is a check now.
      - name: Spawned children ask for no console window
        run: python3 scripts/check_subprocess_window.py
      # A pasted Google Fonts snippet makes a cold start phone a third party
      # before the user clicks anything, which is the one promise the product
      # is sold on. The desktop webview has a CSP that blocks it; the docs site
      # has nothing, so the gate lives here.
      - name: No web font is fetched from a third party
        run: python3 scripts/check_no_font_cdn.py
      # Tauri camel-cases the name of every command argument before looking it
      # up, and never falls back to snake_case. A key it does not find makes it
      # reject the whole call, so a single wrong spelling ships a surface that
      # fails at every execution and says nothing. Two of them lived in the
      # tree at once, one of them frozen green by a unit test. Nothing read
      # the two sides of that contract together until this.
      - name: Every invoke call carries the argument keys Tauri reads
        run: |
          python3 scripts/check_tauri_ipc_args.py --selftest
          python3 scripts/check_tauri_ipc_args.py

  # ── Python SDK : strict type check (lint/format cleanup tracked separately) ─
  python-types:
    name: Python Type Check (SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install mypy
      - name: mypy (strict, apollia package)
        working-directory: sdk
        run: mypy apollia

  # ── Python SDK unit tests + coverage ───────────────────────────────────────
  # Blocking. It was advisory while three tests failed: two asserted strict
  # payload rejection against a dispatcher that dropped unexpected fields with a
  # warning, and one mock had not followed `ctx.mail` onto the Ctx protocol. Both
  # are fixed, so the job blocks; an advisory job that hides a real failure is
  # worse than no job.
  python-tests:
    name: Python Tests (SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK with dev extras
        working-directory: sdk
        run: pip install -e ".[dev]"
      - name: pytest with coverage
        working-directory: sdk
        run: pytest --cov=apollia --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v5
        with:
          name: sdk-coverage-xml
          path: sdk/coverage.xml

  # ── Generated docs : the committed CLI and SDK references must match the code ─
  # These pages are produced by docs/site/regen.sh from the clap tree and from an
  # ast walk of the SDK. They are committed (a plain node build has neither cargo
  # nor python), so nothing stops them drifting except this job.
  docs-generated:
    name: Generated Docs Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libssl-dev cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Regenerate the SDK reference
        run: python3 docs/site/scripts/gen_sdk_ref.py
      - name: Regenerate the configuration reference
        run: python3 docs/site/scripts/gen_config_ref.py
      - name: Regenerate the evaluation suite schema
        run: python3 docs/site/scripts/gen_eval_ref.py
      - name: Regenerate the CLI reference
        run: |
          {
            echo "---"
            echo "sidebar_position: 1"
            echo "title: CLI reference"
            echo "---"
            echo "<!-- GENERATED FILE. Do not edit; regenerate with docs/site/regen.sh. -->"
            cargo run --quiet -p apollia-cli --features gen-docs -- gen-cli-docs \
              | tail -n +2 \
              | perl -C -pe 's/\x{2014}/-/g'
          } > docs/site/docs/reference/cli/index.md
      - name: Fail if the committed pages drifted
        run: |
          if ! git diff --exit-code -- docs/site/docs/reference/cli docs/site/docs/reference/sdk docs/site/docs/reference/configuration.md; then
            echo "::error::generated docs are stale; run 'bash docs/site/regen.sh' and commit the result"
            exit 1
          fi

  # ── Capability claims : replays every documented capability against the code ─
  # The corpus has described capabilities whose symbol existed while nothing
  # called it. Prose review does not catch that; this does.
  claims:
    name: Capability Claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python3 scripts/check_claims.py

  # ── Link check : catches broken local doc links (offline, no external flake) ─
  # Scope: the four root files only. Links under docs/site are routes the
  # Docusaurus build resolves at render time, so their judge is the docs-build
  # job below (onBrokenLinks: throw), not a file-level checker.
  links:
    name: Doc Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: "--offline --no-progress README.md CONTRIBUTING.md SECURITY.md GOVERNANCE.md"
          fail: true

  # ── Docs build : Docusaurus build on every PR (onBrokenLinks: throw) ───────
  # Judge of the internal links of docs/site, routes and markdown links alike.
  # Build-only: the hosting provider builds and publishes the site itself.
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Install dependencies
        working-directory: docs/site
        run: npm ci
      - name: Build site (onBrokenLinks throw)
        working-directory: docs/site
        run: npm run build

  # ── Unused dependencies : keeps the Cargo graph honest ─────────────────────
  machete:
    name: Unused Deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-machete
      # Known false positives are allow-listed per crate via
      # [package.metadata.cargo-machete] ignored, each with a lift note.
      - run: cargo machete

  # ── Fuzz smoke : build the cargo-fuzz targets and hammer the seed corpus ────
  # The untrusted-input parsers (LLM output, web content, automation text, tool
  # specs) are fuzzed with libFuzzer. Advisory for now (continue-on-error) so a
  # freshly surfaced crash reports without blocking the PR; the deep run lives
  # in nightly.yml. This cargo-fuzz integration is what the OpenSSF Scorecard
  # Fuzzing check detects.
  fuzz:
    name: Fuzz (smoke, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # cargo-fuzz builds targets with -Zsanitizer=address, which needs nightly.
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --no-self-update
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "fuzz -> target"
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-fuzz
      - name: Fuzz each target briefly over its seed corpus
        run: |
          set -euo pipefail
          # --target is load-bearing: install-action ships cargo-fuzz as a
          # statically linked musl binary, and cargo-fuzz defaults its build
          # target to its own compile-time triple. Without the flag the build
          # targets x86_64-unknown-linux-musl and dies on `libc` ("sanitizer
          # is incompatible with statically linked libc", "can't find crate
          # for `core`") before any objective runs.
          for t in parse_automation confidence_parser gbnf web_read_extract truncation; do
            echo "::group::fuzz $t"
            # fuzz/corpus/ is gitignored (fuzz/.gitignore), so a fresh checkout
            # has no corpus directory, and libFuzzer refuses to start when a
            # corpus argument names a directory that does not exist.
            mkdir -p fuzz/corpus/"$t"
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
              "$t" fuzz/corpus/"$t" fuzz/seeds/"$t" \
              -- -max_total_time=60 -rss_limit_mb=4096
            echo "::endgroup::"
          done

  # ── SemVer : guards the Rust public contract against silent API breaks ─────
  # Advisory only for now: apollia-core / apollia-runtime are unpublished and
  # pre-1.0, so this reports breaking changes against main rather than blocking.
  # Blocking posture is revisited post-1.0 (see the release readiness notes).
  # apollia-aip is intentionally excluded: its public contract is the Python
  # surface (guarded by the SDK version + generated clients), not a Rust API.
  semver-checks:
    name: SemVer (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libssl-dev libasound2-dev libpulse-dev cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-semver-checks
      - name: cargo semver-checks (baseline = main)
        run: |
          cargo semver-checks --baseline-rev origin/main \
            -p apollia-core -p apollia-runtime

  # ── Python SDK : lint + format + supply chain (mypy lives in python-types) ──
  python-quality:
    name: Python Quality (SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Pinned, and kept in lockstep with the ruff-pre-commit rev in
      # .pre-commit-config.yaml. Unpinned, a new ruff release changes the rule
      # set under the job and turns a green tree red without a commit.
      - run: pip install ruff==0.15.15 pip-audit
      - name: ruff format --check
        working-directory: sdk
        run: ruff format --check .
      - name: ruff check
        working-directory: sdk
        run: ruff check .
      # Installs the SDK so its resolved deps are the audit surface. The SDK is
      # stdlib-only by design, so this surface is intentionally tiny.
      - name: pip-audit (SDK supply chain)
        run: |
          pip install ./sdk
          pip-audit

  # ── Coverage : line-coverage floor, ratcheted up over time (never lowered) ──
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@eac0f66a48bc4b70a10b9acd4c4e930f835d95ff # 1.95.0
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            cmake clang pkg-config
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-llvm-cov
      # The floor is set just below the measured baseline so the gate is green
      # from day one, then ratcheted up. Full HTML report stays in nightly.yml.
      # apollia-desktop and apollia-e2e-tests are excluded because neither builds
      # under the coverage harness; tests/ and benches/ are ignored so the number
      # reflects source coverage, not test code exercising itself.
      - name: cargo llvm-cov (workspace, floor gate)
        run: |
          cargo llvm-cov --workspace \
            --exclude apollia-e2e-tests --exclude apollia-desktop \
            --ignore-filename-regex '(/tests/|/benches/)' \
            --lcov --output-path lcov.info \
            --fail-under-lines ${{ env.COVERAGE_FLOOR }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-lcov
          path: lcov.info
