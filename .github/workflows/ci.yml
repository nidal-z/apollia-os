name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: clippy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (workspace)
        run: cargo test --workspace
      - name: cargo test (python-tests)
        run: cargo test -p apollia-e2e-tests --features python-tests

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate HTML coverage report
        run: cargo llvm-cov --workspace --html
      - name: Generate LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ github.sha }}
          path: target/llvm-cov/html/
          retention-days: 30

  vitest:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: crates/apollia-desktop/ui
        run: npm ci
      - name: Run Vitest
        working-directory: crates/apollia-desktop/ui
        run: npm test

  diagrams:
    name: Diagrams (PlantUML)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Java & PlantUML JAR
        run: |
          sudo apt-get install -y default-jre-headless graphviz
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/plantuml.jar \
            https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar
          printf '#!/bin/sh\nexec java -jar ~/.local/bin/plantuml.jar "$@"\n' \
            > ~/.local/bin/plantuml
          chmod +x ~/.local/bin/plantuml
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: taiki-e/install-action@just
      - name: Generate SVG diagrams
        run: just diagrams

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  compile-cuda:
    name: "Compile check — CUDA feature flags"
    runs-on: ubuntu-latest
    # Ce job vérifie la compilation CUDA sans exécution (pas de GPU sur le runner).
    # Autorisé à échouer si le SDK CUDA n'est pas disponible sur l'image ubuntu-latest.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Installer les headers CUDA minimaux requis pour la compilation
      - name: Install CUDA toolkit (headers only)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y nvidia-cuda-toolkit

      # cargo check : vérifie la compilation sans générer de binaire
      # Feature flags testés (workspace virtuel → on cible les crates concernées) :
      #   - local-cuda  : llama.cpp avec support GPU NVIDIA (apollia-llm)
      #   - stt-cuda    : whisper-rs avec support GPU NVIDIA (apollia-stt)
      - name: Check CUDA compilation — apollia-llm (local-cuda)
        run: cargo check -p apollia-llm --features local-cuda

      - name: Check CUDA compilation — apollia-stt (stt-cuda)
        run: cargo check -p apollia-stt --features stt-cuda

  book:
    name: mdBook Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@mdbook
      - name: Build book
        run: mdbook build book
      # deploy-pages désactivé — repo privé (réactiver lors du passage en public)
