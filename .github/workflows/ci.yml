# CI - validation continue.
#
# Tourne sur chaque push vers main et chaque PR. Goal : garder main vert,
# attraper les régressions en < 15 min de feedback.
#
# Ce qui n'est PAS ici :
#   - Build/release artifacts → release.yml (sur tag v*)
#   - E2E desktop, compile-cuda sanity, coverage profonde → nightly.yml
#
# Cf. docs/internal/release/BUILD.md pour l'architecture CI complète.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Annule les runs en cours sur un même ref si un push plus récent arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust : fmt → clippy → test (chaîne - chacun bloque le suivant) ─────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            cmake clang pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Rust Tests
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            cmake clang pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (workspace)
        run: cargo test --workspace
      - name: cargo test (python-tests)
        run: cargo test -p apollia-e2e-tests --features python-tests

  # ── Frontend ─────────────────────────────────────────────────────────────
  vitest:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/apollia-desktop/ui/package-lock.json
      - name: Install dependencies
        working-directory: crates/apollia-desktop/ui
        run: npm ci
      - name: Run Vitest
        working-directory: crates/apollia-desktop/ui
        run: npm test

  # ── Docs : mdBook + sitemap + charte ─────────────────────────────────────
  mdbook:
    name: Book Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@mdbook
      - run: mdbook build docs/book
      - name: Generate sitemap + robots
        run: bash docs/book/scripts/gen-sitemap.sh book.apollia.fr docs/target/book

  doc-charte:
    name: Doc Charte L1.4
    runs-on: ubuntu-latest
    # Seulement quand un fichier doc/lint a bougé - évite de re-runner sur
    # chaque changement code.
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.modified, 'docs/book/src/') ||
      contains(github.event.head_commit.modified, 'docs/wiki/') ||
      contains(github.event.head_commit.modified, 'docs/help/') ||
      contains(github.event.head_commit.modified, 'scripts/lints/')
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/lints/charte-doc.sh

  diagrams:
    name: PlantUML Diagrams
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Java + PlantUML
        run: |
          sudo apt-get install -y default-jre-headless graphviz
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/plantuml.jar \
            https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar
          printf '#!/bin/sh\nexec java -jar ~/.local/bin/plantuml.jar "$@"\n' \
            > ~/.local/bin/plantuml
          chmod +x ~/.local/bin/plantuml
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: taiki-e/install-action@just
      - run: just diagrams

  # ── Security / dependencies ──────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ── macOS Silicon : core test run backing the "Tested" platform claim ──────
  test-macos:
    name: Rust Tests (macOS Silicon)
    needs: clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set PYO3_PYTHON
        run: echo "PYO3_PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
      # Default members exclude the heavy Tauri desktop crate; full desktop
      # E2E stays in nightly.yml.
      - run: cargo test

  # ── Prose guard : locks in the sanitize invariants (no regressions) ────────
  prose-guard:
    name: Prose Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No em-dash in prose
        run: |
          if grep -rnP "—" \
               --include="*.md" --include="*.rs" --include="*.py" --include="*.svelte" \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist --exclude-dir=.vitepress . \
             | grep -vE 'docs/agents/(FORBIDDEN|DOCS-WRITING)\.md|(^|/)AGENTS\.md:'; then
            echo "::error::em-dash (U+2014) found in prose; use a hyphen, comma, or colon"
            exit 1
          fi
      - name: No PII path, dead domain, or stale GitHub slug
        run: |
          rc=0
          # Bracket classes keep these patterns from matching their own literal text in this file.
          grep -rnE '/Users/nida[l]' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist --exclude-dir=.vitepress . && rc=1 || true
          grep -rnE 'apollia[.]dev' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist --exclude-dir=.vitepress . && rc=1 || true
          grep -rnE 'github[.]com/(nidal-z|nidalzoumit[a])/' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist --exclude-dir=.vitepress . && rc=1 || true
          [ "$rc" = 0 ] || { echo "::error::PII / dead domain / stale slug found"; exit 1; }

  # ── Python SDK : strict type check (lint/format cleanup tracked separately) ─
  python-types:
    name: Python Type Check (SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy
      - name: mypy (strict, apollia package)
        working-directory: sdk
        run: mypy apollia

  # ── Link check : catches broken local doc links (offline, no external flake) ─
  links:
    name: Doc Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress README.md CONTRIBUTING.md SECURITY.md GOVERNANCE.md 'docs/wiki/**/*.md' 'docs/book/src/**/*.md' 'docs/help/**/*.md'"
          fail: true
