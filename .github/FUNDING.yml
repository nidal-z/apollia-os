# Funding rails for Apollia OS. Renders the "Sponsor" button on the repo.
# Ref: https://docs.github.com/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository
# Confirmed rails: GitHub Sponsors (Apollia-OS org), Patreon, Ko-fi, plus the
# apollia.fr support page. The GitHub Sponsors button renders once the org's
# Sponsors profile is approved and live.
github: [Apollia-OS]
patreon: apollia
ko_fi: apollia
custom: ["https://apollia.fr/soutenir"]
