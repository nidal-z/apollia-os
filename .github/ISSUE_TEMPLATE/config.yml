blank_issues_enabled: false
contact_links:
  - name: Usage question or general discussion
    url: https://github.com/Apollia-OS/apollia-os/discussions/categories/q-a
    about: |
      For questions about how to use Apollia OS, configuration, or general
      troubleshooting, please use Discussions Q&A rather than an issue.
  - name: Security vulnerability
    url: https://github.com/Apollia-OS/apollia-os/security/advisories/new
    about: |
      Please report security vulnerabilities privately through GitHub Security
      Advisories rather than as a public issue.
  - name: Documentation
    url: https://docs.apollia.fr
    about: |
      Installation, configuration, the SDK contract and the command-line
      reference. Most usage questions are answered there.
