# Dependency updates, grouped.
#
# The lever that matters here is not the schedule, it is the grouping. Ungrouped,
# the ecosystems below open dozens of pull requests in one Monday morning, which
# is more than anyone reads carefully. Grouped, each directory opens one pull
# request per week for its minor and patch bumps; a major version still arrives
# on its own, because that is the one that needs reading.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust

  - package-ecosystem: pip
    directory: "/sdk"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      pip-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - python

  - package-ecosystem: npm
    directory: "/crates/apollia-desktop/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend

  - package-ecosystem: npm
    directory: "/docs/site"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      docs-site-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/clients/ts"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      ts-client-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
