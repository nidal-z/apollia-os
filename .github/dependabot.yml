# Dependency updates for a single maintainer.
#
# The lever that matters here is not the schedule, it is the grouping. Ungrouped,
# the four ecosystems below can open thirty pull requests in one Monday morning
# (10 + 5 + 10 and the default 5 on github-actions), which is a week of review
# for one person. Grouped, each ecosystem opens one pull request per week for its
# minor and patch bumps; a major version still arrives on its own, because that
# is the one that needs reading.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust

  - package-ecosystem: pip
    directory: "/sdk"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      pip-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - python

  - package-ecosystem: npm
    directory: "/crates/apollia-desktop/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
