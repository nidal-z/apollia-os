[package]
edition = "2021"
rust-version = "1.88"
name = "tesseract-rs"
version = "0.4.0"
authors = ["Cafer Can Gündoğdu <cafercangundogdu@gmail.com>"]
build = "build.rs"
links = "tesseract"
exclude = [
    "tessdata/*",
    "third_party/*",
    "cli/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust bindings for Tesseract OCR with optional built-in compilation"
documentation = "https://docs.rs/tesseract-rs"
readme = "README.md"
keywords = [
    "tesseract",
    "ocr",
    "bindings",
    "computer-vision",
    "text-recognition",
]
categories = [
    "external-ffi-bindings",
    "computer-vision",
    "text-processing",
]
license = "MIT"
repository = "https://github.com/cafercangundogdu/tesseract-rs"

[package.metadata.docs.rs]
features = ["docs-only"]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
build-tesseract = [
    "cc",
    "glob",
    "cmake",
    "reqwest",
    "zip",
]
default = ["build-tesseract"]
embed-tessdata = ["build-tesseract"]
use-system-tesseract = [
    "pkg-config",
    "build-tesseract",
]

[lib]
name = "tesseract_rs"
