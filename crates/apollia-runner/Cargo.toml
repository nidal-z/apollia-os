[package]
name = "apollia-runner"
version = "0.1.0"
edition = "2021"
description = "Apollia OS sidecar runner for local LLM and STT inference"
license = "MIT OR Apache-2.0"

# One binary per build, named after the active backend feature.
# The CI/Tauri launcher compiles this crate once per backend with a different name.
[[bin]]
name = "apollia-runner"
path = "src/main.rs"

[features]
# Exclusif : une seule feature backend doit être active par compilation.
# `cargo check --features local-cpu` etc. comme pour apollia-llm aujourd'hui.
default = []
local-cpu        = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:whisper-rs"]
local-cuda       = ["local-cpu", "llama-cpp-2/cuda",   "whisper-rs/cuda"]
local-metal      = ["local-cpu", "llama-cpp-2/metal",  "whisper-rs/metal"]
local-rocm       = ["local-cpu", "llama-cpp-2/rocm",   "whisper-rs/hipblas"]
local-vulkan     = ["local-cpu", "llama-cpp-2/vulkan"]

[dependencies]
# IPC + serveur HTTP
axum               = { workspace = true }
tokio              = { workspace = true, features = ["full"] }
serde              = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true }
uuid               = { workspace = true, features = ["v4", "serde"] }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
futures            = { workspace = true }
tokio-stream       = { workspace = true }

# Backends (optionnels selon feature)
llama-cpp-2     = { workspace = true, optional = true }
encoding_rs     = { workspace = true, optional = true }
whisper-rs      = { version = "0.16", optional = true }

# Audio (toujours nécessaire pour /stt/*)
hound = { workspace = true }
rubato = "4.0"

[dev-dependencies]
tempfile = "3"
reqwest  = { workspace = true, features = ["json", "stream", "blocking"] }

[lints.rust]
# FFI / proc-macro generated unsafe (pyo3, tauri, llama/whisper bindings).
unsafe_code = "allow"
