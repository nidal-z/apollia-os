[package]
name    = "apollia-workspace"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Apollia OS - workspace context collector (git, APOLLIA.md, directory tree)"

[dependencies]
apollia-core = { workspace = true }
apollia-llm  = { workspace = true, features = ["cloud"] }
tokio        = { workspace = true }
serde        = { workspace = true }
tracing      = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
serde_json   = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
