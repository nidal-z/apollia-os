[package]
name = "apollia-stt"
version = "0.1.0"
edition = "2021"
description = "Apollia OS — Speech-to-Text engine (trait SttBackend + types + backends)"
license = "MIT OR Apache-2.0"

[features]
## CPU : backend whisper.cpp par défaut (aucune accélération GPU).
default = ["cpu"]
cpu = []
## Accélération Metal (Apple Silicon GPU).
metal = ["whisper-rs/metal"]
## Accélération CUDA (NVIDIA GPU).
cuda  = ["whisper-rs/cuda"]
## Accélération AMD ROCm via hipBLAS (Linux principal — Windows limité aux
## Radeon Pro/MI).
rocm  = ["whisper-rs/hipblas"]
## OpenMP CPU multi-thread (tous OS) — toggle séparé pour ne pas l'imposer
## via `default` (build sans openmp est faisable pour VM/containers).
openmp = ["whisper-rs/openmp"]

[dependencies]
apollia-core = { workspace = true }
rusqlite     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
whisper-rs   = { version = "0.16" }
cpal         = "0.15"
rubato       = "0.15"
tracing      = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
uuid = { workspace = true }
