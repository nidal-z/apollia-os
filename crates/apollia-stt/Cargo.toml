[package]
name = "apollia-stt"
version = "0.1.0"
edition = "2021"
description = "Apollia OS — Speech-to-Text engine (trait SttBackend + types + backends)"
license = "MIT"

[features]
## CPU : backend whisper.cpp par défaut (aucune accélération GPU).
default = ["cpu"]
cpu = []
## Accélération Metal (Apple Silicon GPU).
metal = ["whisper-rs/metal"]
## Accélération CUDA (NVIDIA GPU).
cuda  = ["whisper-rs/cuda"]

[dependencies]
apollia-core = { workspace = true }
rusqlite     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
whisper-rs   = { version = "0.16" }
cpal         = "0.15"
rubato       = "0.15"
tracing      = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
uuid = { workspace = true }
