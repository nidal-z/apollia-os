[package]
name = "apollia-stt"
version = "0.1.0"
edition = "2021"
description = "Apollia OS — Speech-to-Text traits, types et repository (moteur whisper hébergé dans apollia-runner depuis ADR-113)"
license = "MIT OR Apache-2.0"

# ADR-113 : whisper.cpp ne vit plus dans cette crate, il est hébergé par le
# sidecar `apollia-runner`. Le daemon utilise `RunnerSttBackend`
# (apollia-runtime) qui implémente `SttBackend` via HTTP IPC.

[dependencies]
apollia-core = { workspace = true }
rusqlite     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
cpal         = "0.15"
rubato       = "0.15"
tracing      = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
uuid = { workspace = true }
