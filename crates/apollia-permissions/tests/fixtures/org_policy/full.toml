# Every section and every key of the version 1 organisation policy schema.
schema_version = 1
signed_at = 2026-10-02T09:30:00+02:00

[connections]
allow = ["native:google", "selection:@notionhq/notion-mcp-server", "package:npm:server-memory"]
deny = ["native:folder"]
remote = "deny"

[families]
deny = ["execute_code", "send_external"]

[inference]
allowed_servers = ["llama-server", "https://llm.example.internal"]
remote_endpoints = "deny"
require_model_hash = true

[settings]
"desktop.developer_mode" = false

[packages]
require_signature = true
trusted_publishers = ["d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a"]

[journal]
required = true
retention_days = 365

[journal.export]
detail = "forbid"
daily_summary_dir = "/var/lib/apollia/journal-exports"
