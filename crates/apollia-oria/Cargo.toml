[package]
name = "apollia-oria"
version = "0.1.0"
edition = "2021"
description = "Apollia OS - ORIA Engine (Observer-Reasoner-Actor, StepBudget enforcement, ResilienceLayer)"
license = "MIT OR Apache-2.0"

[dependencies]
apollia-core      = { workspace = true }
apollia-tools     = { workspace = true }
apollia-memory    = { workspace = true }
apollia-llm       = { workspace = true, features = ["cloud"] }
apollia-workspace = { path = "../apollia-workspace" }
tokio          = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
uuid           = { workspace = true }
rand           = { workspace = true }
rusqlite       = { workspace = true }
sha2           = { workspace = true }
async-trait    = { workspace = true }
chrono         = { workspace = true }
futures        = { workspace = true }

[dev-dependencies]
tempfile       = "3"

[lints]
workspace = true
