[package]
name = "apollia-aip"
version = "0.1.0-preview"
edition = "2021"
description = "Apollia OS - Agent Interface Protocol bridge (PyO3, Rust <-> Python async via pyo3-async-runtimes)"
license = "MIT OR Apache-2.0"

[dependencies]
apollia-core          = { workspace = true }
apollia-prompts       = { workspace = true }
apollia-tools         = { workspace = true }
apollia-memory        = { workspace = true }
apollia-llm           = { workspace = true, features = ["cloud"] }
apollia-runtime       = { workspace = true }
apollia-workspace     = { path = "../apollia-workspace" }
apollia-notifications = { workspace = true }
apollia-stt           = { workspace = true, default-features = false }
hound                 = { workspace = true }
tokio          = { workspace = true }
chrono         = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
toml           = { workspace = true }
thiserror      = { workspace = true }
semver         = { workspace = true }
tracing        = { workspace = true }
uuid           = { workspace = true }
futures             = { workspace = true }
async-trait         = { workspace = true }
pyo3                = { workspace = true }
pyo3-async-runtimes = { workspace = true }
serde_yaml          = { workspace = true }
minijinja           = { workspace = true }

[dev-dependencies]
tempfile = "3"
apollia-mcp = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(kani)'] }

# Cargo does not merge this table with the workspace one: declaring [lints] at
# all replaces the inheritance wholesale. Restating the workspace clippy lint is
# therefore not redundant, it is the only way to keep it. Dropping these three
# lines silently removes `unwrap()` enforcement from this crate, which is how it
# was lost here in the first place.
[lints.clippy]
unwrap_used = "deny"
