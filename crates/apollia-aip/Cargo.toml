[package]
name = "apollia-aip"
version = "0.1.0"
edition = "2021"
description = "Apollia OS — Agent Interface Protocol bridge (PyO3, Rust <-> Python async via pyo3-async-runtimes)"
license = "MIT OR Apache-2.0"

[dependencies]
apollia-core      = { workspace = true }
apollia-tools     = { workspace = true }
apollia-memory    = { workspace = true }
apollia-llm       = { workspace = true, features = ["cloud"] }
apollia-runtime   = { workspace = true }
apollia-workspace = { path = "../apollia-workspace" }
tokio          = { workspace = true }
chrono         = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
toml           = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
uuid           = { workspace = true }
futures             = { workspace = true }
async-trait         = { workspace = true }
pyo3                = { workspace = true }
pyo3-async-runtimes = { workspace = true }

[dev-dependencies]
tempfile = "3"
