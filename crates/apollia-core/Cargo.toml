[package]
name = "apollia-core"
version = "0.1.0-preview"
edition.workspace = true
rust-version.workspace = true
description = "Apollia OS - shared types (AgentManifest, AIPTask, AIPResult, ProcessState, StepBudgetConfig)"
license.workspace = true

# apollia-core depends on NOTHING else in the workspace.
# All other crates depend on apollia-core.
[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
uuid       = { workspace = true }
tokio      = { workspace = true }
rusqlite   = { workspace = true }
regex      = { workspace = true }
async-trait = { workspace = true }
chrono      = { workspace = true }

# The `net` feature only. `apollia-core` is the dependency foundation of the
# workspace, so the crates that never open a socket keep their current closure:
# both are optional and pulled in by the crates that do.
reqwest = { workspace = true, optional = true }
url     = { workspace = true, optional = true }

[features]
# The shared HTTP surface (`apollia_core::net`): SSRF policy plus capped body
# reads. Enabled by every crate that builds a `reqwest::Client`.
net = ["dep:reqwest", "dep:url"]

[dev-dependencies]
tempfile  = { workspace = true }
toml      = { workspace = true }

[lints]
workspace = true
