[package]
name = "apollia-core"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Apollia OS - shared types (AgentManifest, AIPTask, AIPResult, ProcessState, StepBudgetConfig)"
license.workspace = true

# apollia-core depends on NOTHING else in the workspace.
# All other crates depend on apollia-core.
[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
uuid       = { workspace = true }
tokio      = { workspace = true }
rusqlite   = { workspace = true }
regex      = { workspace = true }
async-trait = { workspace = true }
chrono      = { workspace = true }
# The named settings of `apollia.toml` (`config::settings`) and its one writer
# (`config::writer`): `toml` reads the file, `toml_edit` edits it and keeps the
# user's comments and layout.
# Both were already in the workspace lockfile.
toml        = { workspace = true }
toml_edit   = { workspace = true }
# The fingerprint the configuration writer (`config::writer`) compares before
# it replaces `apollia.toml`. Already in the workspace lockfile.
sha2        = { workspace = true }

# The `net` feature only. `apollia-core` is the dependency foundation of the
# workspace, so the crates that never open a socket keep their current closure:
# both are optional and pulled in by the crates that do.
reqwest = { workspace = true, optional = true }
url     = { workspace = true, optional = true }

[features]
# The shared HTTP surface (`apollia_core::net`): SSRF policy plus capped body
# reads. Enabled by every crate that builds a `reqwest::Client`.
net = ["dep:reqwest", "dep:url"]

[dev-dependencies]
tempfile  = { workspace = true }

[lints]
workspace = true
