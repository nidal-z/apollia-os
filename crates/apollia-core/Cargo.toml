[package]
name = "apollia-core"
version = "0.1.0"
edition = "2021"
description = "Apollia OS - shared types (AgentManifest, AIPTask, AIPResult, ProcessState, StepBudgetConfig)"
license = "MIT OR Apache-2.0"

# apollia-core depends on NOTHING else in the workspace.
# All other crates depend on apollia-core.
[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
uuid       = { workspace = true }
tokio      = { workspace = true }
rusqlite   = { workspace = true }
regex      = { workspace = true }
async-trait = { workspace = true }
chrono      = { workspace = true }

[dev-dependencies]
tempfile  = "3"
toml      = { workspace = true }
