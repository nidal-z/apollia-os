[package]
name = "apollia-runtime"
version = "0.1.0"
edition = "2021"
description = "Apollia OS — Runtime Core (Supervisor, AgentRegistry, TaskRouter, EventBus, APIServer axum)"
license = "MIT"

[dependencies]
apollia-core          = { workspace = true }
apollia-llm           = { workspace = true }
apollia-notifications = { workspace = true }
apollia-pipelines     = { path = "../apollia-pipelines" }
apollia-tools         = { workspace = true }
apollia-triggers      = { path = "../apollia-triggers" }
async-trait           = { workspace = true }
chrono             = { workspace = true }
hmac               = "0.12"
sha2               = "0.10"
hex                = "0.4"
constant_time_eq   = "0.3"
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
axum               = { workspace = true }
tokio-stream       = { workspace = true }
hyper-util         = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
uuid               = { workspace = true }
rusqlite           = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
