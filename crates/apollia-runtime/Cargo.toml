[package]
name = "apollia-runtime"
version = "0.1.0"
edition = "2021"
description = "Apollia OS — Runtime Core (Supervisor, AgentRegistry, TaskRouter, EventBus, APIServer axum)"
license = "MIT"

[features]
## Active le backend cloud (Anthropic, OpenAI-compatible) — activé par défaut.
cloud = ["apollia-llm/cloud"]
## Active le backend embarqué in-process (inférence .gguf via mistralrs) — CPU seul.
local = ["apollia-llm/local"]
## CPU explicite (alias de local pour la lisibilité).
local-cpu = ["local", "apollia-llm/local-cpu"]
## GPU Apple Silicon via Metal.
local-metal = ["local", "apollia-llm/local-metal"]
## CPU + Accelerate.framework Apple (BLAS vectorisé, macOS uniquement).
local-accelerate = ["local", "apollia-llm/local-accelerate"]
## GPU NVIDIA CUDA.
local-cuda = ["local", "apollia-llm/local-cuda"]

[dependencies]
apollia-core          = { workspace = true }
apollia-llm           = { workspace = true, features = ["cloud"] }
apollia-notifications = { workspace = true }
apollia-pipelines     = { path = "../apollia-pipelines" }
apollia-tools         = { workspace = true }
apollia-triggers      = { path = "../apollia-triggers" }
async-trait           = { workspace = true }
chrono             = { workspace = true }
hmac               = "0.12"
sha2               = "0.10"
hex                = "0.4"
constant_time_eq   = "0.3"
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
axum               = { workspace = true }
tokio-stream       = { workspace = true }
hyper-util         = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
uuid               = { workspace = true }
rusqlite           = { workspace = true }
toml               = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
http-body-util = { workspace = true }
