[package]
name = "apollia-runtime"
version = "0.1.0"
edition = "2021"
description = "Apollia OS - Runtime Core (Supervisor, AgentRegistry, TaskRouter, EventBus, APIServer axum)"
license = "MIT OR Apache-2.0"

[features]
# Multi-runner : les backends locaux d'inférence (llama-cpp, whisper)
# sont hébergés par le crate `apollia-runner` en tant que process enfant.
# Aucune feature `local-*` n'est exposée par le daemon : la couche
# d'inférence locale n'est plus directement compilée ici.
default = ["cloud", "web-search", "brave-search", "web-read"]
## Active les backends cloud (Anthropic, OpenAI-compatible, etc.).
cloud = ["apollia-llm/cloud"]
## Native web search tool.
web-search = ["apollia-tools/web-search"]
## Brave Search backend for web_search - requires BRAVE_SEARCH_API_KEY at runtime.
brave-search = ["web-search", "apollia-tools/brave-search"]
## Native web_read tool (fetch + Readability extraction).
web-read = ["apollia-tools/web-read"]

[dependencies]
apollia-core          = { workspace = true }
apollia-prompts       = { workspace = true }
apollia-llm           = { workspace = true, features = ["cloud"] }
apollia-workspace     = { path = "../apollia-workspace" }
apollia-stt           = { workspace = true }
apollia-memory        = { workspace = true }
apollia-notifications = { workspace = true }
apollia-oria          = { workspace = true }
apollia-mcp           = { path = "../apollia-mcp" }
apollia-tools         = { workspace = true, features = ["http", "memory-search"] }
apollia-permissions   = { workspace = true }
apollia-triggers      = { path = "../apollia-triggers" }
apollia-auth          = { workspace = true }
apollia-connectors    = { workspace = true }
async-trait           = { workspace = true }
futures            = { workspace = true }
chrono             = { workspace = true }
hmac               = "0.12"
sha2               = "0.10"
hex                = "0.4"
constant_time_eq   = "0.3"
rand               = { workspace = true }
tokio              = { workspace = true }
# CancellationToken for cooperative pause/resume of the chat ReAct loop.
tokio-util         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
axum               = { workspace = true }
utoipa             = { workspace = true }
tokio-stream       = { workspace = true }
hyper-util         = { workspace = true }
tower              = { workspace = true }
uuid               = { workspace = true }
rusqlite           = { workspace = true }
toml               = { workspace = true }
hound              = { workspace = true }
base64             = { workspace = true }
dirs               = "5"
# Client HTTP pour RunnerProxy.
reqwest            = { workspace = true, features = ["json", "stream"] }
# WAV temporaire pour RunnerSttBackend (sérialise les buffers PCM avant
# de les envoyer au runner via /stt/transcribe).
tempfile           = "3"

[target.'cfg(target_os = "windows")'.dependencies]
wmi = "0.16"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
http-body-util = { workspace = true }
proptest = "1"

[lints]
workspace = true
