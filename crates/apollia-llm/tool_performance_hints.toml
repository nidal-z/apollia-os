# Per-tool performance hints for the native tools.
#
# `expected_duration_ms`: estimated p50; used to show an informative hint
#   before execution ("Expected duration: Xms").
# `faster_alternative` (optional): a short phrase suggesting a faster tool
#   for the context (for instance file_grep -> file_glob for a path pattern).

[tools.file_read]
expected_duration_ms = 50

[tools.file_write]
expected_duration_ms = 60

[tools.file_edit]
expected_duration_ms = 80

[tools.file_list]
expected_duration_ms = 100

[tools.file_glob]
expected_duration_ms = 150

[tools.file_grep]
expected_duration_ms = 400
faster_alternative = "file_glob when the pattern is about paths, not contents"

[tools.bash_executor]
expected_duration_ms = 1500

[tools.python_executor]
expected_duration_ms = 2000

[tools.http_fetch]
expected_duration_ms = 800

[tools.web_search]
expected_duration_ms = 1200

[tools.web_read]
expected_duration_ms = 1500

[tools.memory_search]
expected_duration_ms = 120
