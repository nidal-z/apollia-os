[package]
name = "apollia-llm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = ["cloud"]

# ADR-113 : les backends d'inférence locale (llama-cpp) sont hébergés par le
# crate `apollia-runner` (sidecar). Cette crate ne contient plus que les
# clients cloud HTTP et les types partagés (CompletionModel, LlmRouter, etc.).

# Backend cloud (API HTTP : Anthropic, OpenAI-compatible, Vertex)
cloud            = ["dep:async-openai", "dep:reqwest"]

[dependencies]
apollia-core   = { workspace = true }
tokio          = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
futures        = { workspace = true }
async-trait    = { workspace = true }
rusqlite       = { workspace = true }
uuid           = { workspace = true }
# cloud backends [feature = "cloud"]
async-openai   = { workspace = true, optional = true }
reqwest        = { workspace = true, optional = true }
tokio-stream   = { workspace = true }
tokio-util     = { workspace = true }
chrono         = { workspace = true }
# MetaLlmOrchestrator — ADR-073
lru            = { workspace = true }
sha2           = { workspace = true }
# tool_performance_hints — US-SP42-038
toml           = { workspace = true }
# Hardware detection (RAM, CPU, GPU — toujours disponible)
sysinfo        = { workspace = true }

[dev-dependencies]
tempfile = "3"
