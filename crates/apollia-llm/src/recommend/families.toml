# The model generations Apollia knows how to rank, and what makes one better
# than another.
#
# ── Why this file exists ──────────────────────────────────────────────────
#
# The HuggingFace Hub is the catalogue: it knows which repositories exist, what
# their files weigh, which are gated. It does not know which model is better.
# The signals it does expose, downloads and likes, measure accumulated
# popularity, and accumulation favours whatever has been available longest.
# Qwen2.5 has been downloaded far more times than Qwen3 and will keep that lead
# for as long as the counter is cumulative. Ranking on any Hub signal therefore
# recommends the older model, which is the exact failure this table prevents.
#
# So: the Hub answers "what exists and what does it cost", this file answers
# "which one should we offer first".
#
# ── Schema ────────────────────────────────────────────────────────────────
#
# [[family]] describes one model generation, not one file.
#
#   id            stable key, referenced by `supersedes`
#   label         what the operator reads
#   publisher     the organisation that trained it
#   released      ISO date of the generation's first public release
#   architectures `general.architecture` values its GGUF files carry, which is
#                 how a probed file is matched back to this entry
#   supersedes    ids of generations this one replaces. Transitive: naming the
#                 immediate predecessor is enough, the loader walks the chain
#   tool_calling  native | prompted | none. `native` means the published chat
#                 template emits tool calls that llama.cpp's --jinja path
#                 parses, which is what an agent runtime needs
#   hf_query      the search string that finds this family's GGUF repositories
#   repo_patterns publishers of GGUF conversions, in preference order.
#                 `{model}` expands to the variant's `hf_name`
#   license       SPDX identifier, shown before a download starts
#
# [[family.variant]] describes one size within a generation.
#
#   params_b      parameter count in billions, the size class
#   hf_name       the upstream repository name, used to expand `repo_patterns`
#   agentic       0-100, how well it drives tools and follows instructions.
#                 This is the ranking key, because running agents is what this
#                 runtime does. Sourced from the tool-use benchmark cited in
#                 `source`, rescaled to 0-100
#   reasoning     0-100, general capability, used to break agentic ties
#   source        URL the two scores were read from
#
# ── Refreshing ────────────────────────────────────────────────────────────
#
# Every score below must be re-read from its cited `source` before a release,
# and every `released` date must be the publisher's own. A number no one can
# trace to a source is worse than no number: it ranks models with the authority
# of a measurement and the content of a guess. `scripts/check-model-families.py`
# fails on an entry whose `source` is missing or whose `released` date is in the
# future.
#
# When a new generation lands, add it with `supersedes` pointing at the one it
# replaces rather than editing the old entry. The chain is what lets a machine
# that already runs the old model be told a newer one now fits.

schema_version = 1

# ── Qwen ──────────────────────────────────────────────────────────────────

[[family]]
id = "qwen3.5"
label = "Qwen3.5"
publisher = "Qwen"
released = "2026-02-12"
architectures = ["qwen35", "qwen35moe"]
supersedes = ["qwen3"]
tool_calling = "native"
license = "apache-2.0"
hf_query = "Qwen3.5 GGUF"
repo_patterns = ["unsloth/{model}-GGUF", "bartowski/Qwen_{model}-GGUF", "lmstudio-community/{model}-GGUF"]
notes = """Hybrid attention: one layer in four keeps a key/value cache, the rest carry linear-attention state, so a long context costs about a quarter of what the same depth costs Qwen3. Qwen publish no GGUF of their own for this generation, so the publishers above are the community conversions."""

