# The models Apollia pins to one file by its digest.
#
# Three kinds of entry live here: the embeddings models, the dictation files
# and the character-recognition language data. Each names one file of one
# repository and its SHA-256, so a download is checked against it and a copy
# brought from a disk is recognised by it. Every fact cites the address it was
# read from, and `scripts/check-model-families.py` holds the file to that.
#
# The language models are not here. They are the cards of the model registry
# (`registry/models/`), and the first-launch suggestion orders them by a rule
# (`registry_source.rs`), not by anything written in this file.
#
# ── Embeddings ────────────────────────────────────────────────────────────
#
# [[embedding]] describes one embeddings model: a model that turns a text into a
# vector for search by meaning, never one that answers a chat. It is pinned to
# one file, and never ranked against a language model.
#
#   id              stable key
#   label           what the operator reads
#   publisher       the organisation that trained it
#   released        ISO date of its first public release
#   license         SPDX identifier
#   repo            the HuggingFace repository carrying the GGUF, `owner/name`
#   file            the GGUF file within it
#   quantization    the quantisation of that file
#   size_bytes      its size, as the repository tree reports it
#   sha256          its SHA-256, read from the repository tree (`lfs.oid`). The
#                   download is checked against it, and a file imported from a
#                   disk is recognised by it
#   architecture    the `general.architecture` its header carries
#   dimensions      length of the vector it produces
#   context_length  tokens it reads at most per text
#   pooling         mean | last | cls, how the engine reduces a text to one
#                   vector (`--pooling`)
#   query_prefix    text put before a search query, as its model card asks
#   passage_prefix  text put before a passage to index, as its model card asks
#   source          URL the facts above were read from
#   by_request      optional, true for an entry that is listed and never
#                   recommended: the machine is offered the largest of the
#                   others, so adding a file here does not change what a first
#                   launch downloads
#
# ── Dictation ─────────────────────────────────────────────────────────────
#
# [[dictation]] describes one speech-to-text model file for the dictation
# engine (whisper.cpp). Like an embeddings entry it is pinned to one file by its
# digest and never ranked against a language model; the machine is offered the
# largest file that still fits beside the language model it runs.
#
#   id              stable key, the name `apollia-os stt model download` takes
#   label           what the operator reads
#   publisher       the organisation that trained it
#   released        ISO date the upstream model repository was published on
#                   the Hub
#   license         SPDX identifier, read on the repository carrying the file
#   repo            the HuggingFace repository carrying the file, `owner/name`
#   file            the whisper.cpp file within it (`.bin`, GGML header)
#   quantization    the quantisation of that file, F16 when it has none
#   size_bytes      its size, as the repository tree reports it
#   sha256          its SHA-256, read from the repository tree (`lfs.oid`). The
#                   download is checked against it
#   card            the identifier of the dictation card describing the model,
#                   under `registry/models/dictation/`
#   source          URL the size and digest were read from

schema_version = 1

