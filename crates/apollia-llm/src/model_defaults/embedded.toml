# Sampling defaults pour les familles de modèles populaires.
#
# Sources : `generation_config.json` officiel publié par les éditeurs sur
# HuggingFace Hub. Les valeurs sont des FAITS (paramètres recommandés par
# l'éditeur) — non-copyrightables sous Feist (US) et la directive 96/9/CE (UE).
# Pas de redistribution du modèle ; uniquement les params recommandés.
#
# Matching : `arch_pattern` est testé contre `general.architecture` du GGUF
# (lower-case, exact OU prefix terminé par `*`). `name_pattern` est testé
# contre `general.name` ou le filename GGUF (lower-case, substring).
#
# Précédence à la résolution : entrées plus haut dans la liste l'emportent.
# Garder donc les patterns les plus spécifiques en haut (Qwen3-Thinking
# avant Qwen3 générique, Llama-3.1 avant Llama générique).
#
# Mise à jour : si vous modifiez/ajoutez une entrée, citez la source dans
# le commit (URL du `generation_config.json` HF).

# ── Qwen ────────────────────────────────────────────────────────
[[entry]]
name = "Qwen3 (thinking)"
arch_pattern = "qwen3"
name_pattern = "thinking"
temperature = 0.6
top_p = 0.95
top_k = 20
# Source: https://huggingface.co/Qwen/Qwen3-30B-A3B-Thinking-2507/blob/main/generation_config.json

[[entry]]
name = "Qwen3 (instruct)"
arch_pattern = "qwen3"
temperature = 0.7
top_p = 0.8
top_k = 20
# Source: https://huggingface.co/Qwen/Qwen3-30B-A3B/blob/main/generation_config.json

[[entry]]
name = "Qwen2.5"
arch_pattern = "qwen2"
temperature = 0.7
top_p = 0.8
top_k = 20
repetition_penalty = 1.05
# Source: https://huggingface.co/Qwen/Qwen2.5-7B-Instruct/blob/main/generation_config.json

