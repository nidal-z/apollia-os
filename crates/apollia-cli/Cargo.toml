[package]
name = "apollia-cli"
version = "0.1.0"
edition = "2021"
description = "Apollia OS CLI binary (apollia-os)"
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[[bin]]
name = "apollia-os"
path = "src/main.rs"

[features]
default = ["cloud"]
## Enables the cloud backends (Anthropic, OpenAI-compatible, Vertex).
## Local LLM and STT backends live in the `apollia-runner` sidecar crate;
## the CLI talks to the daemon, which spawns and supervises the runner.
cloud = ["apollia-llm/cloud"]

[dependencies]
apollia-auth      = { workspace = true }
apollia-connectors = { workspace = true }
apollia-core      = { workspace = true }
apollia-workspace = { workspace = true }
apollia-aip      = { workspace = true }
apollia-mcp      = { workspace = true }
apollia-permissions = { workspace = true }
apollia-tools    = { workspace = true }
apollia-triggers = { workspace = true }
apollia-memory   = { workspace = true }
apollia-oria     = { workspace = true }
apollia-runtime  = { workspace = true }
apollia-llm      = { workspace = true, default-features = false }
apollia-eval     = { workspace = true }
chrono           = { workspace = true }
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
serde_yaml         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
clap_complete      = { workspace = true }
uuid               = { workspace = true }
hyper              = { workspace = true }
hyper-util         = { workspace = true }
http-body-util     = { workspace = true }
toml               = { workspace = true }
toml_edit          = { workspace = true }
rpassword          = { workspace = true }
pyo3               = { workspace = true }
async-trait        = { workspace = true }
futures            = { workspace = true }
hf-hub             = { workspace = true }
indicatif          = { workspace = true }
semver             = { workspace = true }
scopeguard         = { workspace = true }
sha2               = { workspace = true }
reqwest            = { workspace = true }
rustyline          = "14"
dirs               = "5"
open               = { workspace = true }

[dev-dependencies]
tempfile = "3"
rusqlite = { workspace = true }

[lints]
workspace = true
