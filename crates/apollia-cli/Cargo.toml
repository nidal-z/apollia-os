[package]
name = "apollia-cli"
version = "0.1.0"
edition = "2021"
description = "Apollia OS — CLI binary (apollia-os)"
license = "MIT"

[[bin]]
name = "apollia-os"
path = "src/main.rs"

[features]
default = ["cloud"]
## Active le backend cloud (Anthropic, OpenAI-compatible) — activé par défaut.
cloud = ["apollia-llm/cloud"]
## Active le backend embarqué in-process (inférence .gguf via mistralrs).
local = ["apollia-llm/local"]

[dependencies]
apollia-core     = { workspace = true }
apollia-aip      = { workspace = true }
apollia-memory   = { workspace = true }
apollia-oria     = { workspace = true }
apollia-runtime  = { workspace = true }
apollia-llm      = { workspace = true, default-features = false }
apollia-triggers = { workspace = true }
cron             = { workspace = true }
chrono           = { workspace = true }
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
uuid               = { workspace = true }
hyper              = { workspace = true }
hyper-util         = { workspace = true }
http-body-util     = { workspace = true }
toml               = { workspace = true }

[dev-dependencies]
tempfile = "3"
