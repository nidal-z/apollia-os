[package]
name = "apollia-cli"
version = "0.1.0"
edition = "2021"
description = "Apollia OS — CLI binary (apollia-os)"
license = "MIT"

[[bin]]
name = "apollia-os"
path = "src/main.rs"

[features]
default = ["cloud"]
## Active le backend cloud (Anthropic, OpenAI-compatible) — activé par défaut.
cloud = ["apollia-llm/cloud"]
## Active le backend embarqué in-process (inférence .gguf via mistralrs) — CPU seul.
local = ["apollia-llm/local"]
## CPU explicite (alias de local pour la lisibilité).
local-cpu = ["local", "apollia-llm/local-cpu"]
## GPU Apple Silicon via Metal (inclut local pour les #[cfg(feature = "local")] dans la CLI).
local-metal = ["local", "apollia-llm/local-metal"]
## CPU + Accelerate.framework Apple (BLAS vectorisé, macOS uniquement).
local-accelerate = ["local", "apollia-llm/local-accelerate"]
## GPU NVIDIA CUDA (déclaré, non testé).
local-cuda = ["local", "apollia-llm/local-cuda"]
## Backend STT whisper.cpp (activé par défaut via apollia-stt).
stt-whisper-cpp = ["apollia-stt/stt-whisper-cpp"]
## Accélération Metal pour STT (Apple Silicon GPU).
stt-metal = ["apollia-stt/stt-metal"]
## Accélération CUDA pour STT (NVIDIA GPU).
stt-cuda = ["apollia-stt/stt-cuda"]

[dependencies]
apollia-core     = { workspace = true }
apollia-aip      = { workspace = true }
apollia-mcp      = { workspace = true }
apollia-tools    = { workspace = true }
apollia-memory   = { workspace = true }
apollia-oria     = { workspace = true }
apollia-runtime  = { workspace = true }
apollia-llm      = { workspace = true, default-features = false }
apollia-stt      = { workspace = true, default-features = false }
chrono           = { workspace = true }
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
uuid               = { workspace = true }
hyper              = { workspace = true }
hyper-util         = { workspace = true }
http-body-util     = { workspace = true }
toml               = { workspace = true }
pyo3               = { workspace = true }
async-trait        = { workspace = true }
futures            = { workspace = true }
hf-hub             = { workspace = true }
indicatif          = { workspace = true }

[dev-dependencies]
tempfile = "3"
rusqlite = { workspace = true }
