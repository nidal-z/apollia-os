[package]
name = "apollia-desktop"
version = "0.1.0"
edition = "2021"
description = "Apollia OS — Desktop application (Tauri v2 + embedded runtime)"
license = "MIT OR Apache-2.0"

[features]
## Fonctionnalités activées par défaut : backend cloud + STT whisper.cpp (CPU).
## Surcharger avec --no-default-features pour une compilation minimale.
default = ["cloud", "stt-whisper-cpp"]
## Active le backend cloud (Anthropic, OpenAI-compatible).
cloud = ["apollia-runtime/cloud"]
## Active le backend embarqué in-process (inférence .gguf via mistralrs) — CPU seul.
local = ["apollia-runtime/local"]
## CPU explicite (alias de local pour la lisibilité).
local-cpu = ["local", "apollia-runtime/local-cpu"]
## GPU Apple Silicon via Metal.
local-metal = ["local", "apollia-runtime/local-metal"]
## CPU + Accelerate.framework Apple (BLAS vectorisé, macOS uniquement).
local-accelerate = ["local", "apollia-runtime/local-accelerate"]
## GPU NVIDIA CUDA.
local-cuda = ["local", "apollia-runtime/local-cuda"]
## Backend STT whisper.cpp (CPU) — active aussi le cfg-gate dans apollia-runtime.
stt-whisper-cpp = ["apollia-stt/cpu", "apollia-runtime/stt-whisper-cpp"]
## Accélération Metal pour STT (Apple Silicon GPU).
stt-metal = ["stt-whisper-cpp", "apollia-stt/metal", "apollia-runtime/stt-metal"]
## Accélération CUDA pour STT (NVIDIA GPU).
stt-cuda = ["stt-whisper-cpp", "apollia-stt/cuda", "apollia-runtime/stt-cuda"]

[dependencies]
reqwest          = { workspace = true }
apollia-runtime  = { workspace = true }
apollia-mcp      = { path = "../apollia-mcp" }
apollia-llm      = { workspace = true, default-features = false }
apollia-stt      = { workspace = true, default-features = false }
apollia-core     = { workspace = true }
apollia-memory   = { workspace = true }
apollia-tools        = { workspace = true }
apollia-workspace    = { workspace = true }
apollia-permissions  = { path = "../apollia-permissions" }
apollia-aip      = { workspace = true }
apollia-triggers = { workspace = true }
apollia-oria     = { workspace = true }
async-trait      = { workspace = true }
futures          = { workspace = true }
pyo3             = { workspace = true }
chrono           = { workspace = true }
rusqlite         = { workspace = true }
uuid             = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
tokio            = { workspace = true }
hyper            = { workspace = true }
hyper-util       = { workspace = true }
http-body-util   = { workspace = true }
toml             = { workspace = true }
open             = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
tauri          = { version = "2", features = ["devtools", "tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
dirs = "5"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
sysinfo          = { workspace = true }
arboard          = { workspace = true }
enigo            = { workspace = true }
hound            = { workspace = true }
keyring          = { version = "3", features = ["apple-native", "linux-native"] }
scraper          = "0.26"
url              = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
