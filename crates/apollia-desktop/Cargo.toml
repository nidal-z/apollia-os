[package]
name = "apollia-desktop"
version = "0.1.0"
edition = "2021"
description = "Apollia OS — Desktop application (Tauri v2 + embedded runtime)"
license = "MIT"

[features]
## Active le backend cloud (Anthropic, OpenAI-compatible) — activé par défaut.
cloud = ["apollia-runtime/cloud"]
## Active le backend embarqué in-process (inférence .gguf via mistralrs) — CPU seul.
local = ["apollia-runtime/local"]
## CPU explicite (alias de local pour la lisibilité).
local-cpu = ["local", "apollia-runtime/local-cpu"]
## GPU Apple Silicon via Metal.
local-metal = ["local", "apollia-runtime/local-metal"]
## CPU + Accelerate.framework Apple (BLAS vectorisé, macOS uniquement).
local-accelerate = ["local", "apollia-runtime/local-accelerate"]
## GPU NVIDIA CUDA.
local-cuda = ["local", "apollia-runtime/local-cuda"]

[dependencies]
apollia-runtime  = { workspace = true }
apollia-llm      = { workspace = true, default-features = false }
apollia-core     = { workspace = true }
apollia-memory   = { workspace = true }
apollia-tools    = { workspace = true }
apollia-aip      = { workspace = true }
apollia-oria     = { workspace = true }
async-trait      = { workspace = true }
futures          = { workspace = true }
pyo3             = { workspace = true }
chrono           = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
tokio            = { workspace = true }
hyper            = { workspace = true }
hyper-util       = { workspace = true }
http-body-util   = { workspace = true }
toml             = { workspace = true }
open             = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
tauri          = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
