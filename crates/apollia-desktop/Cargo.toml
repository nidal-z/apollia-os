[package]
name = "apollia-desktop"
version = "0.1.0"
edition = "2021"
description = "Apollia OS - Desktop application (Tauri v2 + embedded runtime)"
license = "MIT OR Apache-2.0"

[features]
# Multi-runner : les backends d'inférence locale vivent dans le crate
# `apollia-runner` (sidecar). Le desktop ne forward plus de features `local-*`
# ou `stt-*` au runtime - l'inférence est dispatchée au runner via IPC HTTP.
default = ["cloud"]
## Active les backends cloud (Anthropic, OpenAI-compatible, etc.).
cloud = ["apollia-runtime/cloud"]

[dependencies]
reqwest          = { workspace = true }
apollia-runtime  = { workspace = true }
apollia-mcp      = { path = "../apollia-mcp" }
apollia-llm      = { workspace = true, default-features = false }
apollia-stt      = { workspace = true, default-features = false }
apollia-core     = { workspace = true }
apollia-memory   = { workspace = true }
apollia-tools        = { workspace = true }
apollia-workspace    = { workspace = true }
apollia-permissions  = { path = "../apollia-permissions" }
apollia-aip      = { workspace = true }
apollia-triggers = { workspace = true }
apollia-oria     = { workspace = true }
apollia-auth        = { workspace = true }
apollia-connectors  = { workspace = true }
dashmap             = "6"
async-trait      = { workspace = true }
futures          = { workspace = true }
pyo3             = { workspace = true }
chrono           = { workspace = true }
rusqlite         = { workspace = true }
uuid             = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
tokio            = { workspace = true }
hyper            = { workspace = true }
hyper-util       = { workspace = true }
http-body-util   = { workspace = true }
toml             = { workspace = true }
base64           = { workspace = true }
open             = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
tauri          = { version = "2", features = ["devtools", "tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
dirs = "5"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
sysinfo          = { workspace = true }
arboard          = { workspace = true }
enigo            = { workspace = true }
hound            = { workspace = true }
keyring          = { version = "3", features = ["apple-native", "linux-native"] }
scraper          = "0.26"
url              = "2"
urlencoding      = { workspace = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.rust]
# FFI / proc-macro generated unsafe (pyo3, tauri, llama/whisper bindings).
unsafe_code = "allow"
