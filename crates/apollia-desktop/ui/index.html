<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- No remote font link here, ever. Inter Tight, Inter and JetBrains Mono are
       bundled through @fontsource and imported from src/main.ts, so a fresh
       launch contacts nobody. A <link> to a font CDN would leak the IP,
       User-Agent, Accept-Language and launch cadence of every user on startup,
       which contradicts the sovereignty guarantee the product is sold on. -->
  <title>Apollia OS</title>
  <script>
    (function() {
      var mode = localStorage.getItem("apollia-theme") || "system";
      var isDark = mode === "dark" ||
        (mode === "system" && globalThis.matchMedia("(prefers-color-scheme: dark)").matches);
      if (isDark) document.documentElement.classList.add("dark");
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
