<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recording</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    /* 4px inset so the component never touches the window edge.
       Any OS-level 1px window border falls in the transparent gap. */
    #overlay {
      position: absolute;
      inset: 4px;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <script type="module" src="/src/overlay.ts"></script>
</body>
</html>
