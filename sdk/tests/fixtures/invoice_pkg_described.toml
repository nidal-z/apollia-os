# Example package: one agent, two tools, one workflow.

[package]
name = "invoices"
version = "0.1.0"
publisher = "Example"
description = "Read invoices and file their totals."
sdk = ">=0.3.0"

[[agents]]
id = "accountant"
name = "Accountant"
mission = "Answer questions about the invoices of a folder."

# A stale tool table that describe replaces.

# Connections the package needs.
[[requires]]
type = "gmail"
reason = "Send the monthly summary."

# Written by `python -m apollia describe` from the code; edits here are replaced.
[[tools]]
name = "extract_totals"
module = "invoice_tools/tools.py"
description = "Read the totals of one invoice."
action = "read"
inputs = { type = "object", properties = { path = { type = "string", description = "path of the invoice" } }, additionalProperties = false, required = ["path"] }

[[tools]]
name = "file_totals"
module = "invoice_tools/tools.py"
description = "File totals in the \"ledger\" sheet."
action = "write_or_delete"
inputs = { type = "object", properties = { totals = { type = "array", items = { type = "number" } }, sheet = { type = "string" } }, additionalProperties = false, required = ["totals"] }

[[workflows]]
name = "close-month"
module = "invoice_tools/flows.py"
description = "Extract every invoice of a folder and file the totals."
action = "write_or_delete"
inputs = { type = "object", properties = { folder = { type = "string", description = "folder holding the month's invoices" }, notify = { type = "boolean" }, closing_day = { type = "string", format = "date" }, note = { type = "string", format = "long-text", description = "a note filed with the totals" }, ledger = { type = "string", format = "file-path" } }, additionalProperties = false, required = ["folder"], x-order = ["folder", "notify", "closing_day", "note", "ledger"] }
steps = ["extract", "file"]
