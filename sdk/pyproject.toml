[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apollia-sdk"
version = "0.5.0"
description = "Python SDK for Apollia OS agent development"
requires-python = ">=3.10"
license = {text = "MIT OR Apache-2.0"}
dependencies = []

[project.scripts]
apollia = "apollia.cli.__main__:_entry"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apollia*"]

[tool.mypy]
strict = true
