[advisories]
# "all" rather than "workspace": the narrower scope silenced 17 unmaintained
# advisories carried by transitive dependencies, and a silenced advisory is
# indistinguishable from a clean tree. Every one the tree carries today is
# named below with its provenance and its lift condition.
unmaintained = "all"
# Advisories we cannot upgrade away in this release window. Each entry is
# revisited every release; remove once the upstream fix is released or the
# dependency tree no longer pulls the affected version.
ignore = [
    # Transitive from the tauri GTK backend (tao, wry, webkit2gtk), Linux
    # desktop only, no patch yet: the gtk-rs GTK3 bindings are unmaintained
    # upstream. Not encountered on macOS/Windows builds (kept for
    # cross-platform CI). Lift condition: tauri moves off GTK3.
    "RUSTSEC-2024-0411", # gdkwayland-sys: unmaintained (gtk-rs GTK3)
    "RUSTSEC-2024-0412", # gdk: unmaintained (gtk-rs GTK3)
    "RUSTSEC-2024-0413", # atk: unmaintained (gtk-rs GTK3)
    "RUSTSEC-2024-0414", # gdkx11-sys: unmaintained (gtk-rs GTK3)
    "RUSTSEC-2024-0415", # gtk: unmaintained (gtk-rs GTK3)
    "RUSTSEC-2024-0416", # atk-sys: unmaintained (gtk-rs GTK3)
    "RUSTSEC-2024-0417", # gdkx11: unmaintained (gtk-rs GTK3)
    "RUSTSEC-2024-0418", # gdk-sys: unmaintained (gtk-rs GTK3)
    "RUSTSEC-2024-0419", # gtk3-macros: unmaintained (gtk-rs GTK3)
    "RUSTSEC-2024-0420", # gtk-sys: unmaintained (gtk-rs GTK3)
    "RUSTSEC-2024-0370", # proc-macro-error: unmaintained, via gtk3-macros
    # zip 4 (apollia-runtime, apollia-sources) and zip 8 (calamine,
    # office_oxide): the three advisories concern `ZipArchive::extract` and
    # `ZipStreamReader::extract`, which write an archive to disk. Nothing in
    # the tree extracts an archive: packages, workbooks and office documents
    # are read entry by entry, in memory. The fix is zip 9, a major version.
    # Lift condition: the workspace and calamine/office_oxide move to zip 9.
    "RUSTSEC-2026-0367", # zip: SUID/SGID bits kept on extraction
    "RUSTSEC-2026-0368", # zip: extracted symlinks may point outside the target
    "RUSTSEC-2026-0369", # zip: permissions applied through extracted symlinks
    # zbus 5 (notify-rust, Linux desktop notifications): its name and value
    # crates were merged into zbus 6 and are no longer published apart. No
    # safe upgrade exists in zbus 5. Lift condition: notify-rust moves to
    # zbus 6.
    "RUSTSEC-2026-0370", # zvariant: unmaintained, merged into zbus 6
    "RUSTSEC-2026-0371", # zbus_names: unmaintained, merged into zbus 6
    "RUSTSEC-2026-0372", # zvariant_derive: unmaintained, merged into zbus 6
    # In apollia-llm through async-openai's HTTP retry layer (backoff, and
    # instant underneath it); apollia-llm declares backoff to bound that
    # retry. Lift condition: async-openai migrates off backoff upstream.
    "RUSTSEC-2025-0012", # backoff: unmaintained
    "RUSTSEC-2024-0384", # instant: unmaintained, via backoff
    # Transitive via urlpattern, pulled by tauri. The unic project is
    # unmaintained; urlpattern has not moved off it. Lift condition:
    # urlpattern or tauri drops the unic crates.
    "RUSTSEC-2025-0075", # unic-char-range: unmaintained
    "RUSTSEC-2025-0080", # unic-common: unmaintained
    "RUSTSEC-2025-0081", # unic-char-property: unmaintained
    "RUSTSEC-2025-0098", # unic-ucd-version: unmaintained
    "RUSTSEC-2025-0100", # unic-ucd-ident: unmaintained
    # Transitive via indicatif (CLI progress bars) and hf-hub. Lift
    # condition: indicatif moves off number_prefix.
    "RUSTSEC-2025-0119", # number_prefix: unmaintained
    # Transitive via i18n-embed-fl, pulled by age (apollia-auth secret
    # store). Lift condition: i18n-embed-fl moves off proc-macro-error2.
    "RUSTSEC-2026-0173", # proc-macro-error2: unmaintained
    # Via serde_yaml, itself deprecated, which apollia-aip uses in one place:
    # reading the YAML data files a package ships (datasources.rs). The crate
    # is flagged unmaintained, not vulnerable. Lift condition: the data files
    # are read by a maintained YAML parser, a dependency change to decide.
    "RUSTSEC-2024-0449", # unsafe-libyaml: unmaintained
    # pyo3 0.24 soundness advisories. The fix lands in pyo3 0.29, a major
    # upgrade of pyo3 + pyo3-async-runtimes deliberately deferred past this
    # release window. The affected exploit paths (new_closure, the nth
    # iterator adapter) are not on any Apollia code path. Lift condition:
    # the pyo3 0.29 migration.
    "RUSTSEC-2026-0176", # pyo3: out-of-bounds read
    "RUSTSEC-2026-0177", # pyo3: missing Sync bound
    # Exempted on 2026-10-04. Transitive via pdf_oxide alone (the PDF reader
    # of apollia-sources), which parses embedded fonts with ttf-parser. The
    # crate is unmaintained, no vulnerability is known in it, and no newer
    # release exists to move to. Lift condition: pdf_oxide drops ttf-parser,
    # or a maintained release of it appears.
    "RUSTSEC-2026-0192", # ttf-parser 0.25.1: unmaintained, via pdf_oxide
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
