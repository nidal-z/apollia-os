# Apollia OS - agent bundle manifest
# Built-in system agent, embedded in the desktop binary at compile time.

[agent]
name = "onboarding-agent"
version = "0.1.0-preview"
description = "First user contact - two-phase calibration: the four Tier 1 facts, then profile enrichment"
license = "MIT OR Apache-2.0"
authors = ["Nidal Zoumita <contact@apollia.fr>"]
tags = ["onboarding", "conversational", "system"]

[agent.manifest]
agent_type = "system"
execution_mode = "auto"
# The onboarding-agent proposes the permission rules matching the preferences
# it collected (sovereignty, hitl, integrations), through HITL-gated tool
# calls. permission_rule_remove is deliberately not exposed (least privilege:
# reset and cleanup go through the Settings UI or the CLI).
tools_required = ["permission_rule_add", "permission_rule_list"]
tools_optional = []
memory_namespace = "onboarding"
supports_streaming = false
supports_a2a = false
max_concurrent_tasks = 1
dangerous_tools_allowed = false

[agent.runtime]
python = ">=3.10"
apollia_sdk = "==0.1.0-preview"

[agent.dependencies]
packages = []
