# Apollia OS — agent bundle manifest (ADR-074)
# Built-in system agent, embedded in the desktop binary at compile time.

[agent]
name = "onboarding-agent"
version = "2.4.0"
description = "Premier contact utilisateur — calibrage en 3 questions (identité, supervision, souveraineté)"
license = "MIT OR Apache-2.0"
authors = ["Nidal Zoumita <nidal.zoumita@gmail.com>"]
tags = ["onboarding", "conversational", "system"]

[agent.manifest]
agent_type = "system"
execution_mode = "auto"
# ADR-086 — l'onboarding-agent propose les règles de permissions correspondant
# aux préférences collectées (sovereignty, hitl, integrations) via des appels
# d'outils HITL-gated. permission_rule_remove n'est volontairement pas exposé
# (moindre privilège : reset/cleanup passe par UI Settings ou CLI).
tools_required = ["permission_rule_add", "permission_rule_list"]
tools_optional = []
memory_namespace = "onboarding"
supports_streaming = false
supports_a2a = false
max_concurrent_tasks = 1
dangerous_tools_allowed = false

[agent.runtime]
python = ">=3.11,<3.14"
apollia_sdk = ">=0.5,<0.6"

[agent.dependencies]
packages = []
