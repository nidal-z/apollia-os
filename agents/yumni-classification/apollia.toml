# Apollia OS runtime config for the Yumni ESRS-classification PoC.
#
# The agents call `ctx.llm` and NEVER hardcode a model. The runtime picks the
# backend using [llm.routing] below. Philosophy: SOVEREIGN-LOCAL FIRST.
#
#   * "local"  -> the EMBEDDED llama.cpp inference engine (apollia-runner sidecar).
#                 A `provider = "llama-cpp"` backend whose `model` is the absolute
#                 path to a local .gguf. Inference runs in-process, on-machine;
#                 RSE data never leaves the host. No Ollama / external server.
#   * "cloud"  -> an optional Anthropic fallback for higher-quality reasoning,
#                 used ONLY if you explicitly switch routing.default (or route a
#                 specific agent to it). Commented out by default so the PoC is
#                 sovereign out of the box.

# ---------------------------------------------------------------------------
# LLM backends
# ---------------------------------------------------------------------------

# Sovereign local backend — served by the embedded apollia-runner (llama.cpp).
# For provider = "llama-cpp", `model` is the ABSOLUTE PATH to the .gguf file
# (see runner_supervisor: LlmBackendConfig.model is the gguf path). The runner
# loads it in-process; nothing is downloaded or sent off-machine.
[[llm.backends]]
name = "local"
provider = "llama-cpp"
model = "/Users/nidalzoumita/.apollia/models/Ministral-3-8B-Instruct-2512-Q5_K_M.gguf"

# --- Optional cloud fallback (Anthropic) -----------------------------------
# Uncomment to enable a cloud backend. Only used if routing.default = "cloud"
# or an agent is explicitly routed here. Enabling it means RSE data leaves the
# local machine, so keep it OFF for sovereign deployments.
#
# [[llm.backends]]
# name = "cloud"
# provider = "anthropic"
# api_url = "https://api.anthropic.com"
# model = "claude-3-5-haiku-latest"   # cheap, strong at constrained JSON
# api_key_env = "ANTHROPIC_API_KEY"

# ---------------------------------------------------------------------------
# Routing - sovereign-local by default.
# ---------------------------------------------------------------------------

[llm.routing]
# Every ctx.llm call resolves to the local llama.cpp backend unless overridden.
default = "local"

# Example: route only the adversarial verifier to the cloud for a stronger
# second opinion, while proposals stay local. (Requires the "cloud" backend
# above to be uncommented.)
#
# [llm.routing.by_agent]
# "esrs-verifier" = "cloud"
