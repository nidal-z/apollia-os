# MCP server registration snippet for the Yumni connector.
#
# The director calls three tools through ctx.tools.call("mcp:yumni/<name>", ...):
#   mcp:yumni/get_action_context  - read one action's title/description/context
#   mcp:yumni/list_criteria       - the CLOSED list of real ESRS criteria codes
#   mcp:yumni/create_mapping      - persist an accepted mapping (approval-gated)
#
# The connector is built SEPARATELY in the Yumni repo, not here:
#   yumni/integrations/apollia/mcp-server/dist/index.js  (stdio transport)
#
# Merge this block into your Apollia OS MCP config (or `apollia-os mcp add`).

[[mcp.servers]]
name = "yumni"
transport = "stdio"
command = "node"
args = ["yumni/integrations/apollia/mcp-server/dist/index.js"]

  # The connector authenticates to the Yumni backend with a scoped AI token.
  # Provided via env, never committed. The token should be scoped to the
  # tenant + read context/criteria + (optionally) create_mapping.
  [mcp.servers.env]
  YUMNI_AI_TOKEN = "${YUMNI_AI_TOKEN}"

  # APPROVAL GATE: create_mapping writes into Yumni, so require human approval
  # before it runs. The AI classifies; the human commits the decision.
  [mcp.servers.approvals]
  "create_mapping" = "required"
