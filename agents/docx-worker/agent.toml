# agent.toml — docx-worker v0.1.0
#
# Worker Apollia OS standalone, distribuable seul.
# Installation : apollia agent install ./docx-worker

[package]
name        = "docx-worker"
version     = "0.1.0"
description = "Manipulation de fichiers Word (.docx) : lire, écrire, ajouter, extraire des tables, rendre des templates Jinja2 — préserve styles, sections, headers/footers."
author      = "Apollia OS"
license     = "MIT"

[[agents]]
name                    = "docx-worker"
entry                   = "docx-worker.py"
role                    = "worker"
agent_type              = "user"
execution_mode          = "direct"
supports_a2a            = true
max_concurrent_tasks    = 2
tools_required          = []
dangerous_tools_allowed = false
packages                = ["python-docx==1.1.2", "docxtpl==0.18.0"]
tags                    = ["docx", "word", "office", "python-docx", "docxtpl", "template", "worker"]
step_budget             = { max_steps = 1, max_tool_calls = 5, wall_clock_secs = 300 }

[[agents.skills]]
id           = "docx.read"
name         = "Read DOCX document"
description  = "Lit un .docx et retourne JSON structuré : blocs ordonnés (paragraphes/headings/tables/listes/page_breaks), métadonnées de section (orientation, marges), hyperlinks, styles utilisés."
input_modes  = ["text"]
output_modes = ["text"]

[[agents.skills]]
id           = "docx.write"
name         = "Write DOCX document"
description  = "Crée un .docx multi-section avec styles avancés (named_styles paragraph+font+table, blocks paragraph/heading/table/list/image/page_break/section_break, headers/footers avec 10 placeholders, orientation/margins par section)."
input_modes  = ["text"]
output_modes = ["text"]

[[agents.skills]]
id           = "docx.append-section"
name         = "Append content to DOCX"
description  = "Ajoute des blocs à un .docx existant. Préserve styles, headers/footers, sections existantes. Option section_break_before pour démarrer une nouvelle section."
input_modes  = ["text"]
output_modes = ["text"]

[[agents.skills]]
id           = "docx.extract-tables"
name         = "Extract tables from DOCX"
description  = "Extraction ciblée des tables uniquement. Plus rapide que docx.read quand le caller veut juste les tables (avec détection optionnelle de la 1ère ligne comme headers)."
input_modes  = ["text"]
output_modes = ["text"]

[[agents.skills]]
id           = "docx.render-from-template"
name         = "Render DOCX from Jinja2 template"
description  = "Rend un template .docx (placeholders Jinja2 {{ var }}, {% for %}, {% if %} via docxtpl) en injectant un contexte. strict_undefined par défaut. Différenciateur pour livrables business (contrats, lettres-types)."
input_modes  = ["text"]
output_modes = ["text"]
