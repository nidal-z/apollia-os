# Pilier 3, Datasource: Sonar rules priority + remediation hints per language.
#
# Loaded by the director and forwarded to sonar-cleanup-worker. The worker
# pulls real issues from MCP sonarqube, then ranks them by the priority
# table below before attempting fixes. The hints are pure prompt context
# for the local LLM: they do not act as code rewrites.
#
# Override priority: ctx.workspace > this file > {} fallback.

languages:

  rust:
    sonar_repository: "rust"
    harness: "cargo build -p {crate} --quiet"
    extra_checks:
      - "cargo clippy -p {crate} --quiet --no-deps -- -D warnings"
    fix_priority:
      # rule_id: target severity ranking (lower = first)
      "rust:S3776": 1       # cognitive complexity > 15
      "rust:S107":  2       # too many parameters
      "rust:S125":  3       # commented-out code
      "rust:S1192": 4       # duplicated string literals
      "rust:S5713": 5       # except chains
    avoid:
      - "any rule on #[pymethods] blocks (signature is user contract)"
      - "deny.toml / Cargo.toml, leave dependency surgery to humans"

  python:
    sonar_repository: "python"
    harness: "ruff check {path} --select F401,F841,ERA001,F811"
    extra_checks:
      - "python -m py_compile {path}"
    fix_priority:
      "python:S3776": 1
      "python:S7503": 2     # unused args
      "python:S125":  3
      "python:S107":  4
      "python:S1192": 5
      "python:S5713": 6
    avoid:
      - "Protocol method bodies (`...`), contract surface"
      - "Test fixtures with parameters named for clarity"

  typescript:
    sonar_repository: "typescript"
    harness: "pnpm -C crates/apollia-desktop/ui exec tsc --noEmit"
    extra_checks:
      - "pnpm -C crates/apollia-desktop/ui exec eslint {path}"
    fix_priority:
      "typescript:S7764": 1   # window -> globalThis
      "typescript:S7773": 2   # parseInt -> Number.parseInt
      "typescript:S7778": 3
      "typescript:S3358": 4
      "typescript:S6551": 5
      "typescript:S3776": 6
    avoid:
      - "DOM event handlers with required arg shape"
      - "Spec files (.spec.ts) under tests, use NOSONAR if needed"

  svelte:
    sonar_repository: "typescript"
    harness: "pnpm -C crates/apollia-desktop/ui check"
    extra_checks: []
    fix_priority:
      "typescript:S3776": 1
      "typescript:S3358": 2
    avoid:
      - "Anything that changes rendered HTML output"
