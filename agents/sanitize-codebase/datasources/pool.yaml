# Pilier 3, Datasource: file pool to walk.
#
# The director uses these globs (relative to the repo root) to discover
# candidate files, then ranks them by language priority and persists one
# `file:{path}` entry per candidate the first time it sees them.
#
# Override priority: ctx.workspace > this file > {} fallback.

repo_root: "."

batch_size: 4              # files per interval tick (10 min), keep small to stay under wall_clock_secs

# Language groups. Order matters: the director walks groups top-down.
groups:

  - name: "rust-crates"
    language: "rust"
    crate_from_path: true   # extract crate from `crates/<name>/...`
    includes:
      - "crates/apollia-*/src/**/*.rs"
    excludes:
      - "crates/apollia-*/tests/**"
      - "crates/apollia-*/target/**"

  - name: "python-sdk"
    language: "python"
    crate: "sdk"
    includes:
      - "sdk/apollia/**/*.py"
    excludes:
      - "sdk/apollia/__pycache__/**"

  - name: "python-agents"
    language: "python"
    crate: "agents"
    includes:
      - "agents/**/*.py"
    excludes:
      - "agents/sanitize-codebase/**"   # never sanitize ourselves
      - "agents/**/__pycache__/**"

  - name: "frontend-ts"
    language: "typescript"
    crate: "apollia-desktop"
    includes:
      - "crates/apollia-desktop/ui/src/**/*.ts"
    excludes:
      - "crates/apollia-desktop/ui/src/**/*.spec.ts"
      - "crates/apollia-desktop/ui/node_modules/**"

  - name: "frontend-svelte"
    language: "svelte"
    crate: "apollia-desktop"
    includes:
      - "crates/apollia-desktop/ui/src/**/*.svelte"
    excludes:
      - "crates/apollia-desktop/ui/node_modules/**"
