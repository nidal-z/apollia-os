# agent.toml — xlsx-worker v0.1.0
#
# Worker Apollia OS standalone, distribuable seul.
# Installation : apollia agent install ./xlsx-worker

[package]
name        = "xlsx-worker"
version     = "0.1.0"
description = "Manipulation de fichiers Excel (.xlsx) : lire, écrire, ajouter des lignes, patcher des cellules ciblées — préserve types, formules et merged cells. Styles avancés (named styles, conditional formatting, sizing) et lecture pandas.DataFrame."
author      = "Apollia OS"
license     = "MIT"

[[agents]]
name                    = "xlsx-worker"
entry                   = "xlsx-worker.py"
role                    = "worker"
agent_type              = "user"
execution_mode          = "direct"
supports_a2a            = true
max_concurrent_tasks    = 2
tools_required          = []
dangerous_tools_allowed = false
packages                = ["openpyxl==3.1.5", "pandas==2.2.3"]
tags                    = ["xlsx", "excel", "spreadsheet", "openpyxl", "pandas", "worker"]
step_budget             = { max_steps = 1, max_tool_calls = 5, wall_clock_secs = 300 }

[[agents.skills]]
id           = "xlsx.read"
name         = "Read XLSX workbook"
description  = "Lit un fichier .xlsx et retourne JSON structuré (feuilles, lignes typées, merged ranges, freeze panes). Mode 'values' (résultats des formules) ou 'formulas' (texte des formules)."
input_modes  = ["text"]
output_modes = ["text"]

[[agents.skills]]
id           = "xlsx.read-as-dataframe"
name         = "Read XLSX as pandas DataFrame"
description  = "Lit un .xlsx en pandas.DataFrame, infère les dtypes, retourne les records JSON. Header detection, skip/nrows pagination, dtypes_hint pour forcer les types."
input_modes  = ["text"]
output_modes = ["text"]

[[agents.skills]]
id           = "xlsx.write"
name         = "Write XLSX workbook"
description  = "Crée un .xlsx multi-sheet avec styles avancés : named styles réutilisables, conditional formatting, sizing colonnes/lignes, freeze panes, auto-filter."
input_modes  = ["text"]
output_modes = ["text"]

[[agents.skills]]
id           = "xlsx.append-rows"
name         = "Append rows to XLSX sheet"
description  = "Ajoute des lignes à une feuille existante sans toucher au reste — préserve formules, styles, merged cells, freeze panes."
input_modes  = ["text"]
output_modes = ["text"]

[[agents.skills]]
id           = "xlsx.update-cells"
name         = "Update specific XLSX cells"
description  = "Patch ciblé cellule par cellule (A1 notation). Préserve les formules des cellules non touchées. Retourne erreurs par cellule (ref invalide, valeur non sérialisable)."
input_modes  = ["text"]
output_modes = ["text"]
