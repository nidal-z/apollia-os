# Apollia OS — Template gallery registry (US-SP42-058).
#
# Registry source of truth. Each entry points at a `.toml` file shipped in
# the `agents/templates/{kind}/` subdirectory. The runtime parses this file
# at startup and exposes it through the `templates_*` Tauri commands.
#
# Conventions:
#   * `id` is stable and used by analytics + "Based on template {id}" badges.
#   * `kind` = "automation" | "agent" | "pipeline".
#   * `difficulty` = "simple" | "intermediate" | "advanced".
#   * `source` = "official" (shipped with Apollia) | "community" (later).
#   * `category` = "productivity" | "dev" | "communication" | "creative"
#                | "analysis" | "system".

schema_version = 1

# ─── Automations (5) ──────────────────────────────────────────────────────

[[templates]]
id = "weekly-spec-digest"
kind = "automation"
category = "productivity"
difficulty = "simple"
source = "official"
author = "Apollia"
title = "Weekly spec summary"
description = "Every Monday morning, ask the spec assistant to summarize what changed in your specs last week."
path = "automations/weekly-spec-digest.toml"
dependencies = ["spec-assistant"]

[[templates]]
id = "daily-linear-inbox"
kind = "automation"
category = "dev"
difficulty = "simple"
source = "official"
author = "Apollia"
title = "Daily Linear inbox alert"
description = "Each morning at 8am, pull new Linear issues assigned to you and post a briefing."
path = "automations/daily-linear-inbox.toml"
dependencies = ["linear-mcp", "dev-assistant"]

[[templates]]
id = "pr-review-poll"
kind = "automation"
category = "dev"
difficulty = "intermediate"
source = "official"
author = "Apollia"
title = "Open PR watcher"
description = "Every 30 minutes, scan open pull requests and flag reviews that need your attention."
path = "automations/pr-review-poll.toml"
dependencies = ["review-assistant"]

[[templates]]
id = "competitive-watch"
kind = "automation"
category = "analysis"
difficulty = "intermediate"
source = "official"
author = "Apollia"
title = "Competitor watch"
description = "Once a day, search the web for updates on your tracked competitors and distill the signal."
path = "automations/competitive-watch.toml"
dependencies = ["web-search"]

[[templates]]
id = "daily-standup-brief"
kind = "automation"
category = "communication"
difficulty = "simple"
source = "official"
author = "Apollia"
title = "Daily standup briefing"
description = "Each morning, prepare a 3-bullet standup summary based on yesterday's activity."
path = "automations/daily-standup-brief.toml"
dependencies = ["dev-assistant"]

