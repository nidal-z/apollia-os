kind = "pipeline"
name = "Incident triage"
description = "Gather logs, cross-reference with deploy history, and draft an incident summary."

[[steps]]
id = "gather-logs"
agent = "dev-assistant"
prompt = "Collect the last 500 lines of the relevant service logs."

[[steps]]
id = "correlate"
agent = "dev-assistant"
prompt = "Cross-reference the log anomalies with the last 5 deploys. Identify the likely culprit."
depends_on = ["gather-logs"]

[[steps]]
id = "summary"
agent = "spec-assistant"
prompt = "Draft the incident write-up: timeline, impact, root cause hypothesis, next steps."
depends_on = ["correlate"]
requires_approval = true
