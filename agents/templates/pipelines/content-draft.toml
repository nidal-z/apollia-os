kind = "pipeline"
name = "Content drafting"
description = "Outline → draft → polish a blog post or announcement in three supervised stages."

[[steps]]
id = "outline"
agent = "spec-assistant"
prompt = "Produce a tight outline (H1 + H2s + one-line bullets) for the piece."
requires_approval = true

[[steps]]
id = "draft"
agent = "spec-assistant"
prompt = "Write the full draft following the approved outline."
depends_on = ["outline"]

[[steps]]
id = "polish"
agent = "review-assistant"
prompt = "Tighten prose, remove filler, check accuracy. Output the final version."
depends_on = ["draft"]
