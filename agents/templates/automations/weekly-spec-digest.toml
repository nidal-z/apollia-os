# Automation template — Weekly spec summary (US-SP42-058).
#
# Consumed by `templates_instantiate` : the returned structure feeds the
# automation wizard (US-SP42-050) pre-filled.

kind = "automation"
name = "Weekly spec summary"

[source]
kind = "cron"
# Every Monday at 09:00 local time.
expression = "0 9 * * MON"

[target]
agent = "spec-assistant"
prompt = "Summarize what changed across the specs in the last 7 days. Group by project and flag pending decisions."
