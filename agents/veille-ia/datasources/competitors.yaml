# datasources/competitors.yaml
# Concurrents Apollia OS à monitorer (extrait de docs/internal/research/agents-2026/10-cartographie-concurrents.md).
# Lecture priorité : ctx.workspace.get("Veille IA — Competitors") > ce fichier > defaults.

competitors:
  # ===== DIRECTS — plateformes d'agents autonomes =====
  - id: n8n
    name: n8n
    category: direct
    urls:
      - https://blog.n8n.io
      - https://github.com/n8n-io/n8n/releases
      - https://n8n.io/ai-agents/
    signals: ["AI", "agent", "multi-agent", "MCP", "vector store", "self-host"]
    threat_level: high
    notes: "Concurrent le plus dangereux DIY/PME. Sustainable Use License, hybrid open/closed."

  - id: zapier-central
    name: Zapier Central
    category: direct
    urls:
      - https://zapier.com/blog/categories/agents/
    signals: ["AI agent", "Central", "Activities", "Connectors"]
    threat_level: medium
    notes: "Géant grand public, vendor lock-in. Pas direct sur Apollia (cible knowledge workers)."

  - id: make
    name: Make.com
    category: direct
