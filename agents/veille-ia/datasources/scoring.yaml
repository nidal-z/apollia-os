# datasources/scoring.yaml
# Critères de scoring pour les articles veille-ia.
# Lecture priorité : ctx.workspace.get("Veille IA — Scoring") > ce fichier > defaults.

# Score final = somme pondérée des critères qui matchent.
# Articles avec score >= critical_threshold sont marqués `is_critical=true` et déclenchent une alerte HITL.

criteria:
  - id: direct-competitor-move
    weight: 5
    description: "Concurrent direct annonce nouvelle feature, funding, pivot, ou breakthrough."
    matchers:
      keywords: ["Series A", "Series B", "Series C", "Series D", "raised", "funding round", "acquired", "acquisition", "pivot", "GA release", "launches"]
      entity_categories: ["direct"]

  - id: standards-shift
    weight: 4
    description: "MCP / A2A / AGNTCY évolution majeure (nouveau primitive, breaking change, adoption massive)."
    matchers:
      keywords: ["MCP roadmap", "A2A spec", "MCP breaking", "AgentCard", "Tasks primitive", "AGNTCY"]

  - id: roadmap-impact
    weight: 4
    description: "Tech impactant directement la roadmap Apollia (Rust agents, mémoire, sandbox, runtime souverain)."
    matchers:
      keywords: ["Rust agent", "agent OS", "local-first AI", "sovereign AI", "EU AI Act", "agent runtime", "PyO3 agent"]

  - id: research-breakthrough
    weight: 3
    description: "Paper avec résultats notables (eval, mémoire, context engineering, planning)."
    matchers:
      keywords: ["state-of-the-art", "SOTA", "breakthrough", "outperforms", "+20%", "+50%", "novel architecture"]

  - id: ecosystem-move
    weight: 2
    description: "Mouvement écosystème Python/Rust/agents (release framework, integration, partenariat)."
    matchers:
      keywords: ["release", "integration", "partnership", "supports", "adds support"]

  - id: regulation
    weight: 3
    description: "Évolution réglementaire (EU AI Act, NIST, RGPD, compliance agents)."
    matchers:
      keywords: ["EU AI Act", "NIST AI RMF", "AI compliance", "GDPR AI", "regulation"]

# Seuil pour marquer is_critical (déclenche alerte HITL)
critical_threshold: 5

# Seuil pour inclure dans le rapport (sinon filtré)
include_threshold: 2

# Boost si plusieurs critères matchent (additif simple)
multi_criteria_bonus: 0
