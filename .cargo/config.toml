# Default environment for all cargo commands.
# force = false : shell env vars take precedence (CI overrides via $GITHUB_ENV).
# PyO3 resolves the interpreter from PATH by default. If your default python3
# is not the interpreter you want to build against, export PYO3_PYTHON in your
# shell or an uncommitted local override. Do not commit a machine-specific path.
[env]
# Aligns the macOS target on the real system version (Python 3.13 and Rust 1.89
# from Homebrew both target 15.0; without this value the linker warns on every
# build).
MACOSX_DEPLOYMENT_TARGET = { value = "15.0", force = false }

# The C++ half of the static CRT decided further down. cargo hands this to
# every process it starts, build scripts included, so whisper-rs-sys builds
# ggml against the same runtime rustc links against. It used to be set by the
# CI workflow alone, and by two packaging recipes: a build driven from the
# justfile, which is what the runbook asks for, therefore could not link at
# all on Windows. Measured on 2026-09-08: 24 unresolved `__imp_*` symbols on
# `just desktop-dev-automation-seeded`, on a machine with the toolchain in
# place. Harmless anywhere else, where nothing reads it.
CMAKE_MSVC_RUNTIME_LIBRARY = { value = "MultiThreaded", force = false }

# ── Faster dev profile ───────────────────────────────────────────────────────
# split-debuginfo = "unpacked": keeps the macOS linker from aggregating the
# debug info into a .dSYM, which saves 20 to 40% of the link time in dev.
# codegen-units = 256: parallelises codegen as far as it goes (fewer
# optimisations, faster build; acceptable in dev, never in release).
[profile.dev]
split-debuginfo = "unpacked"
codegen-units = 256

# ── Static CRT linking for Windows ───────────────────────────────────────────
# Avoids the runtime dependency on the "Visual C++ Redistributable" on the
# user's machine. The binary embeds vcruntime140.dll and msvcp140.dll directly,
# so there is nothing extra to install.
#
# It has to be matched on the C/C++ side (whisper-rs-sys), otherwise the link
# fails on /MD against /MT. That is what CMAKE_MSVC_RUNTIME_LIBRARY does, in
# the [env] block above, so every cargo command carries it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
