="bold" lengthAdjust="spacing" textLength="54.2578" x="350" y="1198.0195">Patterns:</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="193.7402" x="350" y="1212.1523">- Always validate input file exists</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="188.0684" x="350" y="1226.2852">- Return structured JSON output</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="164.2676" x="350" y="1240.418">- Report errors with context</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="3.7969" x="350" y="1254.5508">&#160;</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="92.5254" x="350" y="1268.6836">Error handling:</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="229.5352" x="350" y="1282.8164">- On tool failure: retry once, then abort</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="197.7949" x="350" y="1296.9492">- On timeout: return partial result</text><rect fill="#FFFFFF" height="3" style="stroke:#FFFFFF;stroke-width:1;" width="1365.4785" x="5" y="1329.5469"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="1370.4785" y1="1329.5469" y2="1329.5469"/><line style="stroke:#000000;stroke-width:0.5;" x1="5" x2="1370.4785" y1="1332.5469" y2="1332.5469"/><rect fill="#FFFFFF" height="22.1328" style="stroke:#000000;stroke-width:1;" width="146.4219" x="614.5283" y="1319.4805"/><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="128.4668" x="620.5283" y="1335.082">Phase 6 : ReAct Loop</text><path d="M470.6035,1358.6133 L542.7852,1358.6133 L542.7852,1364.7461 L532.7852,1374.7461 L470.6035,13