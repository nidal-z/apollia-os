<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="668px" preserveAspectRatio="none" style="width:918px;height:668px;background:#FFFFFF;" version="1.1" viewBox="0 0 918 668" width="918px" zoomAndPan="magnify"><title>CircuitBreaker State Machine &#8212; ResilienceLayer &#8212; Apollia OS</title><defs><linearGradient id="g1sv9xnkm6diix0" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1A1A2E"/><stop offset="100%" stop-color="#E0E0FF"/></linearGradient><linearGradient id="g1sv9xnkm6diix1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#4A3728"/><stop offset="100%" stop-color="#F5E6D3"/></linearGradient><linearGradient id="g1sv9xnkm6diix2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#2A3A4A"/><stop offset="100%" stop-color="#CCE5FF"/></linearGradient></defs><g><g class="title" data-source-line="8"><text fill="#000000" font-family="'JetBrains Mono'" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="691.3457" x="109.2362" y="36.2695">CircuitBreaker State Machine &#8212; ResilienceLayer &#8212; Apollia OS</text></g><g class="entity" data-qualified-name="Closed" id="ent0002"><rect fill="url(#g1sv9xnkm6diix0)" height="76.5313" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="238.8477" x="432.57" y="138.9102"/><line style="stroke:#000000;stroke-width:1;" x1="432.57" x2="671.4177" y1="163.043" y2="163.043"/><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="39.498" x="532.2448" y="155.5117">Closed</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="194.3848" x="437.57" y="179.6445">Tool calls pass through normally.</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="218.8477" x="437.57" y="193.7773">Failure counter incremented on error.</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="163.0547" x="437.57" y="207.9102">Success resets counter to 0.</text></g><g class="entity" data-qualified-name="Open" id="ent0003"><rect fill="url(#g1sv9xnkm6diix1)" height="76.5313" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="198.8223" x="367.58" y="305.4402"/><line style="stroke:#000000;stroke-width:1;" x1="367.58" x2="566.4023" y1="329.573" y2="329.573"/><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="31.0078" x="451.4872" y="322.0417">Open</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="154.1016" x="372.58" y="346.1745">Tool blocked immediately.</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="154.1016" x="372.58" y="360.3073">Returns CircuitOpen error.</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="178.8223" x="372.58" y="374.4402">Cooldown timer running (30s).</text></g><g class="entity" data-qualified-name="HalfOpen" id="ent0004"><rect fill="url(#g1sv9xnkm6diix2)" height="62.3984" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="195.7461" x="417.12" y="471.9702"/><line style="stroke:#000000;stroke-width:1;" x1="417.12" x2="612.8661" y1="496.103" y2="496.103"/><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="54.334" x="487.8261" y="488.5717">HalfOpen</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="136.1133" x="422.12" y="512.7045">Single test call allowed.</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="175.7461" x="422.12" y="526.8373">Next result decides transition.</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="10" id="ent0002"><ellipse cx="551.99" cy="67.9102" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="24" id="ent0003"><path d="M706.16,150.9702 L706.16,173.1702 L671.71,177.1702 L706.16,181.1702 L706.16,203.3686 A0,0 0 0 0 706.16,203.3686 L911.8182,203.3686 A0,0 0 0 0 911.8182,203.3686 L911.8182,160.9702 L901.8182,150.9702 L706.16,150.9702 A0,0 0 0 0 706.16,150.9702" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M901.8182,150.9702 L901.8182,160.9702 L911.8182,160.9702 L901.8182,150.9702" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="171.8906" x="712.16" y="167.5717">Each tool has an independent</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="140.2793" x="712.16" y="181.7045">circuit breaker instance.</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="184.6582" x="712.16" y="195.8373">Failures are tracked per tool_id.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="30" id="ent0006"><path d="M11,317.5102 L11,369.9086 A0,0 0 0 0 11,369.9086 L332.9785,369.9086 A0,0 0 0 0 332.9785,369.9086 L332.9785,347.7002 L367.26,343.7002 L332.9785,339.7002 L332.9785,327.5102 L322.9785,317.5102 L11,317.5102 A0,0 0 0 0 11,317.5102" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M322.9785,317.5102 L322.9785,327.5102 L332.9785,327.5102 L322.9785,317.5102" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="111.2754" x="17" y="334.1117">EventBus emission:</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="300.9785" x="17" y="348.2445">CLOSED -&gt; OPEN : CircuitBroken { tool_id, failures }</text><ellipse cx="22.5" cy="357.4086" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="226.1953" x="29" y="362.3773">-&gt; CLOSED : CircuitRestored { tool_id }</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="36" id="ent0009"><path d="M424.5,595.3702 L424.5,661.9014 A0,0 0 0 0 424.5,661.9014 L605.4785,661.9014 A0,0 0 0 0 605.4785,661.9014 L605.4785,605.3702 L595.4785,595.3702 L518.99,595.3702 L514.99,534.6902 L510.99,595.3702 L424.5,595.3702 A0,0 0 0 0 424.5,595.3702" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M595.4785,595.3702 L595.4785,605.3702 L605.4785,605.3702 L595.4785,595.3702" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="145.3008" x="430.5" y="611.9717">Only ONE concurrent call</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="159.9785" x="430.5" y="626.1045">is permitted in HALF_OPEN.</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="129.0352" x="430.5" y="640.2373">Additional calls return</text><text fill="#000000" font-family="'JetBrains Mono'" font-size="12" lengthAdjust="spacing" textLength="155.9531" x="430.5" y="654.3702">CircuitOpen until resolved.</text></g><!--link *start* to Closed--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="10" id="lnk3"><path d="M551.99,78.0502 C551.99,91.4302 551.99,111.1002 551.99,132.8302" fill="none" id="*start*-to-Closed" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="551.99,138.8302,555.99,129.8302,551.99,133.8302,547.99,129.8302,551.99,138.8302" style="stroke:#444444;stroke-width:1;"/><