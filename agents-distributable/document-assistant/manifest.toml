# Apollia OS — agent bundle manifest (ADR-074)
# Source of truth pour les métadonnées statiques (indexation marketplace).
# Le contrat AIP reste dicté par la fonction manifest() de agent.py.

[agent]
name = "document-assistant"
version = "2.0.0"
description = """\
Consultant agent for document processing — Excel, CSV, PDF, SQLite. \
Identifies the right specialised worker via A2A and translates results \
into plain business language. Designed for any profile — no technical \
skill required. Stack-agnostic: asks the user when the format is unknown.\
"""
license = "MIT OR Apache-2.0"
authors = ["Nidal Zoumita <nidal.zoumita@gmail.com>"]
tags = [
    "document", "excel", "csv", "pdf", "sqlite",
    "consultant", "a2a-orchestrator", "business-user",
]

[agent.manifest]
agent_type = "assistant"
execution_mode = "auto"
tools_required = ["file_read", "ask_user"]
tools_optional = [
    "bash_executor", "file_list",
    "a2a:read-excel", "a2a:analyze-excel", "a2a:edit-excel",
    "a2a:read-csv", "a2a:analyze-csv", "a2a:transform-csv",
    "a2a:read-pdf", "a2a:extract-text", "a2a:extract-tables",
    "a2a:query-sql", "a2a:schema-inspect", "a2a:data-export",
]
memory_namespace = "document-assistant"
supports_streaming = true
supports_a2a = true

[agent.runtime]
python = ">=3.11,<3.14"
apollia_sdk = ">=0.3,<0.4"

[agent.dependencies]
packages = []
