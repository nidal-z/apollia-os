# Apollia OS — agent bundle manifest (ADR-074)
# Source of truth pour les métadonnées statiques (indexation marketplace).
# Le contrat AIP reste dicté par la fonction manifest() de agent.py.

[agent]
name = "dev-assistant"
version = "2.0.0"
description = """\
Consultant agent for codebase exploration and feature implementation. Loads \
a TaskSpec, plans layer by layer, delegates actual code writes to \
code-worker via A2A. Also answers architecture and implementation questions \
by reading the project. Stack-agnostic: adapts to Rust, Python, JS, or any \
other language present in the workspace.\
"""
license = "MIT OR Apache-2.0"
authors = ["Nidal Zoumita <nidal.zoumita@gmail.com>"]
tags = [
    "development", "implementation", "exploration",
    "pipeline-dev", "consultant", "agnostic", "a2a-orchestrator",
]

[agent.manifest]
agent_type = "assistant"
execution_mode = "auto"
tools_required = ["file_read", "file_write"]
tools_optional = [
    "bash_executor", "file_list", "file_grep", "ask_user", "memory_search",
    "a2a:generate-code", "a2a:refactor-code", "a2a:review-code", "a2a:git-commit",
]
tools_requiring_approval = ["bash_executor"]
memory_namespace = "dev-assistant"
supports_streaming = true
supports_a2a = true

[agent.runtime]
python = ">=3.11,<3.14"
apollia_sdk = ">=0.3,<0.4"

[agent.dependencies]
packages = []
