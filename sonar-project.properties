# SonarQube config for the Apollia OS pre-launch sanitize (chantier G, Phase 0).
# Local Community Build only. Not part of the public release surface.
# Drive a local scan with docs/internal/release/scripts/sonar-scan.sh.

sonar.projectKey=apollia-os
sonar.projectName=Apollia OS
sonar.host.url=http://localhost:9100

# Sources and tests must be disjoint roots. `crates` already covers the
# frontend under crates/apollia-desktop/ui, so do not also list its subpaths.
sonar.sources=crates,sdk,agents
sonar.tests=tests

# Global exclusions: build artifacts, vendored deps, internal-only docs.
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  docs/internal/**,\
  docs/specs/**,\
  **/*.min.js,\
  crates/apollia-desktop/ui/public/**

# Rust: native analyzer + imported Clippy report (generated by sonar-scan.sh).
sonar.rust.clippy.reportPaths=.sonar/clippy-report.json

# Python: SDK + bundled agents.
sonar.python.version=3.11,3.12

# Encoding.
sonar.sourceEncoding=UTF-8

# Project-level rule exclusions for residue that cannot be cleared without
# breaking public contracts or third-party API constraints. Each entry is a
# deliberate, documented decision (not silent suppression).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
# e1: Svelte 4 ComponentType retained for lucide-svelte icon compat across the UI.
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.e1.resourceKey=crates/apollia-desktop/ui/src/**/*.ts
# e2: external CSS hosted on Google Fonts cannot carry an SRI hash (dynamic charset).
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S5725
sonar.issue.ignore.multicriteria.e2.resourceKey=crates/apollia-desktop/ui/index.html
# e3: intentional Tauri mock nesting in e2e specs (avoids hoist gotchas).
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.e3.resourceKey=crates/apollia-desktop/ui/tests/**/*.spec.ts
# e4: Python decorator factories and Protocol methods cannot reshape their public params.
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e4.resourceKey=sdk/apollia/**/*.py
# e5: Rust #[pymethods] keep their Python-facing signatures intact.
sonar.issue.ignore.multicriteria.e5.ruleKey=rust:S107
sonar.issue.ignore.multicriteria.e5.resourceKey=crates/apollia-aip/src/**/*.rs
# e6: test fixtures intentionally minimal HTML (no lang attribute needed for snapshots).
sonar.issue.ignore.multicriteria.e6.ruleKey=Web:S5254
sonar.issue.ignore.multicriteria.e6.resourceKey=crates/**/tests/fixtures/**
